[package]
name = "superschematic-rules-handler-wasm"
description = "Development mode's request handler (D117, D103's step 6) with the behaviors ported onto the core, behind a JSON-in, JSON-out C ABI that @superschematic/rules-handler loads as a WebAssembly module: a request run over the reads answered so far, the HTTP router's route and respond, the event queue's pages and frames, and the tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "superschematic_rules_handler_wasm"
# cdylib for the wasm32-unknown-unknown module @superschematic/rules-handler
# (runtime/rules-handler/typescript) loads, built with plain cargo as
# rules-wasm's is; rlib for this crate's tests and docs. A static archive
# for a Go or Python library over the same C ABI is a crate type away.
crate-type = ["cdylib", "rlib"]

# Like the handler and the core, nothing here does I/O (D103): the module
# imports nothing from its host, reads no clock and draws no random number.
# The host gives each request its time and a fresh UUID.
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# The engine's JSON features (D58): a number keeps its text, an object its
# members' order, as the handler reads and writes them.
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
superschematic-rules = { path = "../rules" }
superschematic-rules-behaviors = { path = "../rules-behaviors" }
superschematic-rules-handler = { path = "../rules-handler" }

[lints]
workspace = true
