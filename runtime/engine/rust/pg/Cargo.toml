[package]
name = "superschematic-engine-pg"
description = "The rules crates' one Postgres layer: the class of a SQLSTATE each maps its errors from, and a connection string's sslmode read as the HTTP runtime reads it, with the TLS that honours it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The TLS a connection opens with: rustls on ring, through
# tokio-postgres-rustls, which the synchronous postgres crate and
# tokio-postgres both connect with. Pure Rust, so what links it links no
# system TLS library and runs on a host without OpenSSL.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:tokio-postgres-rustls"]

[dependencies]
# The server's error, whose SQLSTATE classify reads. The client every crate
# that depends on this one already holds (the postgres crate is over it).
tokio-postgres = { version = "0.7.18", default-features = false }
# ring as the crypto provider, already in the workspace's tree; TLS 1.2 for
# a server that offers no 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# The system's roots, which verify-ca and verify-full check the server's
# certificate against, as the HTTP runtime's native-tls does.
rustls-native-certs = { version = "0.8.5", optional = true }
# The MakeTlsConnect over a rustls client config, with the channel binding
# SCRAM-SHA-256-PLUS asks for.
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
# The connect test's client, the one storage, rules-runtime and rules-dev
# connect with.
postgres = "0.19.14"

# A connection with each sslmode to the Postgres
# SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL names.
[[test]]
name = "connect"
required-features = ["tls"]

[lints]
workspace = true
