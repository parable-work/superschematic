[package]
name = "superschematic-engine-ffi"
description = "The core's engine archive (D58): the engine's C ABI over the core's behaviors, the static archive a Go server links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "superschematic_engine_ffi"
# staticlib: libsuperschematic_engine.a, which cgo links with no shared
# object to ship (scripts/engine-archive.sh names it so). rlib: the crate's
# own tests, which call its exports.
crate-type = ["staticlib", "rlib"]

[features]
# The databases the engine opens, both by default, as the engine has them.
default = ["sqlite", "postgres"]
sqlite = ["superschematic-engine-abi/sqlite", "superschematic-engine-behaviors/sqlite"]
postgres = ["superschematic-engine-abi/postgres", "superschematic-engine-behaviors/postgres"]

[dependencies]
# The ABI's implementation and export_engine_c_abi!, which this crate
# expands over the core's behaviors.
superschematic-engine-abi = { path = "../abi", default-features = false }
# The core's behaviors, which the archive registers when an engine opens:
# whatever core() returns when it is built.
superschematic-engine-behaviors = { path = "../behaviors", default-features = false }

[dev-dependencies]
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }

[lints]
workspace = true
