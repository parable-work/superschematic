[package]
name = "superschematic-engine-testkit"
description = "The engine's test kit: the scenario replayer that holds the Rust engine to the TypeScript engine's recorded answers, on SQLite and Postgres (D58)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The databases the replayer runs on, as the engine has them.
default = ["sqlite", "postgres"]
sqlite = ["superschematic-engine/sqlite", "superschematic-engine-behaviors/sqlite", "superschematic-engine-workqueue/sqlite", "superschematic-engine-commerce/sqlite"]
postgres = ["superschematic-engine/postgres", "superschematic-engine-behaviors/postgres", "superschematic-engine-workqueue/postgres", "superschematic-engine-commerce/postgres"]
# The HTTP corpus through the engine's axum router as well (D58): each
# exchange in process through tower's oneshot, a stream's body pulled
# frame by frame.
axum = ["superschematic-engine/axum", "dep:axum", "dep:futures-util", "dep:tokio", "dep:tower"]

[dependencies]
# The axum feature's transport, at the engine's versions.
axum = { version = "0.8.9", default-features = false, optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
superschematic-engine = { path = "../engine", default-features = false }
# The core's behaviors, which the TypeScript engine registers when it opens:
# the replayer opens every engine with them.
superschematic-engine-behaviors = { path = "../behaviors", default-features = false }
# The work queue's behaviors, which a recording names when its engine
# registered @superschematic/engine-workqueue, and the work queue's tests
# open with the core's.
superschematic-engine-workqueue = { path = "../../../engine-workqueue/rust", default-features = false }
# The commerce behaviors (D70), and the supply contract the commerce tests
# hold a test supply and a stand-in claim to.
superschematic-engine-commerce = { path = "../../../engine-commerce/rust", default-features = false }
tokio = { version = "1.52.2", default-features = false, features = ["rt-multi-thread", "time"], optional = true }
tower = { version = "0.5.3", default-features = false, features = ["util"], optional = true }

[dev-dependencies]
# A Postgres client of the tests' own, for what the storage runs only inside
# a transaction and Postgres refuses there: CREATE DATABASE, for a case that
# needs a database of its own (the database-wide extension Search creates).
postgres = "0.19.14"

[lints]
workspace = true
