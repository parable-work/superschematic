[package]
name = "superschematic-engine-testkit-ffi"
description = "The test kit's engine archive (D58): the engine's C ABI over the core's behaviors and the test kit's, with a policy that answers from a recording, for a binding's replay of the corpora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "superschematic_engine_testkit_ffi"
# The archive the Go binding's corpus replay links in place of the core's
# (scripts/engine-archive.sh --crate runtime/engine/rust/testkit-ffi). It is
# never shipped.
crate-type = ["staticlib"]

[features]
default = ["sqlite", "postgres"]
sqlite = ["superschematic-engine-abi/sqlite", "superschematic-engine-testkit/sqlite"]
postgres = ["superschematic-engine-abi/postgres", "superschematic-engine-testkit/postgres"]

[dependencies]
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
superschematic-engine = { path = "../engine", default-features = false }
# The ABI, which this crate exports over its own project; not the core's
# archive (superschematic-engine-ffi), whose exports these would define
# again.
superschematic-engine-abi = { path = "../abi", default-features = false }
superschematic-engine-behaviors = { path = "../behaviors", default-features = false }
superschematic-engine-testkit = { path = "../testkit", default-features = false }

[lints]
workspace = true
