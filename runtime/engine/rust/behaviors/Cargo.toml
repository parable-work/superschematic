[package]
name = "superschematic-engine-behaviors"
description = "The core's behaviors (D16) for the Rust engine (D58): Workflow, Comments, Constants and Variants so far, each over the declaration the compiler registers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The databases the engine runs on, as the engine has them.
default = ["sqlite", "postgres"]
sqlite = ["superschematic-engine/sqlite"]
postgres = ["superschematic-engine/postgres"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# The engine's JSON features (D58): a number keeps its text, an object its
# members' order.
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
superschematic-engine = { path = "../engine", default-features = false }

[lints]
workspace = true
