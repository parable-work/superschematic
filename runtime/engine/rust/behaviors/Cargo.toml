[package]
name = "superschematic-engine-behaviors"
description = "The core's behaviors (D16) for the Rust engine (D58), each over the declaration the compiler registers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The databases the engine runs on, as the engine has them.
default = ["sqlite", "postgres"]
sqlite = ["superschematic-engine/sqlite"]
postgres = ["superschematic-engine/postgres"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# The engine's JSON features (D58): a number keeps its text, an object its
# members' order.
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
superschematic-engine = { path = "../engine", default-features = false }
# The builtin scalar catalog's value classes, which a Branches kind's field
# of a catalog scalar takes (D32). Not published, so a path dependency.
superschematic-schema-ir = { path = "../../../schema/rust-ir" }
# The version graph's engine (D32, D58), which Branches runs over the fixed
# layout in the call's transaction (src/graph.rs). Not published, so a path
# dependency; without its default features it builds neither the
# tokio-postgres client nor rusqlite, since the call's SQL is the client.
superschematic-versiongraph-engine = { path = "../../../versiongraph/rust-engine", default-features = false }
# The version-5 UUIDs (RFC 9562) Branches names a root and an actor by.
uuid = { version = "1.28.0", features = ["v5"] }

[lints]
workspace = true
