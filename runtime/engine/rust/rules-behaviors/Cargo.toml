[package]
name = "superschematic-rules-behaviors"
description = "The behaviors ported onto the pure core (D103), each a Behavior over logical names, with no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Like the core, nothing here does I/O (D103), so the crate builds for
# wasm32-unknown-unknown, and nothing reads a clock: a time is the command's.
[dependencies]
# Schedules' cron lines and time zones (D104): the IANA database bundled into
# the binary (tzdb-bundle-always) and no other, neither the host's zone files
# nor its system zone (no tzdb-zoneinfo, tz-system), so every host, the wasm32
# module among them, computes the same runs, as the commerce crate's Calendar
# does (D70). A rule change ships with a release. Unlicense OR MIT, as
# jiff-tzdb is.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Derived's source hash (D73): the SHA-256 of the model label, the
# instruction, the output schema and the inputs as JSON.stringify writes
# them, its numbers as JavaScript writes a double, so a hash matches the
# engine's. Both are pure Rust and build for wasm32.
ryu-js = "1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
# The engine's JSON features (D58): a number keeps its text, an object its
# members' order.
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10.9"
superschematic-rules = { path = "../rules" }

[dev-dependencies]
# Finance.Currency's ISO 4217 table, which the commerce behaviors' copy
# (`currency`) is held to, by path from the checkout superscalar.pin names,
# as the commerce crate links it; a test's alone, so the core's builds,
# the wasm32 one among them, link no superscalar.
superscalar = { path = "../../../../third_party/superscalar/crates/core", default-features = false }
# Recurrence's oracle (D152): the maintained RFC 5545 crate, which a test
# holds the core's own expansion of a battery of rules to, date for date. A
# test's alone: the chrono it carries turns on wasm-bindgen for
# wasm32-unknown-unknown (its default `wasmbind`), which would give the
# module JavaScript imports and some 2.3 MB, and the module imports nothing.
# MIT OR Apache-2.0.
rrule = "0.14.0"
# The crate's date-times, which the oracle's start is made in.
chrono = { version = "0.4.45", default-features = false }

[lints]
workspace = true
