# The engine in Rust (D58): one workspace and one lock file, every crate built
# with the toolchain tools.env pins, since the archives a Go binary links must
# come from one Rust release. Nothing consumes these crates from a registry.

[workspace]
resolver = "2"
# The work queue's behaviors (runtime/engine-workqueue/rust) and the
# commerce behaviors (runtime/engine-commerce/rust) are members too, outside
# this directory: they build with this lock file and this toolchain, and
# `cargo --workspace` lints and tests them with the rest.
members = ["abi", "addon", "behaviors", "engine", "ffi", "napi", "storage", "testkit", "testkit-ffi", "../../engine-workqueue/rust", "../../engine-commerce/rust"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/parable-work/superschematic"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"

# What a release ships (D58): the prebuilt addons (@superschematic/engine-<target>,
# scripts/engine-napi.sh --dist). One codegen unit and LTO across the crates
# let the linker drop what no export reaches, and stripping drops the
# symbol table; a release build without them is quicker to link, which a
# test run wants.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
