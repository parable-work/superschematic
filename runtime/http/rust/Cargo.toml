[package]
name = "superschematic-http-runtime"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
authors = ["Parable Work, Inc."]
description = "Shared Rust runtime helpers for generated REST APIs"
license = "Apache-2.0"
repository = "https://github.com/parable-work/superschematic"

# Standalone crate: generated Rust API crates depend on it by path (see
# [paths] http_runtime_rust in superschematic.toml), so it carries its own
# dependency versions instead of inheriting a workspace's.
[workspace]

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
# A bucket's chunks (D54), and with the postgres feature the buffer a
# queue's text parameter writes into (D65), tokio-postgres's. Already in
# axum's tree.
bytes = "1.12.1"
# The Stream a bucket's object reads and writes through (D54). Already in
# axum's tree.
futures-core = "0.3.34"
http = "1"
http-body-util = "0.1.3"
# Service credentials (D37): RS256, ES256 and Ed25519 signature checks, the
# Ed25519 signing of the key-pair token source, and its random jti.
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The version is the release's, which scripts/bump_version.py sets with the
# crate's own: cargo publish needs one beside the path.
superschematic-schema-runtime = { version = "0.0.0", path = "../../schema/rust" }
# rt, signal and macros for Shutdown::on_signals, which spawns the task
# that waits for SIGTERM or SIGINT.
tokio = { version = "1.52.2", features = ["macros", "rt", "signal", "sync", "time"] }
# Shutdown's cancellation token (D65), and with the postgres feature the
# task tracker of the worker loop's handlers. Already in tokio-postgres's
# tree.
tokio-util = "0.7.19"
# Already in axum's tree: why a service credential was refused, for the log.
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["serde", "v4"] }
# The http-client feature's HTTP client, with the TLS the generated Rust
# SDKs use, so a service that also calls other APIs builds one stack.
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls"], optional = true }
# The identity feature's password hash (D50): argon2id alone, without the
# password-hash crate's PHC reader, since the runtime reads a PHC string in
# the one form every identity runtime writes.
argon2 = { version = "0.5.3", default-features = false, optional = true }
# The site CORS layer (D55, D57) and the identity feature's. Already in
# axum's tree.
tower-layer = "0.3.3"
tower-service = "0.3.3"
# The identity-postgres feature's client, reading and writing Postgres UUIDs
# as the uuid crate's.
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"], optional = true }
# The identity-sqlite feature's client, with the SQLite it bundles, as the
# version graph's Rust engine binds it.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
# The postgres feature's pool (D57), over the tokio-postgres above, with the
# TLS of the http-client feature (native-tls) for a connection string.
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"], optional = true }
native-tls = { version = "0.2.18", optional = true }
postgres-native-tls = { version = "0.5.3", optional = true }
# The gcs feature's upload body, a stream of http-body frames over
# reqwest. Already in reqwest's tree.
http-body = { version = "1.0.1", optional = true }
# The logging feature's subscriber (D57): its registry alone, since the
# runtime writes the JSON lines itself, in the TypeScript logger's shape.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }
# The otel feature's trace export (D67): the API and SDK with traces alone,
# the OTLP exporter over HTTP in protobuf with no HTTP client of its own,
# since it sends through the http-client feature's reqwest, and the layer
# that makes a tracing span an OpenTelemetry one. No tonic, and no metrics
# or logs SDK.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace"], optional = true }
opentelemetry-http = { version = "0.33.1", default-features = false, optional = true }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
# The memorystore-redis feature's client (D75): the redis crate's async
# client on tokio, over TLS with rustls, without its default features, so
# it sends no command a managed server refuses beyond what a connection
# needs. rustls takes ring, already in the tree, as its crypto provider.
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
# HttpFetcher: the default JWKS fetcher of JwtServiceAuthenticator and the
# default metadata client of GoogleIdTokenSource. Without it, a service
# passes its own KeyFetcher or HttpGetter.
http-client = ["dep:reqwest"]
# The user model's runtime (D50): passwords, sessions, roles and the
# session and administration routes, over an identity store. The store runs
# its SQL through a client the service binds; the two features below add
# the default bindings. A password hash runs on tokio's blocking pool.
identity = ["dep:argon2", "tokio/rt"]
# The identity store's Postgres client, over tokio-postgres.
identity-postgres = ["identity", "dep:tokio-postgres"]
# The identity store's SQLite client, over rusqlite.
identity-sqlite = ["identity", "dep:rusqlite"]
# A stack server's database (D57): a deadpool-postgres pool over a
# connection string, or over the Unix socket Cloud Run mounts for a Cloud SQL
# instance, with an access token from the metadata server, which it asks
# through the http-client feature. With identity-postgres, the identity
# store runs over the same pool.
#
# With it, the queue client and the worker loop (D65): enqueue in a
# caller's transaction, the claims of a queue its descriptor describes, and
# the loop that claims and handles a worker's messages.
postgres = ["http-client", "dep:deadpool-postgres", "dep:tokio-postgres", "dep:native-tls", "dep:postgres-native-tls", "tokio/rt", "tokio-util/rt"]
# A queue's claims on a SQLite file (D53, amended): enqueue_sqlite in a
# caller's rusqlite transaction, SqliteQueue's claims of a queue whose
# descriptor carries its statements on SQLite, and the worker loop over
# them, on tokio's blocking pool.
sqlite = ["dep:rusqlite", "tokio/rt", "tokio-util/rt"]
# A bucket on Google Cloud Storage (D54): GcsBucket, the Bucket a stack
# server, job or worker opens for each bucket its APIs list, over Cloud
# Storage's JSON API through the http-client feature's client, as the
# workload's account with an access token from the metadata server, or on
# an emulator with none, and signing its URLs through IAM's signBlob. No
# Google library: the bucket module, the provider-neutral interface, needs
# no feature.
gcs = ["http-client", "dep:http-body"]
# A memory store on Redis or Valkey (D75): RedisMemoryStore, the
# MemoryStore a stack server, job or worker opens for each memory store its
# APIs list, over the redis crate, with TLS 1.2 or later against the
# connection's CA, and with `auth: iam` the workload's access token from the
# metadata server, which the gcs feature's client asks for, as each new
# connection's password. The memorystore module, the provider-neutral
# interface and the in-process store, needs no feature.
memorystore-redis = ["gcs", "dep:redis", "dep:rustls", "tokio/rt", "tokio/net"]
# A stack server's log (D57): one JSON object per line on stdout, in the
# TypeScript logger's shape, as a layer over tracing-subscriber's registry.
logging = ["dep:tracing-subscriber"]
# A stack deployable's trace export (D67): telemetry::start installs the
# log with an OpenTelemetry layer beside it when the environment names an
# OTLP endpoint, the server layer and the calls clients' transport make
# server and client spans, and a worker's loop a span per message. The
# exporter sends through the http-client feature's reqwest, on a runtime of
# its own.
otel = ["logging", "http-client", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:tracing-opentelemetry"]

[dev-dependencies]
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
# The telemetry test's OTLP receiver decodes the export requests with the
# exporter's own message types.
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = { version = "0.14.1", default-features = false, features = ["std"] }

# The identity vectors, and the store and route tests over the SQLite
# client; the store tests also run on Postgres with identity-postgres and a
# database URL.
[[test]]
name = "identity_parity"
required-features = ["identity"]

[[test]]
name = "identity_store"
required-features = ["identity-sqlite"]

[[test]]
name = "identity_http"
required-features = ["identity-sqlite"]

[[test]]
name = "identity_registration"
required-features = ["identity-sqlite"]

# The pool over a connection string and over a Cloud SQL socket, on the
# Postgres SUPERSCHEMATIC_POSTGRES_TEST_DATABASE_URL names.
[[test]]
name = "postgres"
required-features = ["postgres"]

# The queue client and the worker loop over a queue table of the fixture's
# DDL, on the same Postgres.
[[test]]
name = "queue"
required-features = ["postgres"]

# The queue client and the worker loop on a SQLite file (D53, amended).
[[test]]
name = "queue_sqlite"
required-features = ["sqlite"]

# The worker loop's log lines, as a worker writes them.
[[test]]
name = "worker_log"
required-features = ["postgres", "logging"]

# Trace export against an OTLP receiver in the test's process (D67).
[[test]]
name = "telemetry"
required-features = ["otel"]

# A bucket on GCS against a fake Cloud Storage, metadata server and IAM,
# and on the fake-gcs-server SUPERSCHEMATIC_TEST_GCS_EMULATOR names.
[[test]]
name = "gcs"
required-features = ["gcs"]

# A memory store on the Valkey SUPERSCHEMATIC_TEST_MEMORY_STORE names, and
# a fake metadata server for `auth: iam`.
[[test]]
name = "memorystore_redis"
required-features = ["memorystore-redis"]

[lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
