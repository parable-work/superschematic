# The implementation of the deps-rust-pricing API (D57).
#
# superschematic wrote this crate once, as a scaffold, because it was
# missing, and never writes it again: it is yours, and so is its name. A
# stack's server entrypoint depends on it by path and calls its `create`.
[package]
name = "schemas-deps-rust-pricing-implementation"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
publish = false

# The generated API crate, and the HTTP runtime it is built on.
[dependencies]
async-trait = "0.1.89"
http = "1"
schemas-deps-rust-pricing-api = { path = "../../schemas/dist/api/deps-rust-pricing" }
superschematic-http-runtime = { path = "../../runtime/http/rust" }

# Its own workspace, so no Cargo.toml above this directory claims it.
[workspace]
