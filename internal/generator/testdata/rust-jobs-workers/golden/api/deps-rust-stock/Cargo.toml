[package]
name = "schemas-deps-rust-stock-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json", "matched-path"] }
http = "1"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
superschematic-http-runtime = { path = "../../../../runtime/http/rust", features = ["postgres"] }
schemas-deps-rust-stock-types = { path = "../../types/rust/deps-rust-stock" }
schemas-deps-stock-db-types = { path = "../../types/rust/deps-stock-db" }
