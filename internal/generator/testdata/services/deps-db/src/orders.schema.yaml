name: deps-db
kind: DB
scalars:
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
types:
  Order:
    name: Order
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: sku
        typeRef: { name: string }
        required: true
  # A queue of the database (D53), which deps-orders' worker handles.
  OrderPlaced:
    name: OrderPlaced
    role: EmbeddedStruct
    queue: {}
    fields:
      - name: orderId
        typeRef: { name: Identity.UUID }
        required: true
