name: deps-stock-db
kind: DB
scalars:
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
enums:
  # How soon a product needs restocking.
  Urgency:
    name: Urgency
    values:
      - name: Low
        serializedAs: low
      - name: High
        serializedAs: high
types:
  RestockRequest:
    name: RestockRequest
    comment: An order to the supplier for more of a product.
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: productId
        typeRef: { name: Identity.UUID }
        required: true
      - name: status
        typeRef: { name: string }
        required: true
  # A queue of the database (D53), whose message holds a field of each form
  # a descriptor writes: a column, an enum with its default, a list and an
  # optional field. deps-rust-stock's worker ReorderStock handles it.
  StockLow:
    name: StockLow
    comment: Enqueued when a reservation leaves a product below its threshold.
    role: EmbeddedStruct
    queue: { retries: 3, backoff: 1m, lease: 2m }
    fields:
      - name: productId
        typeRef: { name: Identity.UUID }
        required: true
      - name: level
        typeRef: { name: number }
        required: true
      - name: urgency
        typeRef: { name: Urgency }
        required: true
        default: low
      - name: warehouses
        typeRef: { name: string, isArray: true }
        required: true
      - name: note
        typeRef: { name: string }
  # A queue with the defaults, which deps-rust-stock's worker RecountStock
  # handles.
  Recount:
    name: Recount
    role: EmbeddedStruct
    queue: {}
    fields:
      - name: sku
        typeRef: { name: string }
        required: true
