name: deps-orders
kind: API
imports:
  - package: "@schemas/deps-db"
    types: [OrderPlaced]
types:
  OrdersConfig:
    name: OrdersConfig
    role: EmbeddedStruct
    envVars: true
    fields:
      - name: FULFILLMENT_REGION
        typeRef: { name: string }
        required: true
        default: "us"
  OrderView:
    name: OrderView
    role: APIView
    fields:
      - name: id
        typeRef: { name: string }
        required: true
      - name: sku
        typeRef: { name: string }
        required: true
operationSets:
  - name: OrderQueries
    operations:
      - name: getOrder
        typeRef: { name: OrderView }
        required: true
        httpMethod: GET
        restPath: orders/:id
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
jobs:
  - name: ShipOrders
    comment: The warehouse's pick run.
    schedule: "*/15 * * * *"
    timeout: 5m
    retries: 1
  - name: ReindexOrders
workers:
  - name: FulfilOrders
    comment: Fulfils each order placed.
    queue: OrderPlaced
    concurrency: 4
