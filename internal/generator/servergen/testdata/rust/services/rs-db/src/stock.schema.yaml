name: rs-db
kind: DB
scalars:
  Contact.Email:
    name: Contact.Email
    languagePrimitive: string
  Identity.Name:
    name: Identity.Name
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
types:
  Account:
    name: Account
    comment: A person who signs in with their email.
    role: DBTable
    user: { login: email, name: displayName }
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: email
        typeRef: { name: Contact.Email }
        required: true
        unique: true
      - name: displayName
        typeRef: { name: Identity.Name }
        required: true
  Role:
    name: Role
    comment: A named set of permissions accounts are granted.
    role: DBTable
    userRole: {}
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
        unique: true
      - name: permissions
        typeRef: { name: string, isArray: true }
        required: true
  StockLevel:
    name: StockLevel
    comment: How many of a product the warehouse holds.
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: sku
        typeRef: { name: string }
        required: true
        unique: true
      - name: quantity
        typeRef: { name: number }
        required: true
  StockLow:
    name: StockLow
    comment: A product whose stock ran low, which rs-stock's worker reorders.
    role: EmbeddedStruct
    queue: { retries: 1, backoff: 1s }
    fields:
      - name: sku
        typeRef: { name: string }
        required: true
      - name: quantity
        typeRef: { name: number }
        required: true
