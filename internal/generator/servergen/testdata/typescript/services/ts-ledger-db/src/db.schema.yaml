# The database of ts-ledger, a finance-like API on Cloudflare Workers
# (D92): Postgres alone, reached through Hyperdrive, with a vector(3)
# column and its HNSW index, which nearest reads, two keyed queues,
# EmbedLineItem, which LineItem's trigger enqueues and replaces, and
# SyncRequested, one waiting and one claimed per item at a time, and the
# user model, Member and MemberRole, which ts-ledger signs its members in
# against (D50).
name: ts-ledger-db
kind: DB
scalars:
  Contact.Email:
    name: Contact.Email
    languagePrimitive: string
  Embedding.Vector:
    name: Embedding.Vector
    languagePrimitive: object
    typeMappings:
      json_schema: array
  Generic.Int64:
    name: Generic.Int64
    languagePrimitive: number
    typeMappings:
      sql: BIGINT
  Identity.Name:
    name: Identity.Name
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
    typeMappings:
      sql: UUID
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
    typeMappings:
      sql: TIMESTAMPTZ
types:
  # A category a line item may take.
  Category:
    name: Category
    role: DBTable
    fields:
      - name: id
        typeRef:
          name: Identity.UUID
        required: true
        key: true
        autoGenerated: true
      - name: slug
        typeRef:
          name: string
        required: true
        unique: true
      - name: name
        typeRef:
          name: string
        required: true
  # Embedding work: one waiting message per line item, the latest, which the
  # trigger below writes whenever a line item's category changes.
  EmbedLineItem:
    name: EmbedLineItem
    role: EmbeddedStruct
    fields:
      - name: lineItemId
        typeRef:
          name: Identity.UUID
        required: true
    queue:
      retries: 2
      backoff: 1s
      maxBackoff: 1s
      lease: 30s
      key: lineItemId
      onDuplicate: replace
  # A line of a statement. Whatever writes it, a new or changed category
  # enqueues its embedding.
  LineItem:
    name: LineItem
    role: DBTable
    fields:
      - name: id
        typeRef:
          name: Identity.UUID
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef:
          name: string
        required: true
      - name: category
        typeRef:
          name: Category
        relation:
          type: Category
          onDelete: SET NULL
    enqueueOnChange:
      - queue: EmbedLineItem
        "on":
          - insert
          - update
        fields:
          - category
        when:
          - field: category
            notNull: true
        message:
          lineItemId: id
  # A line item's embedding, found by cosine distance.
  LineItemEmbedding:
    name: LineItemEmbedding
    role: DBTable
    fields:
      - name: id
        typeRef:
          name: Identity.UUID
        required: true
        key: true
        autoGenerated: true
      - name: lineItem
        typeRef:
          name: LineItem
        required: true
        unique: true
        relation:
          type: LineItem
          onDelete: CASCADE
      - name: category
        typeRef:
          name: Category
        required: true
        relation:
          type: Category
          onDelete: CASCADE
      - name: embedding
        typeRef:
          name: Embedding.Vector
        required: true
        validateDimensions: 3
    indexes:
      - keys:
          - embedding
        method: hnsw
        ops: vector_cosine_ops
  # A sync of one item's records: one waits per item, and one item syncs at
  # a time, since two syncs would race its cursor.
  SyncRequested:
    name: SyncRequested
    role: EmbeddedStruct
    fields:
      - name: itemId
        typeRef:
          name: string
        required: true
      - name: reason
        typeRef:
          name: string
        required: true
    queue:
      retries: 1
      backoff: 1s
      maxBackoff: 1s
      lease: 30s
      key: itemId
      onDuplicate: skip
      serialize: true
  # A run of a sync, which its worker records as it starts and as it ends.
  SyncRun:
    name: SyncRun
    role: DBTable
    fields:
      - name: id
        typeRef:
          name: Identity.UUID
        required: true
        key: true
        autoGenerated: true
      - name: itemId
        typeRef:
          name: string
        required: true
      - name: reason
        typeRef:
          name: string
        required: true
      - name: attempt
        typeRef:
          name: Generic.Int64
        required: true
      - name: startedAt
        typeRef:
          name: Temporal.DateTime
        required: true
      - name: endedAt
        typeRef:
          name: Temporal.DateTime
  # A member of the ledger, who signs in with their email: the user model's
  # User table, beside which the loader adds Session, UserCredential and
  # UserRoleGrant (D50).
  Member:
    name: Member
    role: DBTable
    user: { login: email, name: displayName }
    fields:
      - name: id
        typeRef:
          name: Identity.UUID
        required: true
        key: true
        autoGenerated: true
      - name: email
        typeRef:
          name: Contact.Email
        required: true
        unique: true
      - name: displayName
        typeRef:
          name: Identity.Name
        required: true
  # A named set of permissions members are granted.
  MemberRole:
    name: MemberRole
    role: DBTable
    userRole: {}
    fields:
      - name: id
        typeRef:
          name: Identity.UUID
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef:
          name: string
        required: true
        unique: true
      - name: permissions
        typeRef:
          name: string
          isArray: true
        required: true
