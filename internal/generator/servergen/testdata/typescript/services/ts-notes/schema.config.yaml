# A TypeScript API on a sqlite-first database (D64): it takes ts-notes-db
# from its one DB-kind dependency, so its Deps.db is a SqlDatabase and its
# database field a DatabaseConnection, and its job and its worker build
# the same Deps.
name: ts-notes
kind: API
dependencies:
  - { name: ts-notes-db, kind: DB }
outputs:
  types:
    typescript: { enabled: true }
  api: { enabled: true, language: TYPESCRIPT }
