name: ts-notes
kind: API
imports:
  - package: "@schemas/ts-notes-db"
    types: [NoteWritten]
types:
  NoteView:
    name: NoteView
    role: APIView
    fields:
      - name: id
        typeRef: { name: string }
        required: true
      - name: text
        typeRef: { name: string }
        required: true
operationSets:
  - name: Notes
    operations:
      - name: getNote
        typeRef: { name: NoteView }
        required: true
        httpMethod: GET
        restPath: notes/{id}
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
      - name: putNote
        typeRef: { name: NoteView }
        required: true
        httpMethod: PUT
        restPath: notes/{id}
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          - name: text
            typeRef: { name: string }
            required: true
# A job builds ts-notes' Deps as its server does, the SQLite file included.
jobs:
  - name: PruneNotes
    schedule: "0 3 * * *"
    timeout: 1m
# A worker claims ts-notes-db's queue NoteWritten on the SQLite file the
# server writes, as its job reads it (D53, amended).
workers:
  - name: IndexNotes
    queue: NoteWritten
    concurrency: 2
    grace: 2s
