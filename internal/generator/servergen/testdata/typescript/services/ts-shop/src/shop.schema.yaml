name: ts-shop
kind: API
imports:
  - package: "@schemas/ts-db"
    types: [CartAbandoned]
types:
  ShopConfig:
    name: ShopConfig
    role: EmbeddedStruct
    envVars: true
    fields:
      - name: STOREFRONT_REGION
        typeRef: { name: string }
        required: true
        default: "eu"
  CartView:
    name: CartView
    role: APIView
    fields:
      - name: id
        typeRef: { name: string }
        required: true
      - name: cents
        typeRef: { name: number }
        required: true
      - name: region
        typeRef: { name: string }
        required: true
operationSets:
  - name: Carts
    operations:
      - name: getCart
        typeRef: { name: CartView }
        required: true
        httpMethod: GET
        restPath: carts/{id}
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
      - name: getMyCart
        typeRef: { name: CartView }
        required: true
        httpMethod: GET
        restPath: me/cart
        auth: true
      # The router mounts it behind its auth gate and hands it to the
      # handler the implementation's createManualRoutes builds, which
      # answers a CSV no JSON envelope holds (D51).
      - name: exportCart
        typeRef: { name: CartView }
        required: true
        httpMethod: GET
        restPath: carts/{id}/export
        manualRouteRegistration: true
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
# A job is a deployable of its own, with ts-shop's Deps: its database, its
# client of ts-pricing and its bucket (D52). Its schedule's */15 stays in
# the generated JSDoc.
jobs:
  - name: SweepCarts
    schedule: "*/15 * * * *"
    timeout: 2m
# A worker is a deployable of its own too, with the same Deps: it claims the
# messages of ts-db's queue CartAbandoned, two at a time, and gives its
# running handlers two seconds when it stops (D53).
workers:
  - name: RemindShoppers
    queue: CartAbandoned
    concurrency: 2
    grace: 2s
