# One TypeScript server, ts-notes, on a sqlite-first database, its job and
# its worker, which claims on the database (D53, amended).
# Local runs on the local target, which keeps the database in a SQLite file
# and derives a sqlite: URL for it; Edge, on stacktest's fake target,
# places the server on the fake bundle platform, as Cloudflare Workers, its
# job on the fake cron platform, as Cron Triggers, and the database on the
# fake SQLite platform, as D1, whose connectors derive a D1 binding for
# both (D64). The server's package gets fetch.ts and bundle.ts beside
# main.ts, and the job's scheduled.ts and bundle.ts.
kind: Stack
types:
  Notes:
    name: Notes
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: ts-notes, kind: API }
      expose:
        - service: { name: ts-notes, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
  Edge:
    name: Edge
    role: EmbeddedStruct
    environment:
      target: fake
      values: { project: acme-edge, region: us-east1 }
      settings:
        - of: { service: { name: ts-notes, kind: API } }
          platform: fake.bundle
        - of: { service: { name: ts-notes, kind: API }, job: PruneNotes }
          platform: fake.cron
        - of: { service: { name: ts-notes-db, kind: DB } }
          platform: fake.lite
