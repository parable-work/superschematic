# A TypeScript API whose one job, CompileReports, ts-cron-stack's Edge
# places on stacktest's fake cron platform, whose artifact is a bundle as
# Cloudflare's Cron Triggers' is (D64). Its config holds a secret and a
# setting with a default, which its job reads.
name: ts-reports
kind: API
outputs:
  types:
    typescript: { enabled: true }
  api: { enabled: true, language: TYPESCRIPT }
