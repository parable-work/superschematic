# The TypeScript API ts-shop calls. Only a calling service may quote, so
# its server verifies each caller's credential against its callers field.
# It lists the memory store ts-cache (D75).
name: ts-pricing
kind: API
memoryStores:
  - { name: ts-cache, kind: MemoryStore }
outputs:
  types:
    typescript: { enabled: true }
  api: { enabled: true, language: TYPESCRIPT }
  sdk:
    typescript: { enabled: true }
