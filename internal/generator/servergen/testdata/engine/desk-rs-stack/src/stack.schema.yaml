# desk-rs-api runs on its default server, a Rust server, which opens the
# engine on desk-db, an engine database, and the engine's runner of desk-db
# is a deployable of its own, desk-db-engine-runner, in desk-rs-api's Rust
# (D58). Its one environment, Local, runs on the local target.
kind: Stack
types:
  DeskRs:
    name: DeskRs
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: desk-rs-api, kind: API }
      expose:
        - service: { name: desk-rs-api, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
