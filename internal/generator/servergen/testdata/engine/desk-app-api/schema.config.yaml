# desk-rs-api's twin with an app (D78): a public Rust API over desk-db, an
# engine database, whose users are the user model's and whose operations
# have a service clause, and which declares Backoffice, an app: the
# project's own program over the API's Deps, run as a deployable of its
# own.
name: desk-app-api
kind: API
public: true
authDb: desk-db
outputs:
  types:
    rust: { enabled: true }
  api: { enabled: true, language: RUST }
