# desk-ts-api runs on its default server, a TypeScript one, which opens the
# engine on desk-db, an engine database, and the engine's runner of desk-db
# is a deployable of its own, desk-db-engine-runner, in desk-ts-api's
# TypeScript (D58). Its one environment, Local, runs on the local target.
kind: Stack
types:
  DeskTs:
    name: DeskTs
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: desk-ts-api, kind: API }
      expose:
        - service: { name: desk-ts-api, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
