# A shop on the engine (D70), as the loader's fixture-commerce-json
# composes it: inventory it counts and prices, collection points that open
# fifteen-minute pickup slots, checkouts that hold both while they wait for
# payment, and refunds two staff sign off; a bay that one booking at a
# time holds, for the oversell test's timed half; beside them, a table of
# the database's own and the user model (D50), whose members the servers
# that name the database as their authDb sign in, holding the permissions
# their roles grant.
name: shop-commerce-db
kind: DB
scalars:
  Finance.Money:
    name: Finance.Money
    languagePrimitive: number
  Generic.Int64:
    name: Generic.Int64
    languagePrimitive: number
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Contact.Email:
    name: Contact.Email
    languagePrimitive: string
  Identity.Name:
    name: Identity.Name
    languagePrimitive: string
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
types:
  Shopper:
    name: Shopper
    description: A shopper, a table of the database's own beside the engine's.
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
  Member:
    name: Member
    description: A member of the shop who signs in with their email, the user model (D50).
    role: DBTable
    user: { login: email, name: displayName }
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: email
        typeRef: { name: Contact.Email }
        required: true
        unique: true
      - name: displayName
        typeRef: { name: Identity.Name }
        required: true
  MemberRole:
    name: MemberRole
    description: A named set of permissions members are granted, such as stock.adjust or refunds.approve, which the commerce behaviors check.
    role: DBTable
    userRole: {}
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
        unique: true
      - name: permissions
        typeRef: { name: string, isArray: true }
        required: true
  Inventory:
    name: Inventory
    description: Units the shop counts and prices.
    role: DBTable
    behaviors:
      - name: Stock
        config:
          price: { field: priceCents, currency: GBP }
          lowAt: { field: reorderAt }
          maxPerHold: 99
          backorder: false
          permission: stock.adjust
    fields:
      - name: sku
        typeRef: { name: string }
        required: true
        validateMaxLength: 64
      - name: priceCents
        typeRef: { name: Finance.Money }
        required: true
      - name: reorderAt
        typeRef: { name: Generic.Int64 }
  CollectionPoint:
    name: CollectionPoint
    description: A counter that opens fifteen-minute pickup slots, four at a time.
    role: DBTable
    behaviors:
      - name: Calendar
        config:
          timeZone: Europe/London
          hours:
            mon: [["09:00", "12:30"], ["13:30", "17:30"]]
            tue: [["09:00", "17:30"]]
            wed: [["09:00", "17:30"]]
            thu: [["09:00", "17:30"]]
            fri: [["09:00", "17:30"]]
            sat: [["10:00", "16:00"]]
          capacity: 4
          slotMs: 900000
          minMs: 900000
          maxMs: 900000
          bufferMs: { after: 300000 }
          leadMs: 7200000
          horizonMs: 5184000000
          permission: calendar.manage
    fields:
      - name: name
        typeRef: { name: string }
        required: true
        validateMaxLength: 200
  CheckoutLine:
    name: CheckoutLine
    role: EmbeddedStruct
    fields:
      - name: inventoryId
        typeRef: { name: string }
        required: true
      - name: quantity
        typeRef: { name: Generic.Int64 }
        required: true
  Checkout:
    name: Checkout
    description: A checkout that holds its lines' units and a pickup slot while it waits for payment, and is placed once paid.
    role: DBTable
    behaviors:
      - name: Workflow
        config:
          states: [cart, held, placed, expired, cancelled]
          transitions:
            - { from: cart, to: held }
            - { from: held, to: placed }
            - { from: held, to: expired }
            - { from: held, to: cancelled }
            - { from: cart, to: cancelled }
          outcomes: { expired: failure, cancelled: neutral }
      - name: Links
        config:
          links:
            counter: { schema: CollectionPoint }
      - name: Holds
        config:
          holds:
            lines:
              each: { field: lines, target: inventoryId }
              schema: Inventory
              quantity: { field: quantity }
            pickup:
              link: counter
              interval: { start: pickupAt, durationMs: 900000 }
          takeOn: [held]
          commitOn: [placed]
          releaseOn: [expired, cancelled]
          maxItems: 50
      - name: Timers
        config:
          deadlines:
            # Two seconds, not a shop's fifteen minutes, so the runner the
            # script starts lets an unpaid checkout go while it waits.
            holdExpiry:
              start: { enters: held }
              afterMs: 2000
              then: { transition: expired }
              until: { leaves: held }
            backstop:
              start: { enters: held }
              afterMs: 7200000
              then: { transition: expired }
              until: { leaves: held }
      - name: Payments
        config:
          amount: { holds: true }
          require: { placed: paid }
          voidOn: [expired, cancelled]
          afterRelease: refund
          refunds: { permission: payments.refund }
          record: { permission: payments.record }
      - name: Reactions
        config:
          rules:
            - when: { changes: { field: Payments.state, to: paid } }
              then: { transition: placed }
      - name: Numbering
        config: { format: "ORD-{yyyy}-{seq:5}", reset: yearly }
      - name: StateRules
        config:
          states:
            held: { frozen: [lines, pickupAt] }
            placed: { frozen: all }
    fields:
      - name: lines
        typeRef: { name: CheckoutLine, isArray: true }
        required: true
      - name: pickupAt
        typeRef: { name: Temporal.DateTime }
  Refund:
    name: Refund
    description: A refund two staff sign off before it is issued against its checkout's payment.
    role: DBTable
    behaviors:
      - name: Workflow
        config:
          states: [requested, approved, issued, rejected, failed]
          transitions:
            - { from: requested, to: approved }
            - { from: requested, to: rejected }
            - { from: approved, to: issued }
            - { from: approved, to: failed }
          outcomes: { rejected: neutral, failed: failure }
      - name: Approvals
        config:
          gates:
            approved: { count: 2, permission: refunds.approve }
      - name: Links
        config:
          links:
            order: { schema: Checkout, required: true }
      - name: Numbering
        config: { format: "RF-{yyyy}-{seq:5}", reset: yearly }
      - name: StateRules
        config:
          states:
            requested: { required: [amountCents, reason] }
            approved: { frozen: all }
      - name: Payments
        config:
          amount: { field: amountCents }
          currency: GBP
          refundOf: { link: order }
          issueOn: [approved]
          record: { permission: payments.record }
      - name: Reactions
        config:
          rules:
            - when: { changes: { field: Payments.state, to: refunded } }
              then: { transition: issued }
    fields:
      - name: amountCents
        typeRef: { name: Finance.Money }
        required: true
      - name: reason
        typeRef: { name: string }
        required: true
        validateMaxLength: 500
  Bay:
    name: Bay
    description: A loading bay that one booking at a time holds, for fifteen minutes.
    role: DBTable
    behaviors:
      - name: Calendar
        config:
          timeZone: Europe/London
          hours:
            mon: [["09:00", "17:30"]]
            tue: [["09:00", "17:30"]]
            wed: [["09:00", "17:30"]]
            thu: [["09:00", "17:30"]]
            fri: [["09:00", "17:30"]]
          capacity: 1
          slotMs: 900000
          minMs: 900000
          maxMs: 900000
          leadMs: 3600000
          horizonMs: 5184000000
          permission: calendar.manage
    fields:
      - name: name
        typeRef: { name: string }
        required: true
        validateMaxLength: 200
  Booking:
    name: Booking
    description: A booking that holds a bay's slot from requested to held, and lets it go when it lapses or is cancelled.
    role: DBTable
    behaviors:
      - name: Workflow
        config:
          states: [requested, held, done, lapsed, cancelled]
          transitions:
            - { from: requested, to: held }
            - { from: held, to: done }
            - { from: held, to: lapsed }
            - { from: held, to: cancelled }
            - { from: requested, to: cancelled }
          outcomes: { lapsed: failure, cancelled: neutral }
      - name: Links
        config:
          links:
            bay: { schema: Bay }
      - name: Holds
        config:
          holds:
            slot:
              link: bay
              interval: { start: startsAt, durationMs: 900000 }
          takeOn: [held]
          commitOn: [done]
          releaseOn: [lapsed, cancelled]
      - name: Timers
        config:
          deadlines:
            lapse:
              start: { enters: held }
              afterMs: 900000
              then: { transition: lapsed }
              until: { leaves: held }
    fields:
      - name: startsAt
        typeRef: { name: Temporal.DateTime }
        required: true
