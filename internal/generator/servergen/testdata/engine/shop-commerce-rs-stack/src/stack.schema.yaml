# shop-commerce-rs-api runs on its default server, a Rust one, which opens
# the engine on shop-commerce-db, whose types compose the commerce
# behaviors, and shop-commerce-db's runner runs beside it, in
# shop-commerce-rs-api's Rust (D70, D58). Its one environment, Local, runs
# on the local target.
kind: Stack
types:
  ShopRs:
    name: ShopRs
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: shop-commerce-rs-api, kind: API }
      expose:
        - service: { name: shop-commerce-rs-api, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
