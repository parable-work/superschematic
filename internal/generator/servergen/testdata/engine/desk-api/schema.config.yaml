# A public Go API over desk-db: it serves the user model's session routes
# and a route of its own, and its server opens the engine on desk-db and
# mounts it at /engine/desk-db, behind the session the identity runtime
# authenticates and the service caller its service authenticator verifies
# (D58, D50, D37).
name: desk-api
kind: API
public: true
authDb: desk-db
outputs:
  types:
    go: { enabled: true }
  api: { enabled: true }
