# A public Go API over shop-commerce-db, whose operations only a calling
# service may call: its server opens shop-commerce-db's engine from the
# project's engine archive, which holds the commerce crate, and mounts it
# at /engine/shop-commerce-db, where a verified service stands in for an
# end user (D70, D58, D37).
name: shop-commerce-api
kind: API
public: true
dependencies:
  - { name: shop-commerce-db, kind: DB }
outputs:
  types:
    go: { enabled: true }
  api: { enabled: true }
