# shop-commerce-ts-api runs on its default server, a TypeScript one, which
# opens the engine on shop-commerce-db, whose types compose the commerce
# behaviors, and shop-commerce-db's runner runs beside it, in
# shop-commerce-ts-api's TypeScript (D70, D58). Its one environment,
# Local, runs on the local target.
kind: Stack
types:
  ShopTs:
    name: ShopTs
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: shop-commerce-ts-api, kind: API }
      expose:
        - service: { name: shop-commerce-ts-api, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
