name: queue-db
kind: DB
scalars:
  Generic.Int64:
    name: Generic.Int64
    languagePrimitive: number
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
types:
  Worker:
    name: Worker
    description: A worker that claims jobs, a table of the database's own beside the engine's.
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
  Job:
    name: Job
    description: A job a worker claims from the queue and holds a lease on while it runs.
    role: DBTable
    behaviors:
      - name: Workflow
        config:
          states: [queued, running, done]
          transitions:
            - { from: queued, to: running }
            - { from: running, to: queued }
            - { from: running, to: done }
      - name: Lease
        config:
          ttlMs: 30000
          onExpiry: { transition: queued, from: [running] }
      - name: Queue
        config:
          claim: { from: [queued], to: running }
          priorityField: priority
    fields:
      - name: title
        typeRef: { name: string }
        required: true
      - name: priority
        typeRef: { name: Generic.Int64 }
