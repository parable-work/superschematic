# shop-commerce-api's twin in TypeScript, whose operations only a calling
# service may call: its server opens shop-commerce-db's engine on the
# core's Node-API addon, which carries the commerce behaviors, naming them
# in its options, and mounts it at /engine/shop-commerce-db, where a
# verified service stands in for an end user (D70, D58, D37).
name: shop-commerce-ts-api
kind: API
public: true
dependencies:
  - { name: shop-commerce-db, kind: DB }
outputs:
  types:
    typescript: { enabled: true }
  api: { enabled: true, language: TYPESCRIPT }
