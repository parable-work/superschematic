name: users-api
kind: API
types:
  Greeting:
    name: Greeting
    role: APIView
    fields:
      - name: message
        typeRef: { name: string }
        required: true
operationSets:
  - name: Account
    userSessions: { register: true }
    operations: []
  - name: GreetingQueries
    operations:
      - name: greet
        typeRef: { name: Greeting }
        required: true
        auth: true
        httpMethod: GET
        restPath: greeting
# A job of the API, a deployable of its own with the API's Deps (D52). It
# serves no request, so it builds no identity service.
jobs:
  - name: PurgeSessions
