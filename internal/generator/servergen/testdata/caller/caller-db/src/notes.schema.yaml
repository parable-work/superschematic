name: caller-db
kind: DB
scalars:
  Contact.Email:
    name: Contact.Email
    languagePrimitive: string
  Identity.Name:
    name: Identity.Name
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
types:
  Account:
    name: Account
    comment: A person who signs in with their email.
    role: DBTable
    user: { login: email, name: displayName }
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: email
        typeRef: { name: Contact.Email }
        required: true
        unique: true
      - name: displayName
        typeRef: { name: Identity.Name }
        required: true
  Role:
    name: Role
    comment: A named set of permissions accounts are granted.
    role: DBTable
    userRole: {}
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
        unique: true
      - name: permissions
        typeRef: { name: string, isArray: true }
        required: true
  Note:
    name: Note
    comment: A note whose writes record who made them, by a required createdBy and a nullable updatedBy.
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: text
        typeRef: { name: string }
        required: true
      - name: createdAt
        typeRef: { name: Temporal.DateTime }
        required: true
      - name: updatedAt
        typeRef: { name: Temporal.DateTime }
      - name: createdBy
        typeRef: { name: Identity.UUID }
        required: true
      - name: updatedBy
        typeRef: { name: Identity.UUID }
  # A note a worker writes, which an operation asks for in the transaction
  # that writes its own.
  NoteRequested:
    name: NoteRequested
    role: EmbeddedStruct
    queue: { retries: 1, backoff: 1s, lease: 30s }
    fields:
      - name: text
        typeRef: { name: string }
        required: true
