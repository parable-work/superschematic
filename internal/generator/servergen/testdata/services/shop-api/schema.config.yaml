# A public API on shop-db, served by a default server of its own: its
# Config takes the database and the implementation's auth middleware.
# shop-orders calls it, through its Go SDK.
name: shop-api
kind: API
public: true
authDb: shop-db
outputs:
  types:
    go: { enabled: true }
  api: { enabled: true }
  sdk:
    go: { enabled: true }
