# Two servers: Storefront, declared, serves shop-orders and shop-reviews;
# shop-api, which Storefront calls, runs on a default server of its own.
# The site shop-web calls shop-orders, so Storefront answers CORS for it.
# Its one environment, Local, runs on the local target, whose sql edges
# derive a connection string, so no entrypoint links the Cloud SQL
# connector.
kind: Stack
types:
  Shop:
    name: Shop
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: shop-api, kind: API }
        - { name: shop-orders, kind: API }
        - { name: shop-reviews, kind: API }
        - { name: shop-web, kind: Site }
      expose:
        - deployable: Storefront
  Storefront:
    name: Storefront
    role: EmbeddedStruct
    server:
      serves:
        - { name: shop-orders, kind: API }
        - { name: shop-reviews, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
