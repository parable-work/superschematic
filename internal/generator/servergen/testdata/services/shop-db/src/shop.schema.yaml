name: shop-db
kind: DB
scalars:
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
types:
  Product:
    name: Product
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
  # A queue's message (D53): shop-orders' worker FulfilOrders handles it.
  OrderPlaced:
    name: OrderPlaced
    role: EmbeddedStruct
    queue: { retries: 2, backoff: 10s }
    fields:
      - name: orderId
        typeRef: { name: Identity.UUID }
        required: true
