# Served with shop-reviews by the declared server Storefront. Its edges are
# shop-db, its authDb, and shop-api, which it calls.
name: shop-orders
kind: API
authDb: shop-db
dependencies:
  - { name: shop-db, kind: DB }
calls:
  - { name: shop-api, kind: API }
outputs:
  types:
    go: { enabled: true }
  api: { enabled: true }
