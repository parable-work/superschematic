# shop-stack's servers in two environments: Staging on stacktest's fake
# target, whose sql connector derives a Cloud SQL connector configuration
# as the gcp target's does, and Local on the local target, whose derives a
# connection string. Every server on shop-db links the Cloud SQL connector
# and connects either way.
kind: Stack
types:
  Shop:
    name: Shop
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: shop-api, kind: API }
        - { name: shop-orders, kind: API }
        - { name: shop-reviews, kind: API }
      expose:
        - deployable: Storefront
  Storefront:
    name: Storefront
    role: EmbeddedStruct
    server:
      serves:
        - { name: shop-orders, kind: API }
        - { name: shop-reviews, kind: API }
  Staging:
    name: Staging
    role: EmbeddedStruct
    environment:
      target: fake
      values: { project: acme-staging, region: us-east1 }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
