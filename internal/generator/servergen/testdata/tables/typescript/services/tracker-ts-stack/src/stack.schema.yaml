# fixture-tracker-api in TypeScript on the local target: its default
# server serves the operations marked @tableOperation from the tables of
# fixture-tracker-db (D106), which its router runs through the database's
# repositories.
kind: Stack
types:
  Tracker:
    name: Tracker
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: fixture-tracker-api, kind: API }
      expose:
        - service: { name: fixture-tracker-api, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
