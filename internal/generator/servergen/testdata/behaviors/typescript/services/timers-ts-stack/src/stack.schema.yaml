# fixture-timers-api in TypeScript on the local target (D103): its default
# server serves the operations of fixture-timers-db's Ticket, and its
# behavior worker TicketTimers, the deployable
# fixture-timers-api-ticket-timers, runs Ticket's deadlines and changes
# through the database's repositories.
kind: Stack
types:
  Timers:
    name: Timers
    role: EmbeddedStruct
    stack:
      deploy:
        - { name: fixture-timers-api, kind: API }
      expose:
        - service: { name: fixture-timers-api, kind: API }
  Local:
    name: Local
    role: EmbeddedStruct
    environment:
      target: local
  # Edge, on stacktest's fake target, places the server on the fake bundle
  # platform, as Workers, and the behavior workers on the fake drain
  # platform, as Workers under a Cron Trigger (D151), over the database on
  # the fake Postgres one: each worker's package gets a drain.ts that runs
  # its table's behavior queues at each firing and exports its Workflow.
  Edge:
    name: Edge
    role: EmbeddedStruct
    environment:
      target: fake
      values: { project: acme-edge, region: us-east1 }
      settings:
        - of: { service: { name: fixture-timers-api, kind: API } }
          platform: fake.bundle
        - of: { service: { name: fixture-timers-api, kind: API }, worker: TicketTimers }
          platform: fake.drain
        - of: { service: { name: fixture-timers-api, kind: API }, worker: InvoiceTimers }
          platform: fake.drain
        - of: { service: { name: fixture-timers-db, kind: DB } }
          platform: fake.sql
