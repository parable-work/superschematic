# Body arguments of operations without an input type: lists of strings,
# numbers, an integer scalar, an enum, a string scalar, a UUID and an object
# type, required single values of each builtin type, a list of lists of an
# object type (one alone is the operation's input type), Generic.JSON values
# and JSON object and array scalars (Generic.StringMap, Embedding.Vector)
# alone, in a list and in a list of lists, and maps of an enum, of lists of
# a string scalar and of an object type. removeTags is a DELETE, whose list,
# string, Generic.JSON and map arguments are body arguments too.
# searchPosts takes the arguments of a GET operation, which travel in the
# query string: lists of numbers, an integer scalar, booleans, UUIDs,
# timestamps and strings, optional single values of each, and a @query
# list. reviseDocument takes an input type with an optional Generic.JSON
# field. The Go route tests in apigen load it.
# saveTags, storeDocument and findTags match the TypeScript server's scalar
# list fixture, so both servers answer the same vectors.
name: body-args-api
kind: API
scalars:
  Network.Url:
    name: Network.Url
    languagePrimitive: string
  Ordering.Rank:
    name: Ordering.Rank
    languagePrimitive: number
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Generic.JSON:
    name: Generic.JSON
    languagePrimitive: object
  Generic.StringMap:
    name: Generic.StringMap
    languagePrimitive: object
  Embedding.Vector:
    name: Embedding.Vector
    languagePrimitive: object
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
enums:
  # The shade of a tag.
  Shade:
    name: Shade
    values:
      - name: Light
        serializedAs: light
      - name: Dark
        serializedAs: dark
types:
  # A point on a post's cover image.
  Point:
    name: Point
    role: EmbeddedStruct
    fields:
      - name: x
        typeRef: { name: number }
        required: true
        validateMin: 0
      - name: y
        typeRef: { name: number }
        required: true
      # A label pinned at the point, at least two characters.
      - name: pinLabel
        typeRef: { name: string }
        validateMinLength: 2
  # A revision of a stored document.
  DocumentRevision:
    name: DocumentRevision
    role: APIInput
    fields:
      - name: document
        typeRef: { name: Generic.JSON }
        required: true
      # Null clears the note; left out, the note is kept.
      - name: note
        typeRef: { name: Generic.JSON }
operationSets:
  - name: TagMutations
    operations:
      # Replace a post's tags; returns the labels as stored.
      - name: saveTags
        typeRef: { name: string, isArray: true }
        required: true
        httpMethod: PUT
        restPath: "posts/{id}/tags"
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          # The labels, at most three; a label may hold a comma.
          - name: labels
            typeRef: { name: string, isArray: true }
            required: true
            validateListMax: 3
          # One weight per label.
          - name: weights
            typeRef: { name: number, isArray: true }
          # Display ranks, integers from 1.
          - name: ranks
            typeRef: { name: Ordering.Rank, isArray: true }
          # One shade per label.
          - name: shades
            typeRef: { name: Shade, isArray: true }
          # One or two links, each on https.
          - name: links
            typeRef: { name: Network.Url, isArray: true }
            validateListMin: 1
            validateListMax: 2
            validatePattern: "^https://"
          # A title for the set.
          - name: title
            typeRef: { name: string }
          # A priority for the set.
          - name: priority
            typeRef: { name: number }
      # Set a post's flags; every argument is required.
      - name: setFlags
        typeRef: { name: boolean }
        required: true
        httpMethod: POST
        restPath: "posts/{id}/flags"
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          - name: pinned
            typeRef: { name: boolean }
            required: true
          - name: score
            typeRef: { name: number }
            required: true
            validateMax: 10
          # At least two characters.
          - name: caption
            typeRef: { name: string }
            required: true
            validateMinLength: 2
          - name: rank
            typeRef: { name: Ordering.Rank }
            required: true
          # Related posts.
          - name: related
            typeRef: { name: Identity.UUID, isArray: true }
          # Points on the cover image.
          - name: points
            typeRef: { name: Point, isArray: true }
      # Store a JSON document with optional notes; returns the document.
      - name: storeDocument
        typeRef: { name: Generic.JSON }
        required: true
        httpMethod: POST
        restPath: "documents"
        arguments:
          # Any JSON value but null.
          - name: document
            typeRef: { name: Generic.JSON }
            required: true
          # Any JSON value; null is a value, apart from absent.
          - name: note
            typeRef: { name: Generic.JSON }
          - name: extras
            typeRef: { name: Generic.JSON, isArray: true }
          - name: grid
            typeRef: { name: Generic.JSON, isArray: true, isArrayOfArrays: true }
      # Store a post's labels and embedding, JSON object and array scalars
      # alone, in a list and in a list of lists; returns the labels.
      - name: storeEmbedding
        typeRef: { name: Generic.StringMap }
        required: true
        httpMethod: POST
        restPath: "embeddings"
        arguments:
          # A label per locale, a JSON object of strings.
          - name: labels
            typeRef: { name: Generic.StringMap }
            required: true
          # A JSON array of numbers.
          - name: vector
            typeRef: { name: Embedding.Vector }
          - name: labelSets
            typeRef: { name: Generic.StringMap, isArray: true }
          - name: vectorGrid
            typeRef: { name: Embedding.Vector, isArray: true, isArrayOfArrays: true }
      # Revise a stored document; returns the document.
      - name: reviseDocument
        typeRef: { name: Generic.JSON }
        required: true
        httpMethod: PUT
        restPath: "documents"
        arguments:
          - name: revision
            typeRef: { name: DocumentRevision }
            required: true
      # Name the shades and links of a post: maps of an enum and of lists.
      - name: nameShades
        typeRef: { name: boolean }
        required: true
        httpMethod: PUT
        restPath: "posts/{id}/shade-names"
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          # A shade per name.
          - name: shadeByName
            typeRef: { name: Shade, isMap: true }
            required: true
          # Links per locale, each on https.
          - name: linksByLocale
            typeRef: { name: Network.Url, isMap: true, isArray: true }
            validatePattern: "^https://"
      # Place named points on a post's cover image: a map of an object type
      # is a body argument, not the operation's input type.
      - name: placePoints
        typeRef: { name: boolean }
        required: true
        httpMethod: PUT
        restPath: "posts/{id}/points"
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          - name: pointByName
            typeRef: { name: Point, isMap: true }
            required: true
      # Pin rows of points on a post's cover image.
      - name: pinPoints
        typeRef: { name: boolean }
        required: true
        httpMethod: PUT
        restPath: "posts/{id}/pins"
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          - name: grid
            typeRef: { name: Point, isArray: true, isArrayOfArrays: true }
            required: true
      # Remove labels from a post; returns the labels removed. A DELETE
      # reads its arguments from the body, as a PUT does.
      - name: removeTags
        typeRef: { name: string, isArray: true }
        required: true
        httpMethod: DELETE
        restPath: "posts/{id}/tags"
        arguments:
          - name: id
            typeRef: { name: string }
            required: true
          # The labels, at most three; a label may hold a comma.
          - name: labels
            typeRef: { name: string, isArray: true }
            required: true
            validateListMax: 3
          # Why, at least two characters.
          - name: reason
            typeRef: { name: string }
            validateMinLength: 2
          # Who asked, any JSON value.
          - name: requester
            typeRef: { name: Generic.JSON }
          # The shade each label had.
          - name: shadeByLabel
            typeRef: { name: Shade, isMap: true }
  - name: TagQueries
    operations:
      # Find posts by label, rank, code and page, all in the query string.
      - name: findTags
        typeRef: { name: string, isArray: true }
        required: true
        httpMethod: GET
        restPath: "posts/tags"
        arguments:
          - name: labels
            typeRef: { name: string, isArray: true }
            required: true
          # Display ranks, integers from 1.
          - name: ranks
            typeRef: { name: Ordering.Rank, isArray: true }
          # Codes of two or more lowercase letters, a query parameter.
          - name: codes
            typeRef: { name: string, isArray: true }
            isQuery: true
            validateMinLength: 2
            validatePattern: "^[a-z]+$"
          # Pages, integers from 1, a query parameter.
          - name: pages
            typeRef: { name: Ordering.Rank, isArray: true }
            isQuery: true
      # Search posts by score, rank, flag, related post, date and code.
      - name: searchPosts
        typeRef: { name: string, isArray: true }
        required: true
        httpMethod: GET
        restPath: "posts/search"
        arguments:
          # At most two tags of two or more characters.
          - name: tags
            typeRef: { name: string, isArray: true }
            isQuery: true
            validateListMax: 2
            validateMinLength: 2
          # Scores from 0 to 10.
          - name: scores
            typeRef: { name: number, isArray: true }
            validateMin: 0
            validateMax: 10
          # At most three display ranks, integers from 1.
          - name: ranks
            typeRef: { name: Ordering.Rank, isArray: true }
            validateListMax: 3
          - name: flags
            typeRef: { name: boolean, isArray: true }
          - name: related
            typeRef: { name: Identity.UUID, isArray: true }
          - name: days
            typeRef: { name: Temporal.DateTime, isArray: true }
          # Two to four codes of two to four lowercase letters.
          - name: codes
            typeRef: { name: string, isArray: true }
            validateListMin: 2
            validateListMax: 4
            validateMinLength: 2
            validateMaxLength: 4
            validatePattern: "^[a-z]+$"
          # A caption of two to five characters.
          - name: caption
            typeRef: { name: string }
            validateMinLength: 2
            validateMaxLength: 5
          - name: limit
            typeRef: { name: number }
          - name: page
            typeRef: { name: Ordering.Rank }
          - name: pinned
            typeRef: { name: boolean }
          - name: author
            typeRef: { name: Identity.UUID }
          - name: since
            typeRef: { name: Temporal.DateTime }
