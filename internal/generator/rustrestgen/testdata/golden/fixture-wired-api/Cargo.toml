[package]
name = "schemas-fixture-wired-api-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json", "matched-path"] }
http = "1"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
superschematic-http-runtime = { path = "../../../../runtime/http/rust", features = ["postgres"] }
schemas-fixture-wired-api-types = { path = "../../types/rust/fixture-wired-api" }
schemas-fixture-agent-runs-db-types = { path = "../../types/rust/fixture-agent-runs-db", features = ["postgres"] }
local-sandbox = { path = "../../../../examples/runtime-providers/rust/local-sandbox" }
sms-relay-a = { path = "../../../../examples/runtime-providers/rust/sms-relay-a" }
stub-model = { path = "../../../../examples/runtime-providers/rust/stub-model" }
superschematic-rules-adapter = { path = "../../../../runtime/engine/rust/rules-adapter", features = ["postgres"] }
superschematic-rules-behaviors = { path = "../../../../runtime/engine/rust/rules-behaviors" }
