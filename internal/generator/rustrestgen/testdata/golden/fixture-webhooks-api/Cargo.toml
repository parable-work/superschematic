[package]
name = "schemas-fixture-webhooks-api-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json", "matched-path"] }
http = "1"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
superschematic-http-runtime = { path = "../../../../runtime/http/rust" }
schemas-fixture-webhooks-api-types = { path = "../../types/rust/fixture-webhooks-api" }
