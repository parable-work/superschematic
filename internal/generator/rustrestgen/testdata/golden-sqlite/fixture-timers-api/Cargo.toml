[package]
name = "schemas-fixture-timers-api-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json", "matched-path"] }
http = "1"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
superschematic-http-runtime = { path = "../../../../runtime/http/rust", features = ["sqlite"] }
schemas-fixture-timers-api-types = { path = "../../types/rust/fixture-timers-api" }
schemas-fixture-timers-db-types = { path = "../../types/rust/fixture-timers-db" }
superschematic-rules-adapter = { path = "../../../../runtime/engine/rust/rules-adapter", features = ["sqlite"] }
superschematic-rules-behaviors = { path = "../../../../runtime/engine/rust/rules-behaviors" }
