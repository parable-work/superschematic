# Code generated by superschematic 1.2.3 from stack desk-stack. DO NOT EDIT.
#
# The stack's service is schemas/services/desk-stack. Change it and build it
# again with superschematic build, which writes this file.
#
# On a pull request to main, check builds the stack and compiles its servers
# with no credentials; each plan job plans a cloud environment as its
# planner account, and each preview job deploys a member of an environment
# with one parameter for the pull request, and destroys it when the pull
# request closes. A pull request from a fork runs check alone. On a push to
# main, each deploy job deploys a cloud environment in the order the stack
# declares them, in the GitHub environment of its name, whose required
# reviewers approve it.

name: desk-stack

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Install the static archives
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic-archives"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/archives.tar.gz" https://github.com/parable-work/superschematic/releases/download/v1.2.3/superschematic-archives_1.2.3_linux-x64.tar.gz
          echo "4444444444444444444444444444444444444444444444444444444444444444  $dir/archives.tar.gz" | sha256sum --check -
          tar -xzf "$dir/archives.tar.gz" -C "$dir" --strip-components=1
          echo "CGO_LDFLAGS=-L$dir/lib" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: "false"
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Build the services
        run: superschematic build-all schemas/services
      - name: Build the engine archive of desk-db
        working-directory: schemas/dist/engine/rust/desk-db/ffi
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic-engine/desk-db"
          mkdir -p "$dir"
          archive="$(cargo build --release --message-format=json-render-diagnostics | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | index("staticlib"))) | .filenames[] | select(endswith(".a"))' | tail -n 1)"
          test -n "$archive"
          cp "$archive" "$dir/libsuperschematic_engine.a"
      - name: Compile server Orders
        working-directory: schemas/dist/server/desk-stack/Orders
        run: go build -mod=mod -o /dev/null .
      - name: Compile server desk-api
        working-directory: schemas/dist/server/desk-stack/desk-api
        run: CGO_LDFLAGS="-L$RUNNER_TEMP/superschematic-engine/desk-db $CGO_LDFLAGS" go build -mod=mod -o /dev/null .

  plan-staging:
    name: plan Staging
    needs: check
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: desk-stack-plan-Staging-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Sign in to Google Cloud as planner
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/storefront-stack-ci/providers/ci
          service_account: storefront-stack-planner@acme-staging.fake.test
      - name: Plan Staging
        run: superschematic stack plan Staging --stack schemas/services/desk-stack

  deploy-staging:
    name: deploy Staging
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: desk-stack-Staging
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Sign in to Google Cloud as deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/storefront-stack-ci/providers/ci
          service_account: storefront-stack-deployer@acme-staging.fake.test
      - name: Build the services
        run: superschematic build-all schemas/services
      - name: Deploy Staging
        run: superschematic stack deploy Staging --stack schemas/services/desk-stack
