# Code generated by superschematic from Tasks service repo-tasks. DO NOT EDIT.
#
# Change the service's schema and build it again, which writes this file.
# Each task of the task file is a job, and a job needs the tasks its task
# uses and the tasks it follows. A paths output goes from the job that wrote
# it to each job that uses it as an artifact, and a value or an image output
# as a job output.
#
# A command writes a value or an image output, one line, to the file
# $TASK_OUTPUTS/<output>, and reads one it uses from
# $TASK_USES/<task>/<output>.
#
# The job plan plans the commit, and each task that has an input key looks
# for a pass under it before it runs. A job that finds one runs nothing and
# hands on the outputs the pass left. A pass is kept in GitHub's cache,
# which says what may read it: a pull request's runs read their own and the
# default branch's, and the default branch reads its own. A task that is not
# hermetic has no key and runs every time.

name: repo-tasks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 0 5 * * *

permissions:
  contents: read
  packages: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    container: ghcr.io/acme/ci@sha256:6a1f0c5d2b7e4f8093a1c6d5e4b3a29187f6e5d4c3b2a1908f7e6d5c4b3a2918
    outputs:
      go-test: ${{ steps.keys.outputs.go-test }}
      image: ${{ steps.keys.outputs.image }}
      lint: ${{ steps.keys.outputs.lint }}
      schema-build: ${{ steps.keys.outputs.schema-build }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "2"
      - name: Plan the commit
        id: keys
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git cat-file -e 'HEAD^1:ci/tasks.json' 2>/dev/null; then
            superschematic tasks plan HEAD --file ci/tasks.json --base 'HEAD^1' --keys >> "$GITHUB_OUTPUT"
          else
            superschematic tasks plan HEAD --file ci/tasks.json --keys >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy
    needs: [go-test, image]
    if: github.event_name == 'push'
    runs-on: deploy-runner
    container: ghcr.io/acme/ci@sha256:6a1f0c5d2b7e4f8093a1c6d5e4b3a29187f6e5d4c3b2a1908f7e6d5c4b3a2918
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the task's directories
        run: |
          mkdir -p "$RUNNER_TEMP/task/outputs" "$RUNNER_TEMP/task/uses" "$RUNNER_TEMP/task/artifacts"
          {
            echo "TASK_OUTPUTS=$RUNNER_TEMP/task/outputs"
            echo "TASK_USES=$RUNNER_TEMP/task/uses"
            echo "TASK_ARTIFACTS=$RUNNER_TEMP/task/artifacts"
          } >> "$GITHUB_ENV"
      - name: Put what the task uses in place
        env:
          USE_1: ${{ needs.image.outputs.api }}
        run: |
          mkdir -p "$TASK_USES/image"
          printf '%s\n' "$USE_1" > "$TASK_USES/image/api"
      - name: Run
        run: scripts/deploy.sh

  go-test:
    name: go-test
    needs: [lint, plan, schema-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/acme/ci@sha256:6a1f0c5d2b7e4f8093a1c6d5e4b3a29187f6e5d4c3b2a1908f7e6d5c4b3a2918
    services:
      postgres:
        image: docker.io/library/postgres@sha256:6a1f0c5d2b7e4f8093a1c6d5e4b3a29187f6e5d4c3b2a1908f7e6d5c4b3a2918
    steps:
      - name: Name the task's directories
        env:
          TASK_KEY: ${{ needs.plan.outputs.go-test }}
        run: |
          test -n "$TASK_KEY"
          mkdir -p "$RUNNER_TEMP/task/pass/outputs" "$RUNNER_TEMP/task/uses" "$RUNNER_TEMP/task/artifacts"
          {
            echo "TASK_KEY=$TASK_KEY"
            echo "TASK_PASS=$RUNNER_TEMP/task/pass"
            echo "TASK_OUTPUTS=$RUNNER_TEMP/task/pass/outputs"
            echo "TASK_USES=$RUNNER_TEMP/task/uses"
            echo "TASK_ARTIFACTS=$RUNNER_TEMP/task/artifacts"
          } >> "$GITHUB_ENV"
      - name: Look for a pass under the task's key
        id: pass
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-go-test-${{ env.TASK_KEY }}
      - name: Check out
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated of schema-build
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schema-build.generated
          path: ${{ env.TASK_ARTIFACTS }}/schema-build.generated
      - name: Put what the task uses in place
        if: steps.pass.outputs.cache-hit != 'true'
        env:
          USE_1: ${{ needs.schema-build.outputs.schema-version }}
        run: |
          tar -xf "$TASK_ARTIFACTS/schema-build.generated/generated.tar"
          mkdir -p "$TASK_USES/schema-build"
          printf '%s\n' "$USE_1" > "$TASK_USES/schema-build/schema-version"
      - name: Run
        if: steps.pass.outputs.cache-hit != 'true'
        env:
          GOFLAGS: "-mod=readonly -count=1"
          PGHOST: postgres
        run: go test -run 'Test(A|B)' ./...
      - name: Record the pass
        if: steps.pass.outputs.cache-hit != 'true'
        run: printf '%s\n' "$TASK_KEY" > "$TASK_PASS/key"
      - name: Keep the pass under the task's key
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-go-test-${{ env.TASK_KEY }}

  image:
    name: image
    needs: [plan, schema-build]
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/acme/ci@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    outputs:
      api: ${{ steps.outputs.outputs.api }}
    steps:
      - name: Name the task's directories
        env:
          TASK_KEY: ${{ needs.plan.outputs.image }}
        run: |
          test -n "$TASK_KEY"
          mkdir -p "$RUNNER_TEMP/task/pass/outputs" "$RUNNER_TEMP/task/uses" "$RUNNER_TEMP/task/artifacts"
          {
            echo "TASK_KEY=$TASK_KEY"
            echo "TASK_PASS=$RUNNER_TEMP/task/pass"
            echo "TASK_OUTPUTS=$RUNNER_TEMP/task/pass/outputs"
            echo "TASK_USES=$RUNNER_TEMP/task/uses"
            echo "TASK_ARTIFACTS=$RUNNER_TEMP/task/artifacts"
          } >> "$GITHUB_ENV"
      - name: Look for a pass under the task's key
        id: pass
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-image-${{ env.TASK_KEY }}
      - name: Check out
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated of schema-build
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schema-build.generated
          path: ${{ env.TASK_ARTIFACTS }}/schema-build.generated
      - name: Put what the task uses in place
        if: steps.pass.outputs.cache-hit != 'true'
        run: tar -xf "$TASK_ARTIFACTS/schema-build.generated/generated.tar"
      - name: Run
        if: steps.pass.outputs.cache-hit != 'true'
        run: sh -c 'docker build -q . > "$TASK_OUTPUTS/api"'
      - name: Record the pass
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          test -f "$TASK_OUTPUTS/api"
          printf '%s\n' "$TASK_KEY" > "$TASK_PASS/key"
      - name: Keep the pass under the task's key
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-image-${{ env.TASK_KEY }}
      - name: Read the task's outputs
        id: outputs
        run: |
          value=$(cat "$TASK_OUTPUTS/api")
          echo "api=$value" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: [plan]
    runs-on: ubuntu-latest
    container: ghcr.io/acme/ci@sha256:6a1f0c5d2b7e4f8093a1c6d5e4b3a29187f6e5d4c3b2a1908f7e6d5c4b3a2918
    steps:
      - name: Name the task's directories
        env:
          TASK_KEY: ${{ needs.plan.outputs.lint }}
        run: |
          test -n "$TASK_KEY"
          mkdir -p "$RUNNER_TEMP/task/pass/outputs" "$RUNNER_TEMP/task/uses" "$RUNNER_TEMP/task/artifacts"
          {
            echo "TASK_KEY=$TASK_KEY"
            echo "TASK_PASS=$RUNNER_TEMP/task/pass"
            echo "TASK_OUTPUTS=$RUNNER_TEMP/task/pass/outputs"
            echo "TASK_USES=$RUNNER_TEMP/task/uses"
            echo "TASK_ARTIFACTS=$RUNNER_TEMP/task/artifacts"
          } >> "$GITHUB_ENV"
      - name: Look for a pass under the task's key
        id: pass
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-lint-${{ env.TASK_KEY }}
      - name: Check out
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run
        if: steps.pass.outputs.cache-hit != 'true'
        run: golangci-lint run
      - name: Record the pass
        if: steps.pass.outputs.cache-hit != 'true'
        run: printf '%s\n' "$TASK_KEY" > "$TASK_PASS/key"
      - name: Keep the pass under the task's key
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-lint-${{ env.TASK_KEY }}

  schema-build:
    name: schema-build
    needs: [plan]
    runs-on: ubuntu-latest
    container: ghcr.io/acme/ci@sha256:6a1f0c5d2b7e4f8093a1c6d5e4b3a29187f6e5d4c3b2a1908f7e6d5c4b3a2918
    outputs:
      schema-version: ${{ steps.outputs.outputs.schema-version }}
    steps:
      - name: Name the task's directories
        env:
          TASK_KEY: ${{ needs.plan.outputs.schema-build }}
        run: |
          test -n "$TASK_KEY"
          mkdir -p "$RUNNER_TEMP/task/pass/outputs" "$RUNNER_TEMP/task/uses" "$RUNNER_TEMP/task/artifacts"
          {
            echo "TASK_KEY=$TASK_KEY"
            echo "TASK_PASS=$RUNNER_TEMP/task/pass"
            echo "TASK_OUTPUTS=$RUNNER_TEMP/task/pass/outputs"
            echo "TASK_USES=$RUNNER_TEMP/task/uses"
            echo "TASK_ARTIFACTS=$RUNNER_TEMP/task/artifacts"
          } >> "$GITHUB_ENV"
      - name: Look for a pass under the task's key
        id: pass
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-schema-build-${{ env.TASK_KEY }}
      - name: Check out
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run
        if: steps.pass.outputs.cache-hit != 'true'
        run: superschematic build-all schemas/services
      - name: Pack generated
        if: steps.pass.outputs.cache-hit != 'true'
        shell: bash
        run: |
          shopt -s globstar nullglob dotglob
          tar -cf "$TASK_PASS/generated.tar" -- schemas/dist go/**/*_gen.go 'docs/it'\''s here/'[a-c]*.md
      - name: Record the pass
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          test -f "$TASK_OUTPUTS/schema-version"
          printf '%s\n' "$TASK_KEY" > "$TASK_PASS/key"
      - name: Keep the pass under the task's key
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_PASS }}
          key: tasks-v1-repo-tasks-schema-build-${{ env.TASK_KEY }}
      - name: Upload generated
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-build.generated
          path: ${{ env.TASK_PASS }}/generated.tar
          if-no-files-found: error
      - name: Read the task's outputs
        id: outputs
        run: |
          value=$(cat "$TASK_OUTPUTS/schema-version")
          echo "schema-version=$value" >> "$GITHUB_OUTPUT"
