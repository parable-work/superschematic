      - name: Plan Live
        run: superschematic stack plan Live --stack schemas/services/shop-stack

  preview-review:
    name: preview Review
    needs: check
    if: "!cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || needs.check.result == 'success')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: shop-stack-Review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
