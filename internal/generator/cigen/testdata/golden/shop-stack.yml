      - name: Deploy Review for the pull request
        if: github.event.action != 'closed'
        run: superschematic stack deploy Review --stack schemas/services/shop-stack --param pr=${{ github.event.pull_request.number }}
      - name: Destroy Review for the pull request
        if: github.event.action == 'closed'
        run: superschematic stack destroy Review --stack schemas/services/shop-stack --param pr=${{ github.event.pull_request.number }} --yes

