      - name: Sign in to Google Cloud as planner
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/shop-stack-ci/providers/ci
          service_account: shop-stack-planner@acme-beta.fake.test
      - name: Plan Beta
        run: superschematic stack plan Beta --stack schemas/services/shop-stack

