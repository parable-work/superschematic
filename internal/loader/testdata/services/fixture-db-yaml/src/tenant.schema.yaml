name: fixture-db
kind: DB
scalars:
  Generic.JSON:
    name: Generic.JSON
    languagePrimitive: object
  Identity.Name:
    name: Identity.Name
    languagePrimitive: string
  Identity.Slug:
    name: Identity.Slug
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
types:
  # Base class providing audit fields to every table.
  Auditable:
    name: Auditable
    role: DBTable
    fields:
      - name: createdAt
        typeRef: { name: Temporal.DateTime }
        required: true
      - name: updatedAt
        typeRef: { name: Temporal.DateTime }
  # A tenant of the platform.
  Tenant:
    name: Tenant
    role: DBTable
    versioned: true
    extends: Auditable
    rawHeritage:
      extends: Auditable
    fields:
      - name: createdAt
        typeRef: { name: Temporal.DateTime }
        required: true
        inheritedFrom: Auditable
      - name: updatedAt
        typeRef: { name: Temporal.DateTime }
        inheritedFrom: Auditable
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        unique: true
        autoGenerated: true
      # Display name shown across the product.
      - name: name
        typeRef: { name: Identity.Name }
        required: true
        searchField: true
        sourceMustProject: true
      - name: slug
        typeRef: { name: Identity.Slug }
        required: true
        unique: true
      - name: email
        typeRef: { name: string }
        required: true
        validatePattern: "@"
      - name: status
        typeRef: { name: TenantStatus }
        required: true
        default: active
      - name: isActive
        typeRef: { name: boolean }
        required: true
        default: "true"
      - name: seatCount
        typeRef: { name: number }
        required: true
        default: "5"
      - name: metadata
        typeRef: { name: Generic.JSON }
        required: true
        jsonField: true
      - name: users
        typeRef: { name: TenantUser, isArray: true }
        required: true
        hasMany: true
    indexes:
      - keys: [slug]
        unique: true
        name: slug
  # A soft-deletable tenant membership.
  TenantUser:
    name: TenantUser
    role: DBTable
    versioned: true
    extends: Auditable
    rawHeritage:
      extends: Auditable
    fields:
      - name: createdAt
        typeRef: { name: Temporal.DateTime }
        required: true
        inheritedFrom: Auditable
      - name: updatedAt
        typeRef: { name: Temporal.DateTime }
        inheritedFrom: Auditable
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: tenant
        typeRef: { name: Tenant }
        required: true
        relation: { type: Tenant, onDelete: RESTRICT }
      - name: displayName
        typeRef: { name: string }
      - name: deletedAt
        typeRef: { name: Temporal.DateTime }
      - name: deletedBy
        typeRef: { name: Identity.UUID }
    indexes:
      - keys: [tenant, displayName]
        unique: true
enums:
  TenantStatus:
    name: TenantStatus
    values:
      - name: Active
        serializedAs: active
      - name: Suspended
        serializedAs: suspended
