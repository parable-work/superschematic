name: fixture-paged-api
kind: API
scalars:
  Identity.Slug:
    name: Identity.Slug
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
types:
  # Request body: the lines of a basket to place.
  BasketInput:
    name: BasketInput
    role: APIInput
    fields:
      - name: lines
        typeRef: { name: BasketLine, isArray: true }
        required: true
        validateListMin: 1
        validateListMax: 5
  # One line of a basket: an item and how many of it.
  BasketLine:
    name: BasketLine
    role: EmbeddedStruct
    fields:
      - name: itemId
        typeRef: { name: Identity.UUID }
        required: true
      - name: quantity
        typeRef: { name: number }
        required: true
        validateMin: 1
        validateMax: 9
  # A placed basket.
  BasketView:
    name: BasketView
    role: EmbeddedStruct
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
      - name: lines
        typeRef: { name: BasketLine, isArray: true }
        required: true
  # An item of the catalog.
  ItemView:
    name: ItemView
    role: EmbeddedStruct
    display:
      noun: Item
      plural: Items
      titleField: name
      summaryFields: [name, sku]
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
      - name: name
        typeRef: { name: string }
        required: true
      - name: sku
        typeRef: { name: Identity.Slug }
        required: true
      - name: inStock
        typeRef: { name: boolean }
        required: true
operationSets:
  - name: Catalog
    operations:
      # The items, two to a page unless the caller asks for up to five, by
      # their ids or their stock.
      - name: listItems
        typeRef: { name: ItemView, isArray: true }
        required: true
        arguments:
          - name: ids
            typeRef: { name: Identity.UUID, isArray: true }
            validateListMax: 5
            isQuery: true
          - name: inStock
            typeRef: { name: boolean }
            isQuery: true
        page: { defaultLimit: 2, maxLimit: 5 }
        httpMethod: GET
        restPath: items
      # One item.
      - name: getItem
        typeRef: { name: ItemView }
        required: true
        arguments:
          - name: itemId
            typeRef: { name: Identity.UUID }
            required: true
        httpMethod: GET
        restPath: items/{itemId}
      # The tags items carry: a page of a primitive, with the default limits.
      - name: listTags
        typeRef: { name: string, isArray: true }
        required: true
        page: {}
        httpMethod: GET
        restPath: tags
      # Place a basket.
      - name: placeBasket
        typeRef: { name: BasketView }
        required: true
        arguments:
          - name: input
            typeRef: { name: BasketInput }
            required: true
        httpMethod: POST
        restPath: baskets
