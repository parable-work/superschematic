name: fixture-paged-api
kind: API
scalars:
  Generic.Decimal:
    name: Generic.Decimal
    languagePrimitive: string
  Generic.Int64:
    name: Generic.Int64
    languagePrimitive: number
  Identity.Slug:
    name: Identity.Slug
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Temporal.Date:
    name: Temporal.Date
    languagePrimitive: string
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
types:
  # Request body: the lines of a basket to place.
  BasketInput:
    name: BasketInput
    role: APIInput
    fields:
      - name: lines
        typeRef: { name: BasketLine, isArray: true }
        required: true
        validateListMin: 1
        validateListMax: 5
  # One line of a basket: an item and how many of it.
  BasketLine:
    name: BasketLine
    role: EmbeddedStruct
    fields:
      - name: itemId
        typeRef: { name: Identity.UUID }
        required: true
      - name: quantity
        typeRef: { name: number }
        required: true
        validateMin: 1
        validateMax: 9
  # A placed basket.
  BasketView:
    name: BasketView
    role: EmbeddedStruct
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
      - name: lines
        typeRef: { name: BasketLine, isArray: true }
        required: true
  # An item of the catalog.
  ItemView:
    name: ItemView
    role: EmbeddedStruct
    display:
      noun: Item
      plural: Items
      titleField: name
      summaryFields: [name, sku]
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
      - name: name
        typeRef: { name: string }
        required: true
      - name: sku
        typeRef: { name: Identity.Slug }
        required: true
      - name: inStock
        typeRef: { name: boolean }
        required: true
  # A part of an item: a field of every kind a filter compares.
  PartView:
    name: PartView
    role: EmbeddedStruct
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
      - name: name
        typeRef: { name: string }
        required: true
      - name: kind
        typeRef: { name: PartKind }
        required: true
      - name: quantity
        typeRef: { name: Generic.Int64 }
        required: true
      - name: weight
        typeRef: { name: number }
        required: true
      - name: price
        typeRef: { name: Generic.Decimal }
        required: true
      - name: discontinued
        typeRef: { name: boolean }
        required: true
      - name: madeAt
        typeRef: { name: Temporal.DateTime }
        required: true
      - name: retiredOn
        typeRef: { name: Temporal.Date }
      - name: supplierId
        typeRef: { name: Identity.UUID }
enums:
  # What a part is.
  PartKind:
    name: PartKind
    values:
      - { name: Bolt, serializedAs: bolt }
      - { name: Nut, serializedAs: nut }
      - { name: Washer, serializedAs: washer }
operationSets:
  - name: Catalog
    operations:
      # The items, two to a page unless the caller asks for up to five, by
      # their ids or their stock, in order of their names unless the caller
      # sorts them by name or sku, either way.
      - name: listItems
        typeRef: { name: ItemView, isArray: true }
        required: true
        arguments:
          - name: ids
            typeRef: { name: Identity.UUID, isArray: true }
            validateListMax: 5
            isQuery: true
          - name: inStock
            typeRef: { name: boolean }
            isQuery: true
          - name: sort
            typeRef: { name: string }
            isQuery: true
            sort: [name, sku]
        page: { defaultLimit: 2, maxLimit: 5, defaultSort: name }
        httpMethod: GET
        restPath: items
      # One item.
      - name: getItem
        typeRef: { name: ItemView }
        required: true
        arguments:
          - name: itemId
            typeRef: { name: Identity.UUID }
            required: true
        httpMethod: GET
        restPath: items/{itemId}
      # The tags items carry: a page of a primitive, with the default limits.
      - name: listTags
        typeRef: { name: string, isArray: true }
        required: true
        page: {}
        httpMethod: GET
        restPath: tags
      # The parts, in order of their names unless the caller sorts them by
      # quantity, kept to the ones the caller's filters find (D106): a filter
      # on a field of each kind, beside a page and a sort.
      - name: listParts
        typeRef: { name: PartView, isArray: true }
        required: true
        arguments:
          - name: sort
            typeRef: { name: string }
            isQuery: true
            sort: [name, quantity]
        filter:
          argument: filter
          fields:
            - name: id
            - name: name
            - name: kind
            - name: quantity
            - name: weight
            - name: price
            - name: discontinued
            - name: madeAt
            - name: retiredOn
            - name: supplierId
        page: { defaultLimit: 2, maxLimit: 5, defaultSort: name }
        httpMethod: GET
        restPath: parts
      # Place a basket.
      - name: placeBasket
        typeRef: { name: BasketView }
        required: true
        arguments:
          - name: input
            typeRef: { name: BasketInput }
            required: true
        httpMethod: POST
        restPath: baskets
