# The base version of the plan goldens: each case of plan_golden_test.go
# loads this service twice and changes one thing in the second copy.
name: shop-db
kind: DB
scalars:
  Contact.Email:
    name: Contact.Email
    languagePrimitive: string
  Contact.PhoneNumber:
    name: Contact.PhoneNumber
    languagePrimitive: string
  Generic.Int64:
    name: Generic.Int64
    languagePrimitive: number
  Identity.Name:
    name: Identity.Name
    languagePrimitive: string
  Identity.Slug:
    name: Identity.Slug
    languagePrimitive: string
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
  Temporal.DateTime:
    name: Temporal.DateTime
    languagePrimitive: string
types:
  # A customer of the shop.
  Customer:
    name: Customer
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: Identity.Name }
        required: true
      - name: email
        typeRef: { name: Contact.Email }
        required: true
        unique: true
      - name: createdAt
        typeRef: { name: Temporal.DateTime }
        required: true
      # The customer who referred this one, if any.
      - name: referrerId
        typeRef: { name: Identity.UUID }
  # An order a customer placed.
  Order:
    name: Order
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: code
        typeRef: { name: Identity.Name }
        required: true
      - name: customer
        typeRef: { name: Customer }
        required: true
        relation: { type: Customer, onDelete: RESTRICT }
      - name: total
        typeRef: { name: Generic.Int64 }
        required: true
      - name: reference
        typeRef: { name: string }
      - name: note
        typeRef: { name: string }
      - name: placedAt
        typeRef: { name: Temporal.DateTime }
        required: true
      - name: lines
        typeRef: { name: OrderLine, isArray: true }
        required: true
        hasMany: true
      - name: labels
        typeRef: { name: Label, isArray: true }
        manyToMany: true
    indexes:
      - keys: [customer, placedAt]
  # One line of an order.
  OrderLine:
    name: OrderLine
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: sku
        typeRef: { name: string }
        required: true
      - name: quantity
        typeRef: { name: Generic.Int64 }
        required: true
  # A label an order can carry.
  Label:
    name: Label
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: Identity.Slug }
        required: true
        unique: true
  # A product in the catalog, searchable by title.
  Product:
    name: Product
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: title
        typeRef: { name: Identity.Name }
        required: true
        searchField: true
      - name: price
        typeRef: { name: Generic.Int64 }
        required: true
  # Orders with their customer's name, for reporting.
  OrderSummary:
    name: OrderSummary
    role: Projection
    projection:
      pool: report
      name: order_summary
      migration: "20260101000000"
      source: Order
      joins:
        - type: Customer
          alias: customer
          kind: inner
          on:
            - { left: customer.id, right: base.customer }
    fields:
      - name: code
        typeRef: { name: Identity.Name }
        required: true
      - name: total
        typeRef: { name: Generic.Int64 }
        required: true
      - name: customerName
        typeRef: { name: Identity.Name }
        required: true
        projectedFrom: customer.name
