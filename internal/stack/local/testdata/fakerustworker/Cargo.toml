# A fake Rust worker that honours the contract of a generated worker
# entrypoint (docs/stack-model.md, section 8.8) for the local target's
# integration test (D65). It depends on nothing, so cargo builds it
# offline. Its one binary is named after its deployable, as servergen
# names a Rust worker's, not after its package.
[package]
name = "fake-rust-worker"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "ledger-rs-post-entries"
path = "src/main.rs"

# Its own workspace, so no Cargo.toml above the directory it is copied to
# claims it.
[workspace]
