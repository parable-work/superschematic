[package]
name = "acme-shop-orders-server"
version = "0.0.0"
edition = "2021"
publish = false

# The generated server crate under ../schemas/dist-rust, which
# scripts/check.sh builds with
# `superschematic build --with-deps --api-language RUST --out schemas/dist-rust`,
# and the runtime crate it is built on.
[dependencies]
acme-shop-orders-api = { path = "../schemas/dist-rust/api/shop-orders" }
superschematic-http-runtime = { path = "../../../runtime/http/rust" }
async-trait = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
# The shop in a SQLite file (src/sqlite.rs), over rusqlite with the SQLite
# it bundles. Only the `sqlite` feature, which the Topcoat app turns on,
# builds them; the server in src/main.rs keeps the shop in memory.
rusqlite = { version = "0.40.2", optional = true, features = ["bundled"] }
serde_json = { version = "1", optional = true }

[features]
sqlite = ["dep:rusqlite", "dep:serde_json"]

# Its own workspace, so no Cargo.toml above this directory claims it.
[workspace]
