# Rendered by superschematic from the resource graph of environment Staging of
# stack Shop. Do not edit: change the stack and render it again.

name: shop
runtime: yaml
description: Environment Staging of stack Shop
resources:
  # phase infrastructure; owners Orders
  Orders-account:
    name: Orders.account
    type: gcp:serviceaccount/account:Account
    properties:
      accountId: orders
      displayName: Shop Staging server Orders
      project: acme-staging
    options:
      version: 9.37.1
  # phase infrastructure; owners sql:Orders->shop-db
  Orders-cloudsql-client-shop-db:
    name: Orders.cloudsql-client.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${Orders-account.member}
      project: acme-staging
      role: roles/cloudsql.client
    options:
      dependsOn:
        - ${Orders-account}
      version: 9.37.1
  # phase infrastructure; owners sql:Orders->shop-db
  Orders-cloudsql-login-shop-db:
    name: Orders.cloudsql-login.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${Orders-account.member}
      project: acme-staging
      role: roles/cloudsql.instanceUser
    options:
      dependsOn:
        - ${Orders-account}
      version: 9.37.1
  # phase infrastructure; owners sql:Orders->shop-db
  Orders-database-user-shop-db:
    name: Orders.database-user.shop-db
    type: gcp:sql/user:User
    properties:
      deletionPolicy: ABANDON
      instance: ${shop-db-instance.name}
      name: orders@acme-staging.iam
      project: acme-staging
      type: CLOUD_IAM_SERVICE_ACCOUNT
    options:
      dependsOn:
        - ${Orders-account}
        - ${shop-db-instance}
      version: 9.37.1
  # phase infrastructure; owners Orders
  Orders-reads-PaymentsSecrets-STRIPE_KEY:
    name: Orders.reads.PaymentsSecrets.STRIPE_KEY
    type: gcp:secretmanager/secretIamMember:SecretIamMember
    properties:
      member: ${Orders-account.member}
      project: acme-staging
      role: roles/secretmanager.secretAccessor
      secretId: ${secret-PaymentsSecrets-STRIPE_KEY.id}
    options:
      dependsOn:
        - ${Orders-account}
        - ${secret-PaymentsSecrets-STRIPE_KEY}
      version: 9.37.1
  # phase rollout; owners http:Orders->shop-api
  Orders-run-invoker-shop-api:
    name: Orders.run-invoker.shop-api
    type: gcp:cloudrunv2/serviceIamMember:ServiceIamMember
    properties:
      location: us-east1
      member: ${Orders-account.member}
      name: ${shop-api-service.name}
      project: acme-staging
      role: roles/run.invoker
    options:
      dependsOn:
        - ${Orders-account}
        - ${shop-api-service}
      version: 9.37.1
  # phase rollout; owners Orders
  Orders-service:
    name: Orders.service
    type: gcp:cloudrunv2/service:Service
    properties:
      customAudiences:
        - //run.googleapis.com/projects/acme-staging/locations/us-east1/services/orders
      deletionProtection: false
      ingress: INGRESS_TRAFFIC_INTERNAL_ONLY
      invokerIamDisabled: false
      location: us-east1
      name: orders
      project: acme-staging
      template:
        containers:
          - envs:
              - name: FULFILLMENT_REGION
                value: us
              - name: MAX_LINE_ITEMS
                value: "50"
              - name: SHOP_API_SERVICE_CREDENTIAL_AUDIENCE
                value: //run.googleapis.com/projects/acme-staging/locations/us-east1/services/shop-api
              - name: SHOP_API_SERVICE_CREDENTIAL_SOURCE
                value: google-id-token
              - name: SHOP_API_SERVICE_URL
                value: ${shop-api-service.uri}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
                value: ${shop-db-database-shop-db.name}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
                value: ${shop-db-instance.connectionName}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
                value: orders@acme-staging.iam
              - name: STRIPE_KEY
                valueSource:
                  secretKeyRef:
                    secret: ${secret-PaymentsSecrets-STRIPE_KEY.secretId}
                    version: latest
            image: us-east1-docker.pkg.dev/acme-staging/shop/orders
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 15
              timeoutSeconds: 5
            ports:
              containerPort: 8080
            resources:
              cpuIdle: true
              limits:
                cpu: "1"
                memory: 512Mi
            startupProbe:
              failureThreshold: 24
              httpGet:
                path: /readyz
                port: 8080
              periodSeconds: 5
              timeoutSeconds: 4
            volumeMounts:
              - mountPath: /cloudsql
                name: cloudsql
        serviceAccount: ${Orders-account.email}
        volumes:
          - cloudSqlInstance:
              instances:
                - ${shop-db-instance.connectionName}
            name: cloudsql
        vpcAccess:
          egress: ALL_TRAFFIC
          networkInterfaces:
            - network: ${network.name}
              subnetwork: ${network-subnet.name}
    options:
      dependsOn:
        - ${Orders-account}
        - ${network}
        - ${network-subnet}
        - ${secret-PaymentsSecrets-STRIPE_KEY}
        - ${shop-api-service}
        - ${shop-db-database-shop-db}
        - ${shop-db-instance}
      version: 9.37.1
  # phase infrastructure; owners Orders
  Orders-trace-agent:
    name: Orders.trace-agent
    type: gcp:projects/iAMMember:IAMMember
    properties:
      member: ${Orders-account.member}
      project: acme-staging
      role: roles/cloudtrace.agent
    options:
      dependsOn:
        - ${Orders-account}
      version: 9.37.1
  # phase exposure; owners dns
  dns-shop-api-a:
    name: dns.shop-api.a
    type: gcp:dns/recordSet:RecordSet
    properties:
      managedZone: acme-dev
      name: shop-api.staging.acme.dev.
      project: acme-staging
      rrdatas:
        - ${shop-api-address.address}
      ttl: 300
      type: A
    options:
      dependsOn:
        - ${shop-api-address}
      version: 9.37.1
  # phase exposure; owners dns
  dns-shop-api-cname:
    name: dns.shop-api.cname
    type: gcp:dns/recordSet:RecordSet
    properties:
      managedZone: acme-dev
      name: _acme-challenge.shop-api.staging.acme.dev.
      project: acme-staging
      rrdatas:
        - ${shop-api-dns-authorization.dnsResourceRecords[0].data}
      ttl: 300
      type: CNAME
    options:
      dependsOn:
        - ${shop-api-dns-authorization}
      version: 9.37.1
  # phase infrastructure; owners Orders, shop-orders-fulfil-orders, shop-orders-ship-orders
  network:
    name: network
    type: gcp:compute/network:Network
    properties:
      autoCreateSubnetworks: false
      name: shop
      project: acme-staging
    options:
      version: 9.37.1
  # phase infrastructure; owners Orders, shop-orders-fulfil-orders, shop-orders-ship-orders
  network-nat:
    name: network.nat
    type: gcp:compute/routerNat:RouterNat
    properties:
      name: shop-egress
      natIpAllocateOption: AUTO_ONLY
      project: acme-staging
      region: us-east1
      router: ${network-router.name}
      sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
    options:
      dependsOn:
        - ${network-router}
      version: 9.37.1
  # phase infrastructure; owners Orders, shop-orders-fulfil-orders, shop-orders-ship-orders
  network-router:
    name: network.router
    type: gcp:compute/router:Router
    properties:
      name: shop-egress
      network: ${network.id}
      project: acme-staging
      region: us-east1
    options:
      dependsOn:
        - ${network}
      version: 9.37.1
  # phase infrastructure; owners Orders, shop-orders-fulfil-orders, shop-orders-ship-orders
  network-subnet:
    name: network.subnet
    type: gcp:compute/subnetwork:Subnetwork
    properties:
      ipCidrRange: 10.8.0.0/20
      name: shop-egress
      network: ${network.id}
      privateIpGoogleAccess: true
      project: acme-staging
      region: us-east1
    options:
      dependsOn:
        - ${network}
      version: 9.37.1
  # phase infrastructure; owners Orders, shop-api, shop-orders-fulfil-orders, shop-orders-ship-orders
  secret-PaymentsSecrets-STRIPE_KEY:
    name: secret.PaymentsSecrets.STRIPE_KEY
    type: gcp:secretmanager/secret:Secret
    properties:
      project: acme-staging
      replication:
        auto: {}
      secretId: Shop-PaymentsSecrets-STRIPE_KEY
    options:
      version: 9.37.1
  # phase infrastructure; owners shop-api
  shop-api-account:
    name: shop-api.account
    type: gcp:serviceaccount/account:Account
    properties:
      accountId: shop-api
      displayName: Shop Staging server shop-api
      project: acme-staging
    options:
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-address:
    name: shop-api.address
    type: gcp:compute/globalAddress:GlobalAddress
    properties:
      ipVersion: IPV4
      name: shop-api-ip
      project: acme-staging
    options:
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-backend:
    name: shop-api.backend
    type: gcp:compute/backendService:BackendService
    properties:
      backends:
        - group: ${shop-api-endpoint-group.id}
      loadBalancingScheme: EXTERNAL_MANAGED
      name: shop-api-backend
      project: acme-staging
    options:
      dependsOn:
        - ${shop-api-endpoint-group}
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-certificate:
    name: shop-api.certificate
    type: gcp:certificatemanager/certificate:Certificate
    properties:
      managed:
        dnsAuthorizations:
          - ${shop-api-dns-authorization.id}
        domains:
          - shop-api.staging.acme.dev
      name: shop-api-cert
      project: acme-staging
    options:
      dependsOn:
        - ${shop-api-dns-authorization}
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-certificate-map:
    name: shop-api.certificate-map
    type: gcp:certificatemanager/certificateMap:CertificateMap
    properties:
      name: shop-api-certs
      project: acme-staging
    options:
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-certificate-map-entry:
    name: shop-api.certificate-map-entry
    type: gcp:certificatemanager/certificateMapEntry:CertificateMapEntry
    properties:
      certificates:
        - ${shop-api-certificate.id}
      hostname: shop-api.staging.acme.dev
      map: ${shop-api-certificate-map.name}
      name: shop-api-certs-host
      project: acme-staging
    options:
      dependsOn:
        - ${shop-api-certificate}
        - ${shop-api-certificate-map}
      version: 9.37.1
  # phase infrastructure; owners sql:shop-api->shop-db
  shop-api-cloudsql-client-shop-db:
    name: shop-api.cloudsql-client.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${shop-api-account.member}
      project: acme-staging
      role: roles/cloudsql.client
    options:
      dependsOn:
        - ${shop-api-account}
      version: 9.37.1
  # phase infrastructure; owners sql:shop-api->shop-db
  shop-api-cloudsql-login-shop-db:
    name: shop-api.cloudsql-login.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${shop-api-account.member}
      project: acme-staging
      role: roles/cloudsql.instanceUser
    options:
      dependsOn:
        - ${shop-api-account}
      version: 9.37.1
  # phase infrastructure; owners sql:shop-api->shop-db
  shop-api-database-user-shop-db:
    name: shop-api.database-user.shop-db
    type: gcp:sql/user:User
    properties:
      deletionPolicy: ABANDON
      instance: ${shop-db-instance.name}
      name: shop-api@acme-staging.iam
      project: acme-staging
      type: CLOUD_IAM_SERVICE_ACCOUNT
    options:
      dependsOn:
        - ${shop-api-account}
        - ${shop-db-instance}
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-dns-authorization:
    name: shop-api.dns-authorization
    type: gcp:certificatemanager/dnsAuthorization:DnsAuthorization
    properties:
      domain: shop-api.staging.acme.dev
      name: shop-api-dns-auth
      project: acme-staging
    options:
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-endpoint-group:
    name: shop-api.endpoint-group
    type: gcp:compute/regionNetworkEndpointGroup:RegionNetworkEndpointGroup
    properties:
      cloudRun:
        service: ${shop-api-service.name}
      name: shop-api-neg
      networkEndpointType: SERVERLESS
      project: acme-staging
      region: us-east1
    options:
      dependsOn:
        - ${shop-api-service}
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-forwarding-rule:
    name: shop-api.forwarding-rule
    type: gcp:compute/globalForwardingRule:GlobalForwardingRule
    properties:
      ipAddress: ${shop-api-address.address}
      ipProtocol: TCP
      loadBalancingScheme: EXTERNAL_MANAGED
      name: shop-api-https
      portRange: "443"
      project: acme-staging
      target: ${shop-api-https-proxy.id}
    options:
      dependsOn:
        - ${shop-api-address}
        - ${shop-api-https-proxy}
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-https-proxy:
    name: shop-api.https-proxy
    type: gcp:compute/targetHttpsProxy:TargetHttpsProxy
    properties:
      certificateMap: //certificatemanager.googleapis.com/${shop-api-certificate-map.id}
      name: shop-api-https
      project: acme-staging
      urlMap: ${shop-api-url-map.id}
    options:
      dependsOn:
        - ${shop-api-certificate-map}
        - ${shop-api-certificate-map-entry}
        - ${shop-api-url-map}
      version: 9.37.1
  # phase infrastructure; owners shop-api
  shop-api-reads-PaymentsSecrets-STRIPE_KEY:
    name: shop-api.reads.PaymentsSecrets.STRIPE_KEY
    type: gcp:secretmanager/secretIamMember:SecretIamMember
    properties:
      member: ${shop-api-account.member}
      project: acme-staging
      role: roles/secretmanager.secretAccessor
      secretId: ${secret-PaymentsSecrets-STRIPE_KEY.id}
    options:
      dependsOn:
        - ${secret-PaymentsSecrets-STRIPE_KEY}
        - ${shop-api-account}
      version: 9.37.1
  # phase rollout; owners shop-api
  shop-api-service:
    name: shop-api.service
    type: gcp:cloudrunv2/service:Service
    properties:
      customAudiences:
        - //run.googleapis.com/projects/acme-staging/locations/us-east1/services/shop-api
      deletionProtection: false
      ingress: INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
      invokerIamDisabled: true
      location: us-east1
      name: shop-api
      project: acme-staging
      template:
        containers:
          - envs:
              - name: LOG_LEVEL
                value: info
              - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
                value: ${shop-db-database-shop-db.name}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
                value: ${shop-db-instance.connectionName}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
                value: shop-api@acme-staging.iam
              - name: STRIPE_KEY
                valueSource:
                  secretKeyRef:
                    secret: ${secret-PaymentsSecrets-STRIPE_KEY.secretId}
                    version: latest
            image: us-east1-docker.pkg.dev/acme-staging/shop/shop-api
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 15
              timeoutSeconds: 5
            ports:
              containerPort: 8080
            resources:
              cpuIdle: true
              limits:
                cpu: "1"
                memory: 512Mi
            startupProbe:
              failureThreshold: 24
              httpGet:
                path: /readyz
                port: 8080
              periodSeconds: 5
              timeoutSeconds: 4
            volumeMounts:
              - mountPath: /cloudsql
                name: cloudsql
        serviceAccount: ${shop-api-account.email}
        volumes:
          - cloudSqlInstance:
              instances:
                - ${shop-db-instance.connectionName}
            name: cloudsql
    options:
      dependsOn:
        - ${secret-PaymentsSecrets-STRIPE_KEY}
        - ${shop-api-account}
        - ${shop-db-database-shop-db}
        - ${shop-db-instance}
      version: 9.37.1
  # phase infrastructure; owners shop-api
  shop-api-trace-agent:
    name: shop-api.trace-agent
    type: gcp:projects/iAMMember:IAMMember
    properties:
      member: ${shop-api-account.member}
      project: acme-staging
      role: roles/cloudtrace.agent
    options:
      dependsOn:
        - ${shop-api-account}
      version: 9.37.1
  # phase exposure; owners shop-api
  shop-api-url-map:
    name: shop-api.url-map
    type: gcp:compute/uRLMap:URLMap
    properties:
      defaultService: ${shop-api-backend.id}
      name: shop-api-lb
      project: acme-staging
    options:
      dependsOn:
        - ${shop-api-backend}
      version: 9.37.1
  # phase infrastructure; owners shop-db
  shop-db-database-shop-db:
    name: shop-db.database.shop-db
    type: gcp:sql/database:Database
    properties:
      instance: ${shop-db-instance.name}
      name: shop_db
      project: acme-staging
    options:
      dependsOn:
        - ${shop-db-instance}
      version: 9.37.1
  # phase infrastructure; owners shop-db
  shop-db-instance:
    name: shop-db.instance
    type: gcp:sql/databaseInstance:DatabaseInstance
    properties:
      databaseVersion: POSTGRES_16
      deletionProtection: false
      name: shop-db
      project: acme-staging
      region: us-east1
      settings:
        availabilityType: ZONAL
        backupConfiguration:
          enabled: true
          pointInTimeRecoveryEnabled: false
        connectorEnforcement: REQUIRED
        databaseFlags:
          - name: cloudsql.iam_authentication
            value: on
        deletionProtectionEnabled: false
        edition: ENTERPRISE
        ipConfiguration:
          ipv4Enabled: true
        tier: db-custom-1-3840
    options:
      version: 9.37.1
  # phase infrastructure; owners shop-db
  shop-db-migrator:
    name: shop-db.migrator
    type: gcp:sql/user:User
    properties:
      databaseRoles:
        - cloudsqlsuperuser
      deletionPolicy: ABANDON
      instance: ${shop-db-instance.name}
      name: shop-migrator@acme-staging.iam
      project: acme-staging
      type: CLOUD_IAM_SERVICE_ACCOUNT
    options:
      dependsOn:
        - ${shop-db-instance}
      version: 9.37.1
  # phase infrastructure; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-account:
    name: shop-orders-fulfil-orders.account
    type: gcp:serviceaccount/account:Account
    properties:
      accountId: shop-orders-fulfil-orders
      displayName: Shop Staging worker shop-orders-fulfil-orders
      project: acme-staging
    options:
      version: 9.37.1
  # phase infrastructure; owners sql:shop-orders-fulfil-orders->shop-db
  shop-orders-fulfil-orders-cloudsql-client-shop-db:
    name: shop-orders-fulfil-orders.cloudsql-client.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${shop-orders-fulfil-orders-account.member}
      project: acme-staging
      role: roles/cloudsql.client
    options:
      dependsOn:
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase infrastructure; owners sql:shop-orders-fulfil-orders->shop-db
  shop-orders-fulfil-orders-cloudsql-login-shop-db:
    name: shop-orders-fulfil-orders.cloudsql-login.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${shop-orders-fulfil-orders-account.member}
      project: acme-staging
      role: roles/cloudsql.instanceUser
    options:
      dependsOn:
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase infrastructure; owners sql:shop-orders-fulfil-orders->shop-db
  shop-orders-fulfil-orders-database-user-shop-db:
    name: shop-orders-fulfil-orders.database-user.shop-db
    type: gcp:sql/user:User
    properties:
      deletionPolicy: ABANDON
      instance: ${shop-db-instance.name}
      name: shop-orders-fulfil-orders@acme-staging.iam
      project: acme-staging
      type: CLOUD_IAM_SERVICE_ACCOUNT
    options:
      dependsOn:
        - ${shop-db-instance}
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase infrastructure; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-reads-PaymentsSecrets-STRIPE_KEY:
    name: shop-orders-fulfil-orders.reads.PaymentsSecrets.STRIPE_KEY
    type: gcp:secretmanager/secretIamMember:SecretIamMember
    properties:
      member: ${shop-orders-fulfil-orders-account.member}
      project: acme-staging
      role: roles/secretmanager.secretAccessor
      secretId: ${secret-PaymentsSecrets-STRIPE_KEY.id}
    options:
      dependsOn:
        - ${secret-PaymentsSecrets-STRIPE_KEY}
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase rollout; owners http:shop-orders-fulfil-orders->shop-api
  shop-orders-fulfil-orders-run-invoker-shop-api:
    name: shop-orders-fulfil-orders.run-invoker.shop-api
    type: gcp:cloudrunv2/serviceIamMember:ServiceIamMember
    properties:
      location: us-east1
      member: ${shop-orders-fulfil-orders-account.member}
      name: ${shop-api-service.name}
      project: acme-staging
      role: roles/run.invoker
    options:
      dependsOn:
        - ${shop-api-service}
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase infrastructure; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-trace-agent:
    name: shop-orders-fulfil-orders.trace-agent
    type: gcp:projects/iAMMember:IAMMember
    properties:
      member: ${shop-orders-fulfil-orders-account.member}
      project: acme-staging
      role: roles/cloudtrace.agent
    options:
      dependsOn:
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase rollout; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-worker-pool:
    name: shop-orders-fulfil-orders.worker-pool
    type: gcp:cloudrunv2/workerPool:WorkerPool
    properties:
      deletionProtection: false
      location: us-east1
      name: shop-orders-fulfil-orders
      project: acme-staging
      scaling:
        manualInstanceCount: 1
        scalingMode: MANUAL
      template:
        containers:
          - envs:
              - name: FULFILLMENT_REGION
                value: us
              - name: MAX_LINE_ITEMS
                value: "50"
              - name: SHOP_API_SERVICE_CREDENTIAL_AUDIENCE
                value: //run.googleapis.com/projects/acme-staging/locations/us-east1/services/shop-api
              - name: SHOP_API_SERVICE_CREDENTIAL_SOURCE
                value: google-id-token
              - name: SHOP_API_SERVICE_URL
                value: ${shop-api-service.uri}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
                value: ${shop-db-database-shop-db.name}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
                value: ${shop-db-instance.connectionName}
              - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
                value: shop-orders-fulfil-orders@acme-staging.iam
              - name: STRIPE_KEY
                valueSource:
                  secretKeyRef:
                    secret: ${secret-PaymentsSecrets-STRIPE_KEY.secretId}
                    version: latest
              - name: WORKER_CONCURRENCY
                value: "4"
            image: us-east1-docker.pkg.dev/acme-staging/shop/shop-orders-fulfil-orders
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
              - mountPath: /cloudsql
                name: cloudsql
        serviceAccount: ${shop-orders-fulfil-orders-account.email}
        volumes:
          - cloudSqlInstance:
              instances:
                - ${shop-db-instance.connectionName}
            name: cloudsql
        vpcAccess:
          egress: ALL_TRAFFIC
          networkInterfaces:
            - network: ${network.name}
              subnetwork: ${network-subnet.name}
    options:
      dependsOn:
        - ${network}
        - ${network-subnet}
        - ${secret-PaymentsSecrets-STRIPE_KEY}
        - ${shop-api-service}
        - ${shop-db-database-shop-db}
        - ${shop-db-instance}
        - ${shop-orders-fulfil-orders-account}
      version: 9.37.1
  # phase infrastructure; owners shop-orders-ship-orders
  shop-orders-ship-orders-account:
    name: shop-orders-ship-orders.account
    type: gcp:serviceaccount/account:Account
    properties:
      accountId: shop-orders-ship-orders
      displayName: Shop Staging job shop-orders-ship-orders
      project: acme-staging
    options:
      version: 9.37.1
  # phase infrastructure; owners sql:shop-orders-ship-orders->shop-db
  shop-orders-ship-orders-cloudsql-client-shop-db:
    name: shop-orders-ship-orders.cloudsql-client.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
      condition:
        expression: resource.type == "sqladmin.googleapis.com/Instance" && resource.name == "projects/acme-staging/instances/shop-db"
        title: Cloud SQL instance shop-db
      member: ${shop-orders-ship-orders-account.member}
      project: acme-staging
      role: roles/cloudsql.client
    options:
      dependsOn:
        - ${shop-orders-ship-orders-account}
      version: 9.37.1
  # phase infrastructure; owners sql:shop-orders-ship-orders->shop-db
  shop-orders-ship-orders-cloudsql-login-shop-db:
    name: shop-orders-ship-orders.cloudsql-login.shop-db
    type: gcp:projects/iAMMember:IAMMember
    properties:
