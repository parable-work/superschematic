# Rendered by superschematic from the resource graph of environment Preview of
# stack shop-stack. Do not edit: change the stack and render it again.

name: shop-stack
runtime: yaml
description: Environment Preview of stack shop-stack
config:
  pr:
    type: string
resources:
  # The stack of environment Staging, which owns the nodes this environment
  # inherits: secret.PaymentsSecrets.STRIPE_KEY, shop-db.instance.
  parent-stack:
    type: pulumi:pulumi:StackReference
    properties:
      name: staging
  # phase infrastructure; owners Orders
  Orders-account:
    name: Orders.account
    type: fake:iam/account:Account
    properties:
      name: orders-${pr}
  # phase rollout; owners http:Orders->shop-api
  Orders-invokes-shop-api:
    name: Orders.invokes.shop-api
    type: fake:iam/grant:Grant
    properties:
      member: ${Orders-account.email}
      resource: ${shop-api-service.id}
      role: run.invoker
    options:
      dependsOn:
        - ${Orders-account}
        - ${shop-api-service}
  # phase infrastructure; owners Orders
  Orders-reads-PaymentsSecrets-STRIPE_KEY:
    name: Orders.reads.PaymentsSecrets.STRIPE_KEY
    type: fake:iam/grant:Grant
    properties:
      member: ${Orders-account.email}
      resource: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      role: secret.accessor
    options:
      dependsOn:
        - ${Orders-account}
        - ${parent-stack}
  # phase rollout; owners Orders
  Orders-service:
    name: Orders.service
    type: fake:run/service:Service
    properties:
      account: ${Orders-account.email}
      env:
        - name: FULFILLMENT_REGION
          value: us
        - name: MAX_LINE_ITEMS
          value: "50"
        - name: SHOP_API_SERVICE_CREDENTIAL_AUDIENCE
          value: shop-api-${pr}
        - name: SHOP_API_SERVICE_CREDENTIAL_SOURCE
          value: google-id-token
        - name: SHOP_API_SERVICE_URL
          value: ${shop-api-service.url}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
          value: ${shop-db-database-shop-db.name}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
          value: ${parent-stack.outputs["shop-db.instance.connectionName"]}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
          value: ${Orders-account.email}
        - name: STRIPE_KEY
          secret: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      image: orders
      language: go
      name: orders-${pr}
      public: false
    options:
      dependsOn:
        - ${Orders-account}
        - ${parent-stack}
        - ${shop-api-service}
        - ${shop-db-database-shop-db}
  # phase infrastructure; owners sql:Orders->shop-db
  Orders-sql-shop-db:
    name: Orders.sql.shop-db
    type: fake:iam/grant:Grant
    properties:
      member: ${Orders-account.email}
      resource: ${parent-stack.outputs["shop-db.instance.id"]}
      role: sql.client
    options:
      dependsOn:
        - ${Orders-account}
        - ${parent-stack}
  # phase exposure; owners dns
  dns-shop-api-1:
    name: dns.shop-api.1
    type: fake:dns/record:Record
    properties:
      name: shop-api-${pr}.staging.acme.dev
      type: CNAME
      value: ${shop-api-route.target}
      zone: acme.dev
    options:
      dependsOn:
        - ${shop-api-route}
  # phase infrastructure; owners shop-api
  shop-api-account:
    name: shop-api.account
    type: fake:iam/account:Account
    properties:
      name: shop-api-${pr}
  # phase infrastructure; owners shop-api
  shop-api-reads-PaymentsSecrets-STRIPE_KEY:
    name: shop-api.reads.PaymentsSecrets.STRIPE_KEY
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-api-account.email}
      resource: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      role: secret.accessor
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-api-account}
  # phase exposure; owners shop-api
  shop-api-route:
    name: shop-api.route
    type: fake:run/route:Route
    properties:
      host: shop-api-${pr}.staging.acme.dev
      service: ${shop-api-service.id}
    options:
      dependsOn:
        - ${shop-api-service}
  # phase rollout; owners shop-api
  shop-api-service:
    name: shop-api.service
    type: fake:run/service:Service
    properties:
      account: ${shop-api-account.email}
      env:
        - name: LOG_LEVEL
          value: info
        - name: PREVIEW_ID
          value: ${pr}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
          value: ${shop-db-database-shop-db.name}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
          value: ${parent-stack.outputs["shop-db.instance.connectionName"]}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
          value: ${shop-api-account.email}
        - name: STRIPE_KEY
          secret: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      image: shop-api
      language: go
      name: shop-api-${pr}
      public: true
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-api-account}
        - ${shop-db-database-shop-db}
  # phase infrastructure; owners sql:shop-api->shop-db
  shop-api-sql-shop-db:
    name: shop-api.sql.shop-db
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-api-account.email}
      resource: ${parent-stack.outputs["shop-db.instance.id"]}
      role: sql.client
    options:
      dependsOn:
        - ${shop-api-account}
        - ${parent-stack}
  # phase infrastructure; owners shop-db
  shop-db-database-shop-db:
    name: shop-db.database.shop-db
    type: fake:sql/database:Database
    properties:
      instance: ${parent-stack.outputs["shop-db.instance.name"]}
      name: shop_db_${pr}
    options:
      dependsOn:
        - ${parent-stack}
  # phase infrastructure; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-account:
    name: shop-orders-fulfil-orders.account
    type: fake:iam/account:Account
    properties:
      name: shop-orders-fulfil-orders-${pr}
  # phase rollout; owners http:shop-orders-fulfil-orders->shop-api
  shop-orders-fulfil-orders-invokes-shop-api:
    name: shop-orders-fulfil-orders.invokes.shop-api
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-orders-fulfil-orders-account.email}
      resource: ${shop-api-service.id}
      role: run.invoker
    options:
      dependsOn:
        - ${shop-api-service}
        - ${shop-orders-fulfil-orders-account}
  # phase rollout; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-pool:
    name: shop-orders-fulfil-orders.pool
    type: fake:run/pool:Pool
    properties:
      account: ${shop-orders-fulfil-orders-account.email}
      concurrency: 8
      env:
        - name: FULFILLMENT_REGION
          value: us
        - name: MAX_LINE_ITEMS
          value: "50"
        - name: SHOP_API_SERVICE_CREDENTIAL_AUDIENCE
          value: shop-api-${pr}
        - name: SHOP_API_SERVICE_CREDENTIAL_SOURCE
          value: google-id-token
        - name: SHOP_API_SERVICE_URL
          value: ${shop-api-service.url}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
          value: ${shop-db-database-shop-db.name}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
          value: ${parent-stack.outputs["shop-db.instance.connectionName"]}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
          value: ${shop-orders-fulfil-orders-account.email}
        - name: STRIPE_KEY
          secret: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      image: shop-orders-fulfil-orders
      instances: 1
      language: go
      name: shop-orders-fulfil-orders-${pr}
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-api-service}
        - ${shop-db-database-shop-db}
        - ${shop-orders-fulfil-orders-account}
  # phase infrastructure; owners shop-orders-fulfil-orders
  shop-orders-fulfil-orders-reads-PaymentsSecrets-STRIPE_KEY:
    name: shop-orders-fulfil-orders.reads.PaymentsSecrets.STRIPE_KEY
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-orders-fulfil-orders-account.email}
      resource: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      role: secret.accessor
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-orders-fulfil-orders-account}
  # phase infrastructure; owners sql:shop-orders-fulfil-orders->shop-db
  shop-orders-fulfil-orders-sql-shop-db:
    name: shop-orders-fulfil-orders.sql.shop-db
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-orders-fulfil-orders-account.email}
      resource: ${parent-stack.outputs["shop-db.instance.id"]}
      role: sql.client
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-orders-fulfil-orders-account}
  # phase infrastructure; owners shop-orders-ship-orders
  shop-orders-ship-orders-account:
    name: shop-orders-ship-orders.account
    type: fake:iam/account:Account
    properties:
      name: shop-orders-ship-orders-${pr}
  # phase rollout; owners http:shop-orders-ship-orders->shop-api
  shop-orders-ship-orders-invokes-shop-api:
    name: shop-orders-ship-orders.invokes.shop-api
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-orders-ship-orders-account.email}
      resource: ${shop-api-service.id}
      role: run.invoker
    options:
      dependsOn:
        - ${shop-api-service}
        - ${shop-orders-ship-orders-account}
  # phase rollout; owners shop-orders-ship-orders
  shop-orders-ship-orders-job:
    name: shop-orders-ship-orders.job
    type: fake:run/job:Job
    properties:
      account: ${shop-orders-ship-orders-account.email}
      env:
        - name: FULFILLMENT_REGION
          value: us
        - name: MAX_LINE_ITEMS
          value: "50"
        - name: SHOP_API_SERVICE_CREDENTIAL_AUDIENCE
          value: shop-api-${pr}
        - name: SHOP_API_SERVICE_CREDENTIAL_SOURCE
          value: google-id-token
        - name: SHOP_API_SERVICE_URL
          value: ${shop-api-service.url}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_DATABASE
          value: ${shop-db-database-shop-db.name}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_INSTANCE
          value: ${parent-stack.outputs["shop-db.instance.connectionName"]}
        - name: SHOP_DB_DATABASE_CLOUD_SQL_USER
          value: ${shop-orders-ship-orders-account.email}
        - name: STRIPE_KEY
          secret: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      image: shop-orders-ship-orders
      language: go
      name: shop-orders-ship-orders-${pr}
      retries: 1
      timeoutSeconds: 300
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-api-service}
        - ${shop-db-database-shop-db}
        - ${shop-orders-ship-orders-account}
  # phase infrastructure; owners shop-orders-ship-orders
  shop-orders-ship-orders-reads-PaymentsSecrets-STRIPE_KEY:
    name: shop-orders-ship-orders.reads.PaymentsSecrets.STRIPE_KEY
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-orders-ship-orders-account.email}
      resource: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
      role: secret.accessor
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-orders-ship-orders-account}
  # phase infrastructure; owners sql:shop-orders-ship-orders->shop-db
  shop-orders-ship-orders-sql-shop-db:
    name: shop-orders-ship-orders.sql.shop-db
    type: fake:iam/grant:Grant
    properties:
      member: ${shop-orders-ship-orders-account.email}
      resource: ${parent-stack.outputs["shop-db.instance.id"]}
      role: sql.client
    options:
      dependsOn:
        - ${parent-stack}
        - ${shop-orders-ship-orders-account}
outputs:
  Orders.account.email: ${Orders-account.email}
  Orders.account.id: ${Orders-account.id}
  Orders.invokes.shop-api.id: ${Orders-invokes-shop-api.id}
  Orders.reads.PaymentsSecrets.STRIPE_KEY.id: ${Orders-reads-PaymentsSecrets-STRIPE_KEY.id}
  Orders.service.id: ${Orders-service.id}
  Orders.service.url: ${Orders-service.url}
  Orders.sql.shop-db.id: ${Orders-sql-shop-db.id}
  dns.shop-api.1.id: ${dns-shop-api-1.id}
  secret.PaymentsSecrets.STRIPE_KEY.id: ${parent-stack.outputs["secret.PaymentsSecrets.STRIPE_KEY.id"]}
  shop-api.account.email: ${shop-api-account.email}
  shop-api.account.id: ${shop-api-account.id}
  shop-api.reads.PaymentsSecrets.STRIPE_KEY.id: ${shop-api-reads-PaymentsSecrets-STRIPE_KEY.id}
  shop-api.route.id: ${shop-api-route.id}
  shop-api.route.target: ${shop-api-route.target}
  shop-api.service.id: ${shop-api-service.id}
  shop-api.service.url: ${shop-api-service.url}
  shop-api.sql.shop-db.id: ${shop-api-sql-shop-db.id}
  shop-db.database.shop-db.id: ${shop-db-database-shop-db.id}
  shop-db.database.shop-db.name: ${shop-db-database-shop-db.name}
  shop-db.instance.connectionName: ${parent-stack.outputs["shop-db.instance.connectionName"]}
  shop-db.instance.id: ${parent-stack.outputs["shop-db.instance.id"]}
  shop-db.instance.name: ${parent-stack.outputs["shop-db.instance.name"]}
  shop-orders-fulfil-orders.account.email: ${shop-orders-fulfil-orders-account.email}
  shop-orders-fulfil-orders.account.id: ${shop-orders-fulfil-orders-account.id}
  shop-orders-fulfil-orders.invokes.shop-api.id: ${shop-orders-fulfil-orders-invokes-shop-api.id}
  shop-orders-fulfil-orders.pool.id: ${shop-orders-fulfil-orders-pool.id}
  shop-orders-fulfil-orders.reads.PaymentsSecrets.STRIPE_KEY.id: ${shop-orders-fulfil-orders-reads-PaymentsSecrets-STRIPE_KEY.id}
  shop-orders-fulfil-orders.sql.shop-db.id: ${shop-orders-fulfil-orders-sql-shop-db.id}
  shop-orders-ship-orders.account.email: ${shop-orders-ship-orders-account.email}
  shop-orders-ship-orders.account.id: ${shop-orders-ship-orders-account.id}
  shop-orders-ship-orders.invokes.shop-api.id: ${shop-orders-ship-orders-invokes-shop-api.id}
  shop-orders-ship-orders.job.id: ${shop-orders-ship-orders-job.id}
  shop-orders-ship-orders.reads.PaymentsSecrets.STRIPE_KEY.id: ${shop-orders-ship-orders-reads-PaymentsSecrets-STRIPE_KEY.id}
  shop-orders-ship-orders.sql.shop-db.id: ${shop-orders-ship-orders-sql-shop-db.id}
