# Code generated by superschematic 1.2.3 from stack ledger-stack. DO NOT EDIT.
#
# The stack's service is schemas/services/ledger-stack. Change it and build
# it again with superschematic build, which writes this file.
#
# On a pull request to main, check builds the stack and compiles its
# servers, jobs, workers and engine runners with no credentials; each plan
# job plans a cloud environment as its planner account, and each preview job
# deploys a member of an environment with one parameter for the pull
# request, and destroys it when the pull request closes. A pull request from
# a fork runs check alone. On a push to main, each deploy job deploys a
# cloud environment in the order the stack declares them, in the GitHub
# environment of its name, whose required reviewers approve it.
#
# The prepare job runs, with no credentials, all the project code the cloud
# jobs need: the build, the installs, the sites' and bundles' builds and the
# sidecar documents (superschematic stack prepare). A cloud job takes what
# it made: it runs no build, no package's script and no sidecar document,
# and its only package manager run, the schemas root's install with
# --ignore-scripts, which the loader reads the types of, is on a Bun or
# Node.js downloaded from its release, never restored from a cache another
# job could write.

name: ledger-stack

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          got="$("$dir/superschematic_1.2.3_linux-x64/superschematic" --version)"
          [ "$got" = "superschematic version 1.2.3" ] || { echo "the release's superschematic reports \"$got\", not superschematic version 1.2.3" && exit 1; }
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: "true"
      - name: Install the schemas root's packages
        working-directory: schemas
        run: bun install --frozen-lockfile
      - name: Build the services
        run: superschematic build-all schemas/services
      - name: Install the TypeScript workspace from schemas/dist/bun.lock
        working-directory: schemas/dist
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error file=schemas/dist/bun.lock::schemas/dist/bun.lock is not committed; build every service, run bun install in schemas/dist and commit schemas/dist/bun.lock" && exit 1
          fi
          bun install --frozen-lockfile || {
            echo "::error file=schemas/dist/bun.lock::schemas/dist/bun.lock does not match the packages the build wrote; build every service, run bun install in schemas/dist and commit schemas/dist/bun.lock" && exit 1
          }
      - name: Type-check server finances-api
        working-directory: schemas/dist/server/ledger-stack/finances-api
        run: bun x --no-install tsc --noEmit -p tsconfig.json
      - name: Type-check job finances-api-sync-all-plaid-items
        working-directory: schemas/dist/server/ledger-stack/finances-api-sync-all-plaid-items
        run: bun x --no-install tsc --noEmit -p tsconfig.json
      - name: Type-check worker finances-api-embed-line-items
        working-directory: schemas/dist/server/ledger-stack/finances-api-embed-line-items
        run: bun x --no-install tsc --noEmit -p tsconfig.json
      - name: Type-check worker finances-api-sync-plaid-item
        working-directory: schemas/dist/server/ledger-stack/finances-api-sync-plaid-item
        run: bun x --no-install tsc --noEmit -p tsconfig.json
      - name: Bundle server finances-api for Workers
        working-directory: schemas/dist/server/ledger-stack/finances-api
        run: bun bundle.ts --check
      - name: Bundle job finances-api-sync-all-plaid-items for Workers
        working-directory: schemas/dist/server/ledger-stack/finances-api-sync-all-plaid-items
        run: bun bundle.ts --check
      - name: Bundle worker finances-api-embed-line-items for Workers
        working-directory: schemas/dist/server/ledger-stack/finances-api-embed-line-items
        run: bun bundle.ts --check
      - name: Bundle worker finances-api-sync-plaid-item for Workers
        working-directory: schemas/dist/server/ledger-stack/finances-api-sync-plaid-item
        run: bun bundle.ts --check

  prepare:
    name: prepare
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          got="$("$dir/superschematic_1.2.3_linux-x64/superschematic" --version)"
          [ "$got" = "superschematic version 1.2.3" ] || { echo "the release's superschematic reports \"$got\", not superschematic version 1.2.3" && exit 1; }
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: "true"
      - name: Install the schemas root's packages
        working-directory: schemas
        run: bun install --frozen-lockfile
      - name: Build the services
        run: superschematic build-all schemas/services
      - name: Install the TypeScript workspace from schemas/dist/bun.lock
        working-directory: schemas/dist
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error file=schemas/dist/bun.lock::schemas/dist/bun.lock is not committed; build every service, run bun install in schemas/dist and commit schemas/dist/bun.lock" && exit 1
          fi
          bun install --frozen-lockfile || {
            echo "::error file=schemas/dist/bun.lock::schemas/dist/bun.lock does not match the packages the build wrote; build every service, run bun install in schemas/dist and commit schemas/dist/bun.lock" && exit 1
          }
      - name: Prepare Staging
        run: superschematic stack prepare Staging --stack schemas/services/ledger-stack --dir "$RUNNER_TEMP/prepared"
      - name: Upload what prepare made
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: "1"

  plan-staging:
    name: plan Staging
    needs: [check, prepare]
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ledger-stack-plan-Staging-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          got="$("$dir/superschematic_1.2.3_linux-x64/superschematic" --version)"
          [ "$got" = "superschematic version 1.2.3" ] || { echo "the release's superschematic reports \"$got\", not superschematic version 1.2.3" && exit 1; }
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: "true"
      - name: Install the schemas root's packages, running none of their scripts
        working-directory: schemas
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.259.0"
      - name: Download what prepare made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared
      - name: Plan Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLANNER_TOKEN_LEDGER_STACK_STAGING }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE_LEDGER_STACK_STAGING }}
        run: superschematic stack plan Staging --stack schemas/services/ledger-stack --prepared "$RUNNER_TEMP/prepared"

  deploy-staging:
    name: deploy Staging
    needs: [check, prepare]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Staging
    concurrency:
      group: ledger-stack-Staging
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install superschematic 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic_1.2.3_linux-x64.tar.gz" "$release/superschematic_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic_1.2.3_linux-x64.tar.gz" -C "$dir"
          got="$("$dir/superschematic_1.2.3_linux-x64/superschematic" --version)"
          [ "$got" = "superschematic version 1.2.3" ] || { echo "the release's superschematic reports \"$got\", not superschematic version 1.2.3" && exit 1; }
          echo "$dir/superschematic_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Install superschematic-migrate 1.2.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/superschematic-migrate"
          mkdir -p "$dir"
          release=https://github.com/parable-work/superschematic/releases/download/v1.2.3
          curl -fsSL -o "$dir/superschematic-migrate_1.2.3_linux-x64.tar.gz" "$release/superschematic-migrate_1.2.3_linux-x64.tar.gz"
          curl -fsSL -o "$dir/SHA256SUMS" "$release/SHA256SUMS"
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$dir/superschematic-migrate_1.2.3_linux-x64.tar.gz" -C "$dir"
          echo "$dir/superschematic-migrate_1.2.3_linux-x64" >> "$GITHUB_PATH"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: "true"
      - name: Install the schemas root's packages, running none of their scripts
        working-directory: schemas
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.259.0"
      - name: Download what prepare made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared
      - name: Deploy Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYER_TOKEN_LEDGER_STACK_STAGING }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE_LEDGER_STACK_STAGING }}
          HYPERDRIVE_ORIGIN_FINANCES_DB: ${{ secrets.HYPERDRIVE_ORIGIN_FINANCES_DB_LEDGER_STACK_STAGING }}
        run: superschematic stack deploy Staging --stack schemas/services/ledger-stack --prepared "$RUNNER_TEMP/prepared"
