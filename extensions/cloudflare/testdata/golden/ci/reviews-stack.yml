      - name: Type-check server reviews
        working-directory: schemas/dist/server/reviews-stack/reviews
        run: bun x --no-install tsc --noEmit -p tsconfig.json
      - name: Bundle server reviews for Workers
        working-directory: schemas/dist/server/reviews-stack/reviews
        run: bun bundle.ts --check

