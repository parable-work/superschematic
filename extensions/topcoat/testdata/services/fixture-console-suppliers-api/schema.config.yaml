# The Topcoat extension's fixture for an API whose type another API's
# reference names (D66), and whose own operation lists it (D61, amended):
# fixture-console-api's tests import its Supplier, and a copy of it that
# lists no supplier itself offers this API's, through its Topcoat crate,
# when one app hosts both. Its server is Rust, with its Topcoat crate.
name: fixture-console-suppliers-api
kind: API
outputs:
  types:
    rust: { enabled: true }
  api: { enabled: true, language: RUST }
  topcoat: { enabled: true }
