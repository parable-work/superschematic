name: fixture-engine-db
kind: DB
scalars:
  Identity.UUID:
    name: Identity.UUID
    languagePrimitive: string
types:
  Author:
    name: Author
    role: DBTable
    fields:
      - name: id
        typeRef: { name: Identity.UUID }
        required: true
        key: true
        autoGenerated: true
      - name: name
        typeRef: { name: string }
        required: true
  Note:
    name: Note
    description: A note, which collects comments.
    role: DBTable
    behaviors:
      - name: Comments
    fields:
      - name: title
        typeRef: { name: string }
        required: true
