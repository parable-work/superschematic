# Naming file for the superschematic core. Every module path, package name,
# crate prefix and in-tree path a generated manifest carries comes from a
# file like this one at the schemas root (<schemas-root>/superschematic.toml,
# or --naming). The values here are the defaults the binary uses when the
# file is absent, written out so a deployment can copy the file and change
# what it needs. A key left out keeps its default.
#
# Coordinates of the generated packages. The service name is appended:
# example.com/schemas/types/go/shop-db, @schemas/shop-db-types,
# schemas_types_shop_db, schemas-shop-db-types.
go_module_root = "example.com/schemas"
npm_scope = "@schemas"
python_types_module_prefix = "schemas_types_"
python_sdk_module_prefix = "schemas_"
python_sdk_module_suffix = "_sdk"
rust_crate_prefix = "schemas-"

# Coordinates of the scalar library the generated code imports.
scalar_go_module = "github.com/parable-work/superscalar/go"
scalar_npm_package = "superscalar"
scalar_pypi_dist = "superscalar"
scalar_python_module = "superscalar"
scalar_rust_crate = "superscalar"

# The Rust expression a generated Rust validator reads the scalar registry
# from, a `&'static Registry` of the scalar crate. Unset by default, which
# reads the crate's builtin registry (<scalar_rust_crate>::Registry::builtin()).
# A scalar crate that adds its own scalars names the function that returns
# its assembled registry:
#
#   scalar_rust_registry = "acme_scalars::registry()"

# Coordinates of this repository's runtime modules.
schema_ir_go_module = "github.com/parable-work/superschematic/ir"
schema_runtime_go_module = "github.com/parable-work/superschematic/runtime/schema/go"
schema_runtime_rust_crate = "superschematic-schema-runtime"
versiongraph_go_module = "github.com/parable-work/superschematic/runtime/versiongraph/go"
versiongraph_rust_crate = "superschematic-versiongraph-engine"
http_runtime_go_module = "github.com/parable-work/superschematic/runtime/http/go"
http_runtime_rust_crate = "superschematic-http-runtime"
http_runtime_npm_package = "@superschematic/http-runtime"
versiongraph_npm_package = "@superschematic/versiongraph"
versiongraph_pypi_dist = "superschematic-versiongraph"
versiongraph_python_module = "superschematic_versiongraph"
engine_npm_package = "@superschematic/engine"
ptr_go_module = "github.com/parable-work/superschematic/runtime/schema/go/ptr"

# Prose the generated readmes and package manifests carry.
schema_language = "Superschematic"
package_author = "superschematic"
meta_schema_url_prefix = "superschematic://"

# Prefix of the metadata keys in the generated projection Arrow schemas
# (<prefix>scalar.canonical_name, <prefix>projection.settings, ...).
metadata_key_prefix = "superschematic."

# Prefix of the permissions the user model's administration routes need
# (<prefix>.users.read, <prefix>.users.write, <prefix>.roles.read and
# <prefix>.roles.write). Dotted segments of letters, digits, _ and -.
identity_permission_prefix = "identity"

# The transaction-local Postgres setting a versioned table's history trigger
# reads a hard delete's actor from; generated hard deletes set it from the
# context user. A custom setting name, so it needs a dot.
history_actor_setting = "superschematic.history_actor_id"

# The JSDoc tag the generated TypeScript types write above every
# scalar-typed field, with the scalar's canonical name. Unset by default,
# which writes no tag line. A distribution whose tools read the tag from
# the declaration files names it:
#
#   scalar_jsdoc_tag = "scalar"    # /** @scalar Contact.Email */

# The auth provider the api generator renders with. The core registers
# "session"; an extension that registers another provider names it here.
auth_provider = "session"

# The TypeScript packages a .schema.ts file may import symbols from. A
# distribution that republishes them under its own names lists those names
# here and maps each to the declaring package in [package_aliases]:
#
#   authoring_packages = ["@acme/api", "@acme/db", "@acme/schema", "@acme/schema-config", "@acme/scalars"]
#   [package_aliases]
#   "@acme/api" = "@superschematic/api"
authoring_packages = [
  "@superschematic/api",
  "@superschematic/db",
  "@superschematic/deploy",
  "@superschematic/schema",
  "@superschematic/schema-config",
  "superscalar",
]

# Where the runtime modules live when generated manifests should point path
# dependencies at a checkout (go.mod replace, Cargo path, npm file:, uv path
# source). Every key is optional and relative to the repository root, the
# parent of the schemas root. An unset key emits no path dependency and the
# generated manifest resolves the published module. These are this
# repository's own paths; a consumer replaces them with the location of its
# checkout or leaves the table out.
[paths]
scalar_go = "third_party/superscalar/go"
scalar_typescript = "third_party/superscalar/bindings/typescript"
scalar_rust = "third_party/superscalar/crates/core"
schema_ir = "ir"
schema_runtime_go = "runtime/schema/go"
schema_runtime_rust = "runtime/schema/rust"
versiongraph_go = "runtime/versiongraph/go"
versiongraph_typescript = "runtime/versiongraph/typescript"
versiongraph_rust = "runtime/versiongraph/rust-engine"
versiongraph_python = "runtime/versiongraph/python"
http_runtime_go = "runtime/http/go"
http_runtime_rust = "runtime/http/rust"
http_runtime_typescript = "runtime/http/typescript"

# How the config fields an API's edges derive in a stack are named: its
# database connection, the endpoint of each API it `calls`, and the
# connection of each bucket it lists in `buckets`. {SERVICE} is the DB,
# called API or Bucket service's name in upper snake case.
[derived_fields]
database = "{SERVICE}_DATABASE"
service = "{SERVICE}_SERVICE"
bucket = "{SERVICE}_BUCKET"

# Where a stack's build and `build --scaffold` write a missing API
# implementation, per language, relative to the repository root, and where a
# server's generated entrypoint imports it from. {service} is the service's
# name.
[implementation_paths]
go = "go/{service}"
