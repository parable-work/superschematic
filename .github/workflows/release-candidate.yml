name: release-candidate

# Twice a day, a release candidate from main's head (D40): release.yml's dry
# run, which runs ci.yml's full tier (the tests pull requests skip), builds
# the CLI on the four os/arch runners and assembles the npm tarballs and
# PyPI dists. It cuts no tag and publishes nothing; a release is still a
# vX.Y.Z tag (CONTRIBUTING.md, "Releases"). Merges to main run no CI, so this
# is main's full run, and because it runs on refs/heads/main it writes the
# main-scoped caches pull requests restore.
#
# A head that already passed a dry run starts nothing, so a quiet weekend
# costs one short job per slot. A red candidate leaves its head without a
# green dry run, so the next slot runs it again.
#
# A run dispatched with the workflow token notifies nobody, so the report
# job opens an issue when a dry run on main goes red, comments on it while
# main stays red, and closes it at the next green one.
#
# By hand: run this workflow (force=true starts a dry run even when the head
# already passed one), or run release.yml with dry_run on main.

on:
  schedule:
    # 06:00 and 18:00 UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Start a release candidate even when main's head already passed a dry run"
        type: boolean
        default: false
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  start:
    name: start a release candidate on main
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-candidate-start
      cancel-in-progress: false
    permissions:
      actions: write # dispatch release.yml
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force == true }}
    steps:
      - name: Dispatch release.yml's dry run on main unless its head already passed one
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow release.yml \
            --branch main --event workflow_dispatch --status success --limit 50 \
            --json headSha --jq "map(select(.headSha == \"${sha}\")) | length")"
          if [ "${passed}" != "0" ] && [ "${FORCE}" != "true" ]; then
            echo "::notice title=Release candidate::main's head ${sha:0:10} already passed a dry run; nothing to start"
            exit 0
          fi
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f dry_run=true
          echo "::notice title=Release candidate::Dispatched release.yml's dry run on main (head ${sha:0:10})"

  report:
    # Every workflow_dispatch run of release.yml is a dry run (preflight
    # refuses any other), so one on main is a release candidate, whoever
    # started it. A cancelled run says nothing about main.
    name: report the candidate's result
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      TITLE: Release candidate failing on main
    steps:
      - name: Open, update or close the release candidate issue
        run: |
          set -euo pipefail
          open="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${TITLE}\" in:title" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ "${CONCLUSION}" = "success" ]; then
            if [ -n "${open}" ]; then
              gh issue close "${open}" --repo "${GITHUB_REPOSITORY}" \
                --comment "Green again at ${SHA:0:10}: ${RUN_URL}"
            fi
            exit 0
          fi
          line="release.yml's dry run on main ended \`${CONCLUSION}\` at ${SHA:0:10}: ${RUN_URL}"
          if [ -n "${open}" ]; then
            gh issue comment "${open}" --repo "${GITHUB_REPOSITORY}" --body "${line}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "$(printf '%s\n' \
              "${line}" \
              "" \
              "The twice-daily release candidate (release-candidate.yml) runs ci.yml's full tier, which pull requests skip, then builds and assembles the release set. Fix main; the next green candidate closes this issue.")"
          fi
