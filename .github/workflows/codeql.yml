name: CodeQL

# CodeQL security analysis of main (D40): on every push to main, weekly, so
# a quiet week still picks up new queries, and on demand. Pull requests are
# not analyzed: the main ruleset requires no code-scanning result, so a scan
# there gates nothing and only adds checks to wait on.
#
# This replaces GitHub's code-scanning default setup, which analyzes every
# pull request and cannot be told not to. Default setup must stay disabled
# (Settings -> Code security -> CodeQL analysis): while it is enabled, the
# SARIF this workflow uploads is rejected. The languages are the ones default
# setup analyzed, and each analysis keeps its category (/language:<name>),
# so existing alerts carry over.

on:
  push:
    branches: [main]
  schedule:
    # Mondays 08:17 UTC.
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
