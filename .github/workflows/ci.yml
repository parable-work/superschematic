name: ci

# Gates for the superschematic repository: DCO sign-off, ten Go modules (the
# compiler, the IR, the schema and http runtimes, the migration runner, the
# gcp target extension, the Cloudflare extension, the Pulumi provisioner
# extension, the Topcoat extension and the installed binary,
# cmd/superschematic: build, vet, test
# with the database tests against a Postgres container and the provisioner's
# against the pulumi CLI,
# gofmt, golangci-lint, scalar catalog, schema-file types and core behavior
# declarations drift, CLI smoke over the fixture corpus with the core alone,
# the migrations example), the acme example extension (smoke plus the
# no-core-edits check), the
# TypeScript authoring packages, schema runtime, http runtime, the engine
# (the Rust engine's Node-API addon, D58) and its suite on the test addon,
# the engine's work-queue
# package and the engine examples, the
# Python schema runtime, the Rust http runtime, the Rust engine's workspace,
# the engine's C ABI and Go binding (its corpus replay, and a link check of
# the three archives a Go server links), the version graph (the core
# crate, its Go binding, the TypeScript package over its wasm build and the
# Python package over its PyO3 build, and the Go, TypeScript, Rust and
# Python engines against Postgres), the Starlight docs build, and the
# extraction scrub.
# `ci-pass` is the single aggregating job the branch ruleset requires; every
# other job must be listed in its `needs`. The docs job on pull requests is a
# recorded deviation from superscalar (D9); superscalar only builds docs in
# release.yml.
#
# Two tiers (D40). A pull request runs the quick tier: the lints, the drift
# checks, `go test -short` (which skips compiling and running generated
# modules), the runtimes' and the version graph's own test suites, and the
# docs build. The full tier adds the Go tests without -short, the CLI smoke,
# examples/migrations, the acme job, examples/engine-notes,
# examples/engine-jobs, the generated servers over the engine
# (engine-servers) and every version-graph scenario through the Go,
# Rust, TypeScript and Python engines. It runs when release.yml calls this
# workflow: before every release, on a dry run, and twice a day as the
# release candidate on main (release-candidate.yml).
# A step or job that belongs to the full tier carries
# `if: github.event_name != 'pull_request'`; under workflow_call,
# github.event_name is the caller's event, never pull_request.
#
# A pull request runs CI only when it targets main and is not a draft.
# Merges to main run nothing here: the release candidate is main's full run.
# On a draft every job skips and ci-pass reports under another name (see
# that job). A stacked pull request runs nothing until it targets main; when
# GitHub retargets it after its parent merges, push or close and reopen it to
# start the run.
#
# superscalar has no release yet, so every job that links it checks the
# pinned commit out under third_party/superscalar and builds the static
# archive from source (scripts/superscalar-dep.sh). The checkout is cached on
# the pin so the Rust build runs once per pin bump per runner OS.

on:
  pull_request:
    branches: [main]
    # ready_for_review is added to the defaults: a draft runs nothing, so the
    # draft -> ready transition has to start the run.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

# Least-privilege GITHUB_TOKEN: this workflow only reads the checkout.
permissions:
  contents: read

# Cancel superseded runs on the same PR branch (head_ref). workflow_call runs
# are keyed by SHA and never cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: dco sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit in the pull request carries Signed-off-by
        # A plain git check rather than a third-party action: the DCO
        # convention is one trailer line per commit, and this keeps the
        # sign-off gate free of an unpinned dependency.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            # grep reads to EOF (no -q) so pipefail never sees a SIGPIPE from git log.
            if ! git log -1 --format=%B "$sha" | grep -E '^Signed-off-by: .+ <[^>]+@[^>]+>$' >/dev/null; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign your commits: git commit -s (or git rebase --signoff). See CONTRIBUTING.md." >&2
            exit 1
          fi

  scrub:
    name: scrub (no source-tree leftovers)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/scrub-check.sh
      - name: Version sites agree with versions.env
        # release-pr.yml refuses to bump a tree whose sites disagree; catch
        # drift (a hand-edited package.json) on the pull request instead.
        run: python3 scripts/bump_version.py check
      - name: bump_version.py and npm_local_specs.py tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  go:
    name: go (build / vet / test / gofmt / lint / catalog / cli smoke)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        # Emit only real KEY=VALUE pins; $GITHUB_ENV rejects '#' comments/blanks.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        # The superscalar TypeScript binding is built alongside the Go
        # archive; the loader tests resolve fixture imports against it.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # Builds the superscalar ffi archive from source, with this toolchain
        # rather than the one the checkout's rust-toolchain.toml pins, as the
        # version-graph archive is (tools.env says why). The wasm32 target
        # builds the version-graph TypeScript package and superscalar's
        # browser and workerd builds, and
        # rustsdkgen compile tests run cargo clippy on the generated SDK
        # crates, so this toolchain carries clippy; the projectengine tests
        # hold the engine crates they write to rustfmt's layout, so it
        # carries rustfmt too.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Build the version-graph archive
        # A generated ORM whose schema declares a version graph links the
        # core's Go binding, and the ormgen tests build and run such modules
        # against the archive this stages under runtime/versiongraph/go/lib.
        run: scripts/versiongraph-archive.sh

      - name: Build the version-graph TypeScript package
        # A generated TypeScript types package whose schema declares a
        # version graph depends on it, and tsgen's tests type-check that
        # facade and run it against Postgres over its dist/.
        working-directory: runtime/versiongraph/typescript
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Cache the engine's Rust build
        # The full tier's engine addon, below.
        if: github.event_name != 'pull_request'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust

      - name: Build the engine package and its addon
        # TestEngineDocumentLoadsInTheEngine (the full tier: -short skips it)
        # loads a generated engine document through @superschematic/engine,
        # the Rust engine's Node-API addon (D58), as a TypeScript server
        # does: the package's dist/, over the http runtime's, and the core's
        # addon in its native/, a debug build, which compiles faster than the
        # release's and loads the same.
        if: github.event_name != 'pull_request'
        run: |
          (cd runtime/http/typescript && bun install --frozen-lockfile && bun run build)
          (cd runtime/engine/typescript && bun install --frozen-lockfile && bun run build)
          scripts/engine-napi.sh --debug

      - name: Install the authoring packages
        # TestEmbeddedDefinitionIsCurrent regenerates the schema-config JSON
        # Schema with packages/schema-config's own tooling. Without this
        # install it cannot run, and under SUPERSCHEMATIC_REQUIRE_TS_CHECKS=1
        # that fails the job.
        working-directory: packages
        run: bun install --frozen-lockfile

      - name: Setup Python
        # The Go tests that import the generated Python packages (pygen's
        # import, enum and arrays-of-arrays checks, the Python SDK probe)
        # need pydantic and skip without it.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pydantic
        # The version runtime/schema/python/uv.lock resolves, so these tests
        # and the Python runtime suite import the same one.
        run: |
          version="$(grep -A1 '^name = "pydantic"$' runtime/schema/python/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          test -n "$version"
          python -m pip install "pydantic==$version"

      - name: Install uv
        # pygen's TestVersionGraphFacadeOnPostgres runs the generated Python
        # facade in runtime/versiongraph/python's uv environment, which uv
        # builds with maturin.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Start Postgres
        # The ORM and SQL tests that read SUPERSCHEMATIC_ORMGEN_TEST_DATABASE_URL
        # and SUPERSCHEMATIC_SQLGEN_TEST_DATABASE_URL skip without a database.
        # A container started here rather than a service container, whose
        # image cannot read the version from tools.env.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          # Over TCP: the image's first-start server listens only on its
          # socket and restarts once initialised.
          ready=""
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker logs superschematic-pg
            exit 1
          fi
          # The tests share this database, each in its own schema, and run
          # in parallel. Two that apply a create.sql at once race on its
          # CREATE EXTENSION IF NOT EXISTS (a unique violation on
          # pg_extension_name_index), and one that drops its schema would
          # drop an extension created there with it. Created once in public,
          # which every test's search_path ends with, the generated
          # statements are no-ops.
          docker exec superschematic-pg psql --host 127.0.0.1 --username postgres --set ON_ERROR_STOP=1 \
            --command "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public" \
            --command "CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA public" \
            --command "CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public"

      - name: Install the runtime's pinned workerd
        # The cloudflare extension runs the script of a site's Worker, and
        # servergen a job's bundled scheduled.ts, under the workerd the
        # HTTP runtime's harness pins (D64).
        working-directory: runtime/http/typescript/test/workerd
        run: bun install --frozen-lockfile

      - name: Install the pulumi CLI
        # extensions/pulumi drives it, and its integration test runs it
        # against a file:// backend with the random provider, which needs no
        # cloud credentials. The action only installs the CLI here.
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Build, vet, test every module
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          # The TypeScript gates skip when bun, or an install they need, is
          # missing so local `go test ./...` runs without them. Here both are
          # set up, so a skip is a broken gate and must fail
          # (testpaths.RequireOrSkipTS).
          SUPERSCHEMATIC_REQUIRE_TS_CHECKS: "1"
          # The pulumi CLI is installed above, so the provisioner's
          # integration test must run, not skip.
          SUPERSCHEMATIC_REQUIRE_PULUMI: "1"
          # The database tests run against the container above; each creates
          # and drops its own schema, database or role.
          SUPERSCHEMATIC_ORMGEN_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          SUPERSCHEMATIC_SQLGEN_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # tsgen's TestVersionGraphFacadeOnPostgres runs the generated
          # TypeScript facade against it, rustgen's version-graph facade test
          # builds the generated crate and runs it on it, and pygen's runs the
          # generated Python package on it.
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The migration runner's tests apply plans to databases they
          # create on it; its SQLite tests need no service.
          SUPERSCHEMATIC_MIGRATE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The identity runtime's store and handler tests run on it in a
          # schema of their own, as well as on SQLite.
          SUPERSCHEMATIC_IDENTITY_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The rustgen, rustsdkgen, rustrestgen and parity tests run cargo on
          # the crates they generate. Each uses CARGO_TARGET_DIR when set, so
          # one target directory compiles axum, tokio, reqwest and superscalar
          # once for all of them, where a directory per test compiled them
          # again for each and outran go test's ten-minute limit per package.
          CARGO_TARGET_DIR: ${{ runner.temp }}/generated-crates-target
          # The quick tier: -short skips the tests that compile and run
          # generated Go, TypeScript, Rust and Python modules.
          GO_TEST_SHORT: ${{ github.event_name == 'pull_request' }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print) $(scripts/versiongraph-archive.sh --print)"
          for m in . ir runtime/schema/go runtime/http/go runtime/migrate/go extensions/gcp extensions/cloudflare extensions/pulumi extensions/topcoat cmd/superschematic; do
            echo "==> $m"
            # Packages that run cargo queue on its lock of the shared target
            # directory, and the wait counts against each package's timeout.
            (cd "$m" && go build ./... && go vet ./... && go test -count=1 -timeout 30m -short="$GO_TEST_SHORT" ./...)
          done

      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then echo "gofmt: files need formatting:"; echo "$out"; exit 1; fi

      - name: Scalar catalog drift (TypeScript + Python catalogs match the pinned superscalar)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go run ./internal/tools/scalarcatalog -check

      - name: Schema-file types drift (ir/typescript JSON Schema + TypeScript types match the IR)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go run ./internal/tools/schemafiletypes -check

      - name: Cache the pulumi-gcp, pulumi-cloudflare and pulumi-tls files the extensions and the core pin
        # pulumi-gcp's schema.json is about 90 MB; the tool reads each file
        # from the user cache and checks its digest against the pin either
        # way.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/superschematic/providerschemas
          key: providerschemas-${{ hashFiles('extensions/gcp/schemas/pulumi-gcp.json', 'extensions/cloudflare/schemas/pulumi-cloudflare.json', 'internal/stack/generic/schemas/pulumi-tls.json') }}

      - name: Pinned gcp provider schemas drift (extensions/gcp/schemas match the pinned pulumi-gcp release)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        working-directory: extensions/gcp
        run: go run ./internal/tools/providerschemas -check

      - name: Pinned cloudflare provider schemas drift (extensions/cloudflare/schemas match the pinned pulumi-cloudflare release)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        working-directory: extensions/cloudflare
        run: go run ./internal/tools/providerschemas -check

      - name: Pinned tls provider schema drift (the generic connector's internal/stack/generic/schemas match the pinned pulumi-tls release)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: go run ./internal/tools/providerschemas -check

      - name: Core behavior declarations drift (the engine's and the work queue's Rust crates' copies match the core registry)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          make behaviors-check

      - name: CLI smoke (the core with no extension builds DB, API and General fixtures)
        if: github.event_name != 'pull_request'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          make cli-smoke

      # The docs site's schema migrations page quotes examples/migrations.
      # This plans its DB service from v1 to v2 for Postgres and SQLite with
      # the core alone, gates the plans on their hazards, applies them with
      # superschematic-migrate to a SQLite file and to a database of its own
      # on the Postgres above, and fails when an output the page quotes
      # (examples/migrations/testdata/generated/) is stale.
      - name: examples/migrations (plan, gate and apply a migration on SQLite and Postgres)
        if: github.event_name != 'pull_request'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          SUPERSCHEMATIC_MIGRATE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: examples/migrations/scripts/check.sh

      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: .

      - name: golangci-lint (ir)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ir
          install-mode: none

      - name: golangci-lint (runtime/schema/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/schema/go
          install-mode: none

      - name: golangci-lint (runtime/http/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/http/go
          install-mode: none

      - name: golangci-lint (runtime/migrate/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/migrate/go
          install-mode: none

      - name: golangci-lint (extensions/gcp)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/gcp
          install-mode: none

      - name: golangci-lint (extensions/cloudflare)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/cloudflare
          install-mode: none

      - name: golangci-lint (extensions/pulumi)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/pulumi
          install-mode: none

      - name: golangci-lint (extensions/topcoat)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/topcoat
          install-mode: none

      - name: golangci-lint (cmd/superschematic)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: cmd/superschematic
          install-mode: none

  acme:
    name: acme (example extension builds without core edits)
    # The full tier: every step builds the example end to end.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        # Emit only real KEY=VALUE pins; $GITHUB_ENV rejects '#' comments/blanks.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            examples/acme-schematic/go.sum
            examples/acme-shop/go/go.sum

      - name: Setup Bun
        # The superscalar TypeScript binding is built alongside the Go
        # archive; the TypeScript frontend resolves schema imports against it.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # examples/acme-shop's Python client and type tests import the generated
      # Python packages from the schema runtime's uv environment.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # rustfmt and clippy check acme's Rust crate and the engine crate
        # the binary writes for it (D58), whose addon the smoke builds and
        # loads in Node.js. The wasm32 target builds superscalar's browser
        # and workerd builds (D64).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Python schema runtime environment
        working-directory: runtime/schema/python
        run: uv sync

      - name: Build the version-graph archive
        # shop-db declares a version graph, so its generated ORM, and the API
        # that imports it, link the core's Go binding against this archive.
        run: scripts/versiongraph-archive.sh

      - name: Start Postgres
        # The smoke's Rust step runs acme-behaviors' tests on SQLite, and on
        # this Postgres too through SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL,
        # each case in a schema of its own (D58). It has a port of its own,
        # apart from the databases the acme-shop check's stack starts.
        run: |
          docker run --detach --name acme-engine-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 55433:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          for _ in $(seq 1 60); do
            if docker exec acme-engine-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs acme-engine-pg
          exit 1

      - name: Smoke (module tests, build-all, every surface, generated API compiles, core rejects Catalog)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:55433/postgres?sslmode=disable
        run: examples/acme-schematic/scripts/smoke.sh

      # The extension-model acceptance criterion: a second decorator added to
      # the extension touches nothing outside examples/acme-schematic/ and
      # still passes the smoke.
      - name: Second decorator touches only the example
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: examples/acme-schematic/scripts/check_second_decorator.sh

      # The Rust client, the Rust server and the Topcoat app check.sh builds
      # against the example's generated crates.
      - name: Cache the acme-shop Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            examples/acme-shop/rust
            examples/acme-shop/rust-server
            examples/acme-shop/topcoat

      # The docs site's start-here, first-project and guide pages quote
      # examples/acme-shop. This builds it with the installed binary, since
      # its storefront-stack names the cloudflare target, compiles and
      # tests the Go, TypeScript, Python and Rust code the pages show, runs
      # every SDK's client against shop-orders served in Go and in Rust,
      # tests the Topcoat app over shop-orders (built with the binary that
      # links extensions/topcoat), and
      # fails when a generated file or command output a page quotes
      # (examples/acme-shop/testdata/generated/) is stale.
      - name: acme-shop (the docs example builds and passes its tests in four languages)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: examples/acme-shop/scripts/check.sh

  typescript:
    # The engine's suite and the work queue's run on the Rust engine (D58)
    # through the test addon (scripts/engine-napi.sh --js-behaviors), whose
    # bridge runs the behaviors the tests write in TypeScript, under Node.js
    # and Bun. A test that loops over test/helpers.ts's backends runs on
    # Postgres too, through openEngineAsync (ENGINE_TEST_PG_URL), as a
    # TypeScript server opens the engine there. The addon as it ships is
    # built first and checked to lack the bridge.
    name: typescript (authoring packages + schema and http runtimes + engine and its work-queue package)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        # scripts/superscalar-dep.sh reads go env for the archive directory.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # Builds the engine's Node-API addon, the Rust engine (D58). The
        # wasm32 target builds superscalar's browser and workerd builds
        # (D64).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache the engine's Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Start Postgres
        # The backends' Postgres pass of the engine's suite, each engine in
        # a schema of its own. A role with a password: the runner's Postgres
        # refuses a passwordless one off its loopback.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: packages/ typecheck + test
        working-directory: packages
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: runtime/schema/typescript typecheck + build + test
        working-directory: runtime/schema/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test

      - name: runtime/http/typescript typecheck + build + test
        working-directory: runtime/http/typescript
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

      - name: Build the engine's Node-API addon, as it ships and the test addon
        # The addon as it ships first, which must not have the bridge to
        # behaviors written in TypeScript, then the test addon, which the
        # suites run on: their tests define behaviors with defineBehavior.
        working-directory: runtime/engine/typescript
        run: |
          bun install --frozen-lockfile
          ../../../scripts/engine-napi.sh
          node -e "const a = require('./native/' + require('node:fs').readdirSync('native').find((f) => f.endsWith('.node'))); if (typeof a.bridgeCall !== 'undefined') { console.error('the shipped addon has the test bridge'); process.exit(1); }"
          ../../../scripts/engine-napi.sh --js-behaviors

      - name: runtime/engine/typescript typecheck + build + test (Node.js and Bun, SQLite and Postgres)
        # Runs after the http runtime's build, whose dist/ the engine's
        # scripts/link-local-deps.mjs copies into node_modules, and on the
        # test addon. Its corpus check records the curated files again and
        # holds runtime/engine/testdata to them.
        working-directory: runtime/engine/typescript
        env:
          ENGINE_TEST_PG_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          bun run typecheck
          bun run build
          bun run test

      - name: runtime/engine-workqueue/typescript typecheck + build + test (Node.js and Bun)
        # Runs after the engine's build, which its scripts/link-local-deps.mjs
        # links into node_modules, on the test addon, whose work-queue
        # behaviors are the Rust ones.
        working-directory: runtime/engine-workqueue/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: examples/engine-notes type-check + end to end (Node.js and Bun)
        # The engine guide's example: the http runtime and the engine rebuilt
        # from the installs above, on the addon built above, linked into the
        # example, and its test run
        # against a listening server under each runtime. A step of this job
        # rather than a job of its own: it needs only what this job installs,
        # and takes seconds. End to end, so the full tier.
        if: github.event_name != 'pull_request'
        run: examples/engine-notes/scripts/check.sh

      - name: examples/engine-jobs type-check + end to end (Node.js and Bun)
        # The work-queue guide's example: the engine and the work-queue
        # package rebuilt from the installs above, linked into the example,
        # and its test run against a listening server under each runtime.
        # End to end, so the full tier, as engine-notes is.
        if: github.event_name != 'pull_request'
        run: examples/engine-jobs/scripts/check.sh

  python:
