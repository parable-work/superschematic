  acme:
    name: acme (example extension builds without core edits)
    # The full tier: every step builds the example end to end. acme-shop's
    # check takes about half an hour of it, and up to fifteen minutes more
    # when its stack's Rust servers compile with nothing cached.
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        # Emit only real KEY=VALUE pins; $GITHUB_ENV rejects '#' comments/blanks.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            examples/acme-schematic/go.sum
            examples/acme-shop/go/go.sum

      - name: Setup Bun
        # The superscalar TypeScript binding is built alongside the Go
        # archive; the TypeScript frontend resolves schema imports against it.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # examples/acme-shop's Python client and type tests import the generated
      # Python packages from the schema runtime's uv environment.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # The superscalar dependency, the version-graph archive and
        # acme-shop's Rust client, server and Topcoat app build with it. The
        # wasm32 target builds superscalar's browser and workerd builds
        # (D64).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Python schema runtime environment
        working-directory: runtime/schema/python
        run: uv sync

      - name: Build the version-graph archive
        # shop-db declares a version graph, so its generated ORM, and the API
        # that imports it, link the core's Go binding against this archive.
        run: scripts/versiongraph-archive.sh

      - name: Smoke (module tests, build-all, every surface, generated API compiles, core rejects Catalog)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: examples/acme-schematic/scripts/smoke.sh

      # The extension-model acceptance criterion: a second decorator added to
      # the extension touches nothing outside examples/acme-schematic/ and
      # still passes the smoke.
      - name: Second decorator touches only the example
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: examples/acme-schematic/scripts/check_second_decorator.sh

      # The Rust client, the Rust server and the Topcoat app check.sh builds
      # against the example's generated crates.
      - name: Cache the acme-shop Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            examples/acme-shop/rust
            examples/acme-shop/rust-server
            examples/acme-shop/topcoat

      # The docs site's start-here, first-project and guide pages quote
      # examples/acme-shop. This builds it with the installed binary, since
      # its storefront-stack names the cloudflare target, compiles and
      # tests the Go, TypeScript, Python and Rust code the pages show, runs
      # every SDK's client against shop-orders served in Go and in Rust,
      # tests the Topcoat app over shop-orders (built with the binary that
      # links extensions/topcoat), and
      # fails when a generated file or command output a page quotes
      # (examples/acme-shop/testdata/generated/) is stale.
      - name: acme-shop (the docs example builds and passes its tests in four languages)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: examples/acme-shop/scripts/check.sh

  typescript:
    # The engine's suite and the work queue's run on the Rust engine (D58)
    # through the test addon (scripts/engine-napi.sh --js-behaviors), whose
    # bridge runs the behaviors the tests write in TypeScript, under Node.js
    # and Bun. A test that loops over test/helpers.ts's backends runs on
    # Postgres too, through openEngineAsync (ENGINE_TEST_PG_URL), as a
    # TypeScript server opens the engine there. The addon as it ships is
    # built first and checked to lack the bridge.
    #
    # Two parts, a job each: runtimes has the authoring packages, the
    # schema, rules, rules-handler and http runtimes, and the engine
    # examples on development mode; engine the addon, the engine and the
    # packages over it. The engine's package links the http runtime's built
    # copy, so engine builds that first, without its tests. Both set up the
    # same tools and services.
    name: typescript (${{ matrix.part }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [runtimes, engine]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        # scripts/superscalar-dep.sh reads go env for the archive directory.
        # Nothing here compiles Go, so there is no build cache to keep (the
        # go job's Setup Go says why an empty one must not be saved).
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # Builds the engine's Node-API addon, the Rust engine (D58). The
        # wasm32 target builds superscalar's browser and workerd builds
        # (D64), and the behaviors' core the rules package ships (D103).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache the engine's Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust
          # Outside a pull request alone (engine-rust says why), from the
          # part that builds the addon.
          save-if: ${{ github.event_name != 'pull_request' && matrix.part == 'engine' }}

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Start Postgres
        # The backends' Postgres pass of the engine's suite, each engine in
        # a schema of its own. A role with a password: the runner's Postgres
        # refuses a passwordless one off its loopback.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Start Valkey
        # The memory store tests that read SUPERSCHEMATIC_TEST_MEMORY_STORE
        # (D75) run against it, in database 1, and skip without it.
        run: |
          docker run --detach --name superschematic-valkey \
            --publish 6379:6379 \
            "valkey/valkey:${VALKEY_VERSION}-alpine"
          for _ in $(seq 1 30); do
            if docker exec superschematic-valkey valkey-cli ping >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-valkey
          exit 1

      - name: packages/ typecheck + test
        if: matrix.part == 'runtimes'
        working-directory: packages
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: runtime/schema/typescript typecheck + build + test
        if: matrix.part == 'runtimes'
        working-directory: runtime/schema/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test

      - name: runtime/rules/typescript typecheck + build + test (wasm32 build, Bun and Node.js)
        if: matrix.part == 'runtimes'
        # The behaviors' core built for wasm32 (D103), which the http
        # runtime's adapter tests below load from its dist/.
        working-directory: runtime/rules/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: runtime/rules-handler/typescript typecheck + build + test (wasm32 build, Bun and Node.js)
        if: matrix.part == 'runtimes'
        # Development mode's handler built for wasm32 (D117): every rules
        # transcript and rules-dev's store session replayed over bun:sqlite,
        # the routes and the event stream, and SQLite files read across this
        # host and superschematic-dev, which the tests build.
        working-directory: runtime/rules-handler/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: runtime/http/typescript typecheck + build + test
        if: matrix.part == 'runtimes'
        working-directory: runtime/http/typescript
        env:
          # src/redis.test.ts's tests against a real server, on the Valkey
          # above.
          SUPERSCHEMATIC_TEST_MEMORY_STORE: redis://127.0.0.1:6379/1
          # The behaviors' adapter tests (src/rules*.test.ts, D103) on the
          # Postgres above too, each in a schema of its own, deadlines,
          # change queues and event queues, the read across a table and a
          # command without a row among them, and every transcript of the
          # core replayed there as on bun:sqlite.
          SUPERSCHEMATIC_RULES_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

      - name: Build the http runtime (the engine's package links its built copy)
        if: matrix.part == 'engine'
        working-directory: runtime/http/typescript
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the engine's Node-API addon, as it ships and the test addon
        if: matrix.part == 'engine'
        # The addon as it ships first, which must not have the bridge to
        # behaviors written in TypeScript, then the test addon, which the
        # suites run on: their tests define behaviors with defineBehavior.
        working-directory: runtime/engine/typescript
        run: |
          bun install --frozen-lockfile
          ../../../scripts/engine-napi.sh
          node -e "const a = require('./native/' + require('node:fs').readdirSync('native').find((f) => f.endsWith('.node'))); if (typeof a.bridgeCall !== 'undefined') { console.error('the shipped addon has the test bridge'); process.exit(1); }"
          ../../../scripts/engine-napi.sh --js-behaviors

      - name: runtime/engine/typescript typecheck + build + test (Node.js and Bun, SQLite and Postgres)
        if: matrix.part == 'engine'
        # Runs after the http runtime's build, whose dist/ the engine's
        # scripts/link-local-deps.mjs copies into node_modules, and on the
        # test addon. Its corpus check records the curated files again and
        # holds runtime/engine/testdata to them.
        working-directory: runtime/engine/typescript
        env:
          ENGINE_TEST_PG_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          bun run typecheck
          bun run build
          bun run test

      - name: runtime/engine-workqueue/typescript typecheck + build + test (Node.js and Bun)
        if: matrix.part == 'engine'
        # Runs after the engine's build, which its scripts/link-local-deps.mjs
        # links into node_modules, on the test addon, whose work-queue
        # behaviors are the Rust ones.
        working-directory: runtime/engine-workqueue/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: runtime/engine-commerce/typescript typecheck + build + test (Node.js and Bun)
        if: matrix.part == 'engine'
        # Runs after the engine's build, which its scripts/link-local-deps.mjs
        # links into node_modules, on the test addon, whose commerce
        # behaviors are the Rust ones (D70). Its corpus check holds
        # runtime/engine/testdata/scenarios/commerce-*.json to the recorder.
        working-directory: runtime/engine-commerce/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: examples/engine-notes type-check + end to end (Node.js and Bun)
        # The guide's notes server on development mode (D117): the http
        # runtime and the rules handler rebuilt from the installs above,
        # linked into the example, its test run against a listening server
        # under each runtime, and superschematic-dev's smoke over the file
        # it wrote. A step of the runtimes part rather than a job of its
        # own: it needs only what that part installs, and takes seconds.
        # End to end, so the full tier.
        if: inputs.tier == 'full' && matrix.part == 'runtimes'
        run: examples/engine-notes/scripts/check.sh

      - name: examples/engine-jobs type-check + end to end (Node.js and Bun)
        # The work-queue guide's job runner on development mode (D117): the
        # rules handler rebuilt from the installs above, linked into the
        # example, and its test run through the handler's routes under each
        # runtime. End to end, so the full tier, as engine-notes is.
        if: inputs.tier == 'full' && matrix.part == 'runtimes'
        run: examples/engine-jobs/scripts/check.sh

  python:
    name: python (schema runtime)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        # scripts/superscalar-dep.sh reads go env for the archive directory.
        # Nothing here compiles Go, so there is no build cache to keep (the
        # go job's Setup Go says why an empty one must not be saved).
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # The superscalar Python package is built from the checkout by
        # maturin when uv syncs the runtime's dependencies, and so is the
        # version-graph core's binding. The wasm32 target builds
        # superscalar's WebAssembly core for its browser and workerd builds.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: pytest (also on Python 3.9, the floor its pyproject.toml declares)
        working-directory: runtime/schema/python
        run: |
          uv run pytest -q
          uv run --python 3.9 --isolated pytest -q

      - name: Version-graph package (fmt / clippy / the binding's unit tests / every vector and the engine's tests that need no database, also on Python 3.9)
        working-directory: runtime/versiongraph/python
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          uv run pytest -q
          uv run --python 3.9 --isolated pytest -q

  rust:
    # Two parts, a job each. The http runtime is linted and tested on
    # every feature combination a server builds it with, thirty-odd cargo
    # runs that each build the crate again, ten minutes of them in one job
    # and under one of tests. http runs the runtime alone and with its
    # client, identity, postgres and logging; stores the combinations with
    # a bucket, a memory store, trace export and sqlite, and the three
    # small crates. Each keeps a Rust cache of its own, since each builds
    # the dependencies with features the other does not.
    name: rust (${{ matrix.part }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [http, stores]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runtime/http/rust
            runtime/schema/rust
            runtime/schema/rust-ir
            runtime/migrate/rust
          key: ${{ matrix.part }}
          # Outside a pull request alone (engine-rust says why).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Restore the superscalar checkout
        # Restored and never saved from here: this job checks the sources
        # out and builds nothing of superscalar, and the jobs that build
        # all of it (go, typescript, python) save under the same key. A
        # checkout saved first had each of those build superscalar again on
        # every run until the pin moved.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Check out the superscalar sources
        # The engine's schema reader (runtime/schema/rust-ir) depends on
        # superscalar's core by path ([paths] scalar_rust). Nothing of
        # superscalar is built here but that crate.
        run: scripts/superscalar-dep.sh --checkout

      - name: Start Valkey
        # The memory store tests that read SUPERSCHEMATIC_TEST_MEMORY_STORE
        # (D75) run against it, in database 1, and skip without it.
        run: |
          docker run --detach --name superschematic-valkey \
            --publish 6379:6379 \
            "valkey/valkey:${VALKEY_VERSION}-alpine"
          for _ in $(seq 1 30); do
            if docker exec superschematic-valkey valkey-cli ping >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-valkey
          exit 1

      # superscalar's default lossless-json feature turns on serde_json's
      # arbitrary_precision and preserve_order, and Cargo unifies them into
      # every crate of a build that uses it, so both runtimes' lints and
      # tests run with and without them. The http runtime's run again with
      # its optional http-client feature, with its identity features, whose
      # store and route tests run on SQLite here, and with a stack server's
      # features (D57): postgres, whose tests need a database and skip
      # here, logging, and the two at once, as a worker runs, whose loop's
      # log lines a test reads (D65); gcs, a bucket on GCS (D54), whose
      # tests run against fakes, the fake-gcs-server run skipping here, and
      # beside a worker's two, as a worker with a bucket builds;
      # memorystore-redis, a memory store on Redis (D75), whose tests run
      # on the Valkey above, alone and beside a worker's two; and otel, a
      # deployable's trace export, alone and with postgres, as a worker
      # builds it, whose message spans a test reads (D67).
      - name: fmt / clippy / test (the http runtime alone, and with its client, identity, postgres and logging)
        if: matrix.part == 'http'
        working-directory: runtime/http/rust
        env:
          SUPERSCHEMATIC_TEST_MEMORY_STORE: redis://127.0.0.1:6379/1
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features serde_json/arbitrary_precision,serde_json/preserve_order -- -D warnings
          cargo test
          cargo test --features serde_json/arbitrary_precision,serde_json/preserve_order
          cargo clippy --all-targets --features http-client -- -D warnings
          cargo test --features http-client
          cargo clippy --all-targets --features identity -- -D warnings
          cargo clippy --all-targets --features identity-postgres,identity-sqlite -- -D warnings
          cargo test --features identity-postgres,identity-sqlite
          cargo clippy --all-targets --features postgres -- -D warnings
          cargo clippy --all-targets --features postgres,identity-postgres,identity-sqlite -- -D warnings
          cargo test --features postgres,identity-postgres,identity-sqlite
          cargo clippy --all-targets --features logging -- -D warnings
          cargo test --features logging
          cargo clippy --all-targets --features postgres,logging -- -D warnings
          cargo test --features postgres,logging

      - name: clippy / test (the http runtime with a bucket, a memory store, trace export and sqlite)
        if: matrix.part == 'stores'
        working-directory: runtime/http/rust
        env:
          SUPERSCHEMATIC_TEST_MEMORY_STORE: redis://127.0.0.1:6379/1
        run: |
          cargo clippy --all-targets --features gcs -- -D warnings
          cargo test --features gcs
          cargo clippy --all-targets --features gcs,postgres,logging -- -D warnings
          cargo clippy --all-targets --features memorystore-redis -- -D warnings
          cargo test --features memorystore-redis
          cargo clippy --all-targets --features memorystore-redis,postgres,logging -- -D warnings
          cargo clippy --all-targets --features otel -- -D warnings
          cargo test --features otel
          cargo clippy --all-targets --features postgres,otel -- -D warnings
          cargo test --features postgres,otel
          cargo clippy --all-targets --features sqlite -- -D warnings
          cargo test --features sqlite
          cargo clippy --all-targets --features postgres,sqlite,logging -- -D warnings
          cargo test --features postgres,sqlite,logging
          cargo clippy --all-targets --features sqlite,logging,otel -- -D warnings

      # The runner an embedded environment's binary carries (D116). Its
      # parity tests with the Go runner's binary run under `make rust`,
      # where Go is set up; here they return early.
      - name: migration runner fmt / clippy / test
        if: matrix.part == 'stores'
        working-directory: runtime/migrate/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: schema runtime fmt / clippy / test
        if: matrix.part == 'stores'
        working-directory: runtime/schema/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo test --features serde_json/arbitrary_precision,serde_json/preserve_order

      # The engine's schema reader links superscalar's core, which keeps
      # preserve_order on; it runs with its schemafile feature and without,
      # and again with arbitrary_precision.
      - name: engine schema reader fmt / clippy / test (every vector of both corpora)
        if: matrix.part == 'stores'
        working-directory: runtime/schema/rust-ir
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --all-targets --all-features --features serde_json/arbitrary_precision -- -D warnings
          cargo test
          cargo test --all-features
          cargo test --all-features --features serde_json/arbitrary_precision

  engine-rust:
    # The workspace has the work queue's crate (runtime/engine-workqueue/rust)
    # and the commerce crate (runtime/engine-commerce/rust) as members, so
    # --workspace builds, lints and tests them too, and the behaviors'
    # core's crates (D103): the core, its behaviors, its reference host, its
    # wasm binding and the Rust adapter (rules-adapter).
    #
    # The tests run in shards, a job each: scripts/engine_rust_shards.py
    # says what a shard runs, and why. The rest shard also builds the two
    # binaries rules-runtime's tests run, whose tests are its own, and
    # saves the Rust cache, since it builds the most. fmt and clippy are
    # engine-rust-lint's.
    name: engine-rust (${{ matrix.shard }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [replay, transcript, core, behaviors, rest]
    # As one job this took 26 to 29 minutes on most runs, and a slow runner
    # took it past a thirty-minute limit in its last doc-tests, with no
    # test failing. A shard is well inside the limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies
        # Saved outside a pull request alone, here and in every job: on
        # main those are a merge's run and the release candidate's, whose
        # caches every pull request reads. A pull request whose lock file
        # is not main's starts from main's cache and builds what moved;
        # when each saved a copy of its own instead, some hundreds of
        # megabytes a job, a few of them pushed main's caches out of the
        # ten gigabytes the repository may keep, and every run after that
        # started from nothing.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust
          save-if: ${{ github.event_name != 'pull_request' && matrix.shard == 'rest' }}

      - name: Restore the superscalar checkout
        # Restored and never saved from here (the rust job says why).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Check out the superscalar sources
        # The engine reads schemas through runtime/schema/rust-ir, which
        # depends on superscalar's core by path ([paths] scalar_rust).
        # Nothing of superscalar is built here but that crate.
        run: scripts/superscalar-dep.sh --checkout

      - name: Start Postgres
        # The engine's and the storage's tests run on SQLite, and on this
        # Postgres too through SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL, each
        # test in a schema of its own; without the variable they skip the
        # Postgres pass. The image ships contrib's unaccent, which Search's
        # full-text index uses and the engine creates as the superuser.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore the Go build cache
        # The go job's, which its rest shard saves (that job's Setup Go
        # says why); this job only reads it, for the two binaries below.
        if: matrix.shard == 'rest'
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'ir/go.sum', 'runtime/schema/go/go.sum', 'runtime/http/go/go.sum', 'runtime/migrate/go/go.sum', 'extensions/gcp/go.sum', 'extensions/cloudflare/go.sum', 'extensions/embedded/go.sum', 'extensions/resolvers/go.sum', 'extensions/pulumi/go.sum', 'extensions/topcoat/go.sum', 'cmd/superschematic/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-

      # Runtime mode's scenarios (rules-runtime, D117) run the two binaries
      # a runtime environment carries: the compiler's planner, here the
      # core with no extension, over superscalar's static archive, and the
      # Go migration runner, which needs no cgo. Without them the scenarios
      # say so and pass.
      - name: Build the planner and the migration runner runtime mode's scenarios run
        if: matrix.shard == 'rest'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          scripts/superscalar-dep.sh --archive >/dev/null
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go build -o "$GITHUB_WORKSPACE/bin/superschematic-core" ./internal/cmd/superschematic-core
          (cd runtime/migrate/go && CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/bin/superschematic-migrate" ./cmd/superschematic-migrate)

      # The test kit's replay of the scenario corpus
      # (runtime/engine/testdata/scenarios) runs here too, on both
      # databases, and of the HTTP corpus through the engine's routes and
      # its axum router; it fails when the corpus is missing. Each replays
      # its files on threads of their own, one per core. The tests of two
      # engines on one database (testkit/tests/replicas_*.rs) run here too;
      # their soaks, `make engine-rust-soak`, do not. The behaviors' Rust
      # adapter runs its store tests and replays the core's transcripts
      # (runtime/engine/testdata/rules) on rusqlite and on this Postgres
      # through SUPERSCHEMATIC_RULES_TEST_DATABASE_URL, in schemas of its own;
      # the test kit replays the hand-written core-pool.json whole, and
      # workqueue-lease.json's expireHolder steps among its 637 (D104).
      # Runtime mode publishes through the binaries the step above built,
      # in process and through a job, and holds its lists in SQL to
      # development mode's answers.
      - name: test (this shard, on SQLite and Postgres)
        env:
          SHARD: ${{ matrix.shard }}
          SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          SUPERSCHEMATIC_RULES_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          SUPERSCHEMATIC_BIN: ${{ github.workspace }}/bin/superschematic-core
          SUPERSCHEMATIC_MIGRATE_BIN: ${{ github.workspace }}/bin/superschematic-migrate
        run: python3 scripts/engine_rust_shards.py run "$SHARD"

      # Schedules' calendar as a project's Cargo graph may build it, jiff's
      # tzdb-zoneinfo turned on by feature unification: a zone is still the
      # bundled database's, never the host's zone files (TZDIR), so every
      # host computes the same runs (D104).
      - name: test (the calendar with jiff's host zone files on)
        if: matrix.shard == 'rest'
        working-directory: runtime/engine/rust
        run: cargo test -p superschematic-rules-behaviors --features jiff/tzdb-zoneinfo --test calendar_zones

  engine-rust-lint:
    # The engine workspace's format and lints, apart from its tests
    # (engine-rust): clippy checks the workspace six times over, which a
    # test shard need not wait for, and its builds are not the tests', so
    # this job keeps a Rust cache of its own. It needs the superscalar
    # sources (the engine reads schemas through runtime/schema/rust-ir)
    # and no database.
    name: engine-rust-lint (fmt / clippy on every feature combination)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies
        # Saved outside a pull request alone (engine-rust says why).
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Restore the superscalar checkout
        # Never saved from here: this job checks the sources out alone.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Check out the superscalar sources
        run: scripts/superscalar-dep.sh --checkout

      # The same lints as `make engine-rust`, inline: the Makefile runs
      # the superscalar and version-graph scripts when it is parsed. Clippy
      # runs on every feature combination (each database alone, both, and
      # neither, and the axum router over one database, as a Rust server
      # takes it), so a build that takes one database still compiles, with
      # the test addon's bridge (all features) and without it (the
      # defaults, as an addon ships).
      - name: fmt / clippy (every feature combination)
        working-directory: runtime/engine/rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features superschematic-engine/sqlite -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features superschematic-engine/postgres -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features superschematic-engine/postgres,superschematic-engine/axum,superschematic-engine-testkit/axum -- -D warnings

  engine-go:
    name: engine-go (the engine's C ABI, Go binding, corpus replay and link check)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        # The four archives a Go server links are built with this one
        # toolchain (tools.env says why).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            runtime/engine/go/go.sum
            runtime/rules/go/go.sum
            runtime/engine/testdata/linkcheck/go.sum

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runtime/engine/rust
            runtime/versiongraph/rust
          # Outside a pull request alone (engine-rust says why).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Restore the superscalar checkout
        # Restored and never saved from here (the rust job says why).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Start Postgres
        # The corpus replay runs on SQLite, and on this Postgres too through
        # SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL, each engine in a schema
        # of its own.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Link check (one binary over superscalar's, the version graph's, the engine's and the rules' archives)
        # Builds the four archives, checks each defines its own C
        # functions alone (the version graph's vg_* is off in the engine's
        # build), then builds runtime/engine/testdata/linkcheck, which
        # imports all four bindings, and runs it.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
        run: scripts/engine-link-check.sh

      - name: Go binding (build / vet / test over the core's archive)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
        run: |
          CGO_LDFLAGS="$(scripts/engine-archive.sh --print)"
          export CGO_LDFLAGS
          cd runtime/engine/go
          go build ./... && go vet ./... && go test -count=1 ./...

      - name: Corpus replay through enginehttp and Engine.Do (the test kit's archive, on SQLite and Postgres)
        # The HTTP corpus, and the engine's own scenario files through the
        # binding's calls, need the test kit's behaviors and the recorded
        # policies, which the test kit's archive holds; ENGINE_REPLAY_ARCHIVE
        # makes the replay fail rather than skip without it.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          ENGINE_REPLAY_ARCHIVE: "1"
          SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          replay="$RUNNER_TEMP/engine-replay"
          scripts/engine-archive.sh --crate runtime/engine/rust/testkit-ffi --out "$replay" >/dev/null
          export CGO_LDFLAGS="-L$replay"
          cd runtime/engine/go
          go test -count=1 -run Replay -v ./enginehttp/

      - name: golangci-lint (runtime/engine/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/engine/go

  rules-go:
    name: rules-go (the behaviors' core's archive, Go binding, adapter and transcript replay)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        # The archive is built with the toolchain every archive a Go binary
        # links is built with (tools.env says why).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: runtime/rules/go/go.sum

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust
          # Outside a pull request alone (engine-rust says why).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Restore the superscalar checkout
        # The archive's crate is a member of the engine's workspace, which
        # cargo loads whole, and the engine reaches superscalar's core by
        # path; scripts/rules-archive.sh checks it out when it is missing.
        # Restored and never saved from here (the rust job says why).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Start Postgres
        # The adapter's tests, the stores' and the transcript replay run on
        # SQLite, and on this Postgres too through
        # SUPERSCHEMATIC_RULES_TEST_DATABASE_URL, each in a schema of its
        # own; without the variable they skip the Postgres pass.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Build the rules archive
        # superschematic-rules-wasm's staticlib (D103), staged under
        # runtime/rules/go/lib, where the binding links it through cgo.
        run: scripts/rules-archive.sh

      - name: Binding, adapter and stores (build / vet / test -race on SQLite and Postgres, the transcripts replayed on both)
        # The binding's tests call the core from many goroutines at once,
        # under the race detector; the replays fail on any mismatch and
        # below their floors, 96 steps for core-workflow, 139 for
        # core-timers, 586 for core-reactions, 60 for
        # core-reactions-changes, 39 for core-constants, 76 for
        # core-staterules, 122 for core-approvals, 449 for core-lease
        # (expireHolder's commands without a row among them), 141 for
        # core-presence, 495 for core-budget, 250 for core-retries, and 92,
        # 115, 158, 77, 88, 58, 161 and 82 for the hand-written
        # core-workflow-principals, core-freezes-and-sign-offs,
        # core-retries-waits, core-periods-and-presence, core-seats,
        # core-reconcile, core-schedules and core-pool (D104), whose events
        # each replay reads back from the event queues after every command,
        # and core-pool's picks commands without a row.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          SUPERSCHEMATIC_RULES_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          export CGO_LDFLAGS="$(scripts/rules-archive.sh --print)"
          cd runtime/rules/go
          go build ./... && go vet ./... && go test -race -count=1 ./...

      - name: golangci-lint (runtime/rules/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/rules/go

  versiongraph:
    name: versiongraph (core crate / Go binding / Rust engine / TypeScript package / Python engine)
    # The scenarios through each language's engine are the full tier; a pull
    # request runs the lints and each package's own tests.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: runtime/versiongraph/go/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: fmt / clippy (native, without the C ABI, and wasm32) / test, and test with serde_json's preserve_order
        # superscalar turns preserve_order on, and Cargo unifies it into every
        # crate of a build that uses it; the content hash must not change.
        # Without the ffi feature is how the engine's archive links the core
        # (D58): the vg_* symbols stay in the version graph's own archive.
        working-directory: runtime/versiongraph/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
          cargo test
          cargo test --no-default-features
          cargo test --features serde_json/preserve_order

      - name: Start Postgres
        # Package canonical checks its vectors' Postgres renderings against
        # it, and the scenarios and the Postgres adapter's tests run on it;
        # each skips without SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Go binding, engine, Postgres adapter and SQLite adapter (build / vet / test over the static archive)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          export CGO_LDFLAGS="$(scripts/versiongraph-archive.sh)"
          cd runtime/versiongraph/go
          go build ./... && go vet ./... && go test -count=1 ./...

      - name: Scenarios (every scenario through the Go engine on SQLite, with the SQLite adapter's tests, then on the Postgres adapter)
        # The SQLite pass needs no database; the Postgres pass fails, rather
        # than skips, without one.
        if: inputs.tier == 'full'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: make versiongraph-scenarios

      - name: Rust engine (fmt / clippy)
        working-directory: runtime/versiongraph/rust-engine
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --no-default-features -- -D warnings
          cargo clippy --no-default-features --features rusqlite -- -D warnings

      - name: Rust engine (its own tests, the SQLite adapter's and the SQLite vectors, and every scenario on SQLite, also inside a host's transaction)
        # The quick tier: no database URL, so the Postgres tests skip; the
        # full tier's step below runs them, and every scenario on Postgres.
        working-directory: runtime/versiongraph/rust-engine
        run: cargo test --features rusqlite

      - name: Rust engine and its Postgres and SQLite adapters (every scenario on SQLite and on Postgres, the fixed layout's on Postgres inside a host's transaction too, and every canonical vector through the Rust engine, also with serde_json's preserve_order)
        # The SQLite pass of make versiongraph-scenarios-rust needs no
        # database; its Postgres pass fails, rather than skips, without one.
        # The second run turns serde_json's preserve_order on, as superscalar
        # does, so the canonical rules' key sort is checked.
        if: inputs.tier == 'full'
        env:
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          make versiongraph-scenarios-rust
          (cd runtime/versiongraph/rust-engine && cargo test --tests --features rusqlite,serde_json/preserve_order)

      - name: golangci-lint (runtime/versiongraph/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/versiongraph/go

      - name: Setup Node.js
        # The package's test imports the built package under Node too.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: TypeScript package (wasm32 build, typecheck, every vector through the package, every scenario on SQLite, Node load)
        # The only place CI runs the vectors through the wasm build; the
        # typescript job leaves this package to this job.
        working-directory: runtime/versiongraph/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Scenarios through the TypeScript engine (every scenario on SQLite, then on Postgres with the canonical vectors against Postgres, the adapter, the sweeper and the facade)
        # The SQLite pass needs no database; the Postgres pass fails, rather
        # than skips, without one.
        if: inputs.tier == 'full'
        env:
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: make versiongraph-scenarios-ts

      - name: Setup Python
        if: inputs.tier == 'full'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: inputs.tier == 'full'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Scenarios through the Python engine (every scenario on SQLite, then on Postgres with the canonical vectors against Postgres, the adapter, the sweeper and the facade)
        # uv builds the package's PyO3 extension with maturin. The SQLite
        # pass needs no database; the Postgres pass fails, rather than
        # skips, without one.
        if: inputs.tier == 'full'
        env:
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: make versiongraph-scenarios-python

  docs:
    # Cheap PR gate: npm ci + astro build. superscalar only builds docs in
    # release.yml; this job is D9. It does not deploy.
    name: docs (Starlight build)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          npm run build

  ci-pass:
    # The only required status check on main (repository ruleset "main").
    # Runs even when a needed job fails so the check is always reported, and
    # fails if any needed job failed or was cancelled. A skipped job (dco
    # outside a pull request, acme on one) does not fail it.
    #
    # On a draft every other job skips, and GitHub reports a skipped required
    # check as passing. So a draft's run reports under another name: the
    # required ci-pass stays "expected" on the draft's head until
    # ready_for_review starts the real run, and a draft's empty run can never
    # stand in for a green one.
    name: ${{ github.event.pull_request.draft == true && 'ci-pass (draft -- CI skipped)' || 'ci-pass' }}
    if: always()
    needs:
      - dco
      - scrub
      - go
      - go-lint
      - acme
      - typescript
      - python
      - rust
      - engine-rust
      - engine-rust-lint
      - engine-go
      - rules-go
      - versiongraph
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say why a draft ran nothing
        if: github.event.pull_request.draft == true
        run: echo "::notice title=Draft::A draft pull request runs no CI. Mark it ready for review to start the run that reports ci-pass."

      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {name: job["result"] for name, job in needs.items()
                 if job["result"] in ("failure", "cancelled")}
          for name, result in sorted(bad.items()):
              print(f"{name}: {result}")
          if bad:
              sys.exit(1)
          print("all gates passed")
          PY
