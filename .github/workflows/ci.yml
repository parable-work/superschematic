name: ci

# Gates for the superschematic repository: DCO sign-off, ten Go modules (the
# compiler, the IR, the schema and http runtimes, the migration runner, the
# gcp target extension, the Cloudflare extension, the Pulumi provisioner
# extension, the Topcoat extension and the installed binary,
# cmd/superschematic: build, vet, test
# with the database tests against a Postgres container and the provisioner's
# against the pulumi CLI,
# gofmt, golangci-lint, scalar catalog, schema-file types and core behavior
# declarations drift, CLI smoke over the fixture corpus with the core alone,
# the migrations example), the acme example extension (smoke plus the
# no-core-edits check), the
# TypeScript authoring packages, schema runtime, http runtime, the engine
# (the Rust engine's Node-API addon, D58) and its suite on the test addon,
# the engine's work-queue
# package and the engine examples, the
# Python schema runtime, the Rust http runtime, the Rust engine's workspace
# (with the behaviors' core's crates and the Rust adapter, D103), the
# engine's C ABI and Go binding (its corpus replay, and a link check of the
# four archives a Go server links), the behaviors' core's Go binding and
# adapter (its transcript replay on SQLite and Postgres), the version graph
# (the core crate, its Go binding, the TypeScript package over its wasm
# build and the
# Python package over its PyO3 build, and the Go, TypeScript, Rust and
# Python engines against Postgres), the Starlight docs build, and the
# extraction scrub.
# `ci-pass` is the single aggregating job the branch ruleset requires; every
# other job must be listed in its `needs`. The docs job on pull requests is a
# recorded deviation from superscalar (D9); superscalar only builds docs in
# release.yml.
#
# Two tiers (D40). A pull request runs the quick tier: the lints, the drift
# checks, `go test -short` (which skips compiling and running generated
# modules), the runtimes' and the version graph's own test suites, and the
# docs build. The full tier adds the Go tests without -short, the CLI smoke,
# examples/migrations, the acme job, examples/engine-notes,
# examples/engine-jobs and every version-graph scenario through the Go,
# Rust, TypeScript and Python engines. It runs when release.yml calls this
# workflow: before every release, on a dry run, and twice a day as the
# release candidate on main (release-candidate.yml).
# A step or job that belongs to the full tier carries
# `if: inputs.tier == 'full'`. The input is the call's alone, and full
# unless the caller says otherwise, so a run an event starts has none and
# is the quick tier. The event cannot say which tier a run is: under
# workflow_call github.event_name is the caller's event, and a release's
# is push, as a merge to main's is.
#
# A pull request runs CI only when it targets main and is not a draft.
# A merge to main runs the quick tier once more, on main itself. A run's
# caches belong to its branch, and a pull request reads main's: this run
# saves them, the Rust builds, the Go build cache and the superscalar
# checkout among them, so that a pull request opened after a lock file, a
# go.sum or a pin moved, or after the repository's ten gigabytes pushed a
# cache out, starts from one. Without it they came back with the release
# candidate, twice a day, and every run until then built from nothing. A
# cache whose key is on main already is not saved again. The release
# candidate is still main's full run.
# On a draft every job skips and ci-pass reports under another name (see
# that job). A stacked pull request runs nothing until it targets main; when
# GitHub retargets it after its parent merges, push or close and reopen it to
# start the run.
#
# gofmt, golangci-lint and the drift checks run in a job of their own,
# go-lint, so they report in minutes and not behind the go job's tests.
#
# The two longest jobs run in shards, a job each: go's five
# (scripts/go-test-shard.sh) and engine-rust's five
# (scripts/engine_rust_shards.py). Each script says what its shards run and
# gives what no shard names to the last, rest, so the shards together run
# what the one job ran; scripts/test_engine_rust_shards.py holds the
# matrices below to the scripts' shards. rust and typescript run in two
# parts each, their steps divided between them in this file, and the
# engine workspace's lints in engine-rust-lint.
#
# A pull request reads the caches main's runs saved, a merge's and the
# release candidate's, and saves none of the large ones (the Rust builds,
# the Go build cache):
# the repository may keep ten gigabytes, and a copy a pull request pushed
# main's own out.
#
# Every Postgres a job starts runs with fsync, synchronous_commit and
# full_page_writes off. The container goes with the runner, so nothing in it
# has to survive a crash, and the tests, which create and drop a schema or a
# database each, do not wait on the disk.
#
# superscalar has no release yet, so every job that links it checks the
# pinned commit out under third_party/superscalar and builds the static
# archive from source (scripts/superscalar-dep.sh). The checkout is cached on
# the pin so the Rust build runs once per pin bump per runner OS.

on:
  pull_request:
    branches: [main]
    # ready_for_review is added to the defaults: a draft runs nothing, so the
    # draft -> ready transition has to start the run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:
    inputs:
      tier:
        description: "full runs every step and job; anything else the quick tier a pull request runs"
        type: string
        default: full

# Least-privilege GITHUB_TOKEN: this workflow only reads the checkout.
permissions:
  contents: read

# Cancel superseded runs on the same PR branch (head_ref). A merge's run and
# a call's are keyed by SHA and never cancelled, each under a name of its
# own, so a release candidate of a commit does not wait for that commit's
# run on main.
concurrency:
  group: ci-${{ github.head_ref || format('{0}-{1}', inputs.tier || 'main', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: dco sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit in the pull request carries Signed-off-by
        # A plain git check rather than a third-party action: the DCO
        # convention is one trailer line per commit, and this keeps the
        # sign-off gate free of an unpinned dependency.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            # grep reads to EOF (no -q) so pipefail never sees a SIGPIPE from git log.
            if ! git log -1 --format=%B "$sha" | grep -E '^Signed-off-by: .+ <[^>]+@[^>]+>$' >/dev/null; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign your commits: git commit -s (or git rebase --signoff). See CONTRIBUTING.md." >&2
            exit 1
          fi

  scrub:
    name: scrub (no source-tree leftovers)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/scrub-check.sh
      - name: Version sites agree with versions.env
        # release-pr.yml refuses to bump a tree whose sites disagree; catch
        # drift (a hand-edited package.json) on the pull request instead.
        run: python3 scripts/bump_version.py check
      - name: The scripts' tests (bump_version.py, npm_local_specs.py, prebuilt_deps.py, engine_rust_shards.py)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  go:
    # The eleven modules' build, vet and tests in shards, a job each:
    # scripts/go-test-shard.sh says what a shard runs, and why. Every shard
    # sets up the same tools and databases, so a test finds what it found
    # when one job ran them all.
    name: go (${{ matrix.shard }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [sqlmigrate, loader, generators, modules, rest]
    # As one job the quick tier took about fifty minutes. The full tier
    # compiles and runs every generated module, and its packages queue on
    # one Cargo target directory, so it needed longer than an hour: at
    # sixty minutes the release candidate was cancelled in the root
    # module's tests. The whole job took two hours and a quarter there, the
    # root module's tests a hundred minutes of it. The limits are that
    # job's, and a shard is well inside them.
    timeout-minutes: ${{ inputs.tier != 'full' && 60 || 200 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        # Emit only real KEY=VALUE pins; $GITHUB_ENV rejects '#' comments/blanks.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        # The build cache is the next step's, not setup-go's. setup-go keys
        # its cache on go.sum alone, never saves over a key that exists, and
        # saves from every pull request that misses. Jobs that shared its
        # default key left an empty cache under it, which every run then
        # restored; a key to each job had every pull request save more than
        # a gigabyte of its own, against the ten the repository may keep.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore the Go build cache
        # One cache for the jobs that compile the root module and the
        # modules over it: this job's shards, go-lint and engine-rust. The
        # rest shard saves it, since it builds every module, and only
        # outside a pull request: on main those are a merge's run and the
        # release candidate's, whose caches every pull request reads. A
        # go.sum that moved starts from the cache before it.
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'ir/go.sum', 'runtime/schema/go/go.sum', 'runtime/http/go/go.sum', 'runtime/migrate/go/go.sum', 'extensions/gcp/go.sum', 'extensions/cloudflare/go.sum', 'extensions/embedded/go.sum', 'extensions/resolvers/go.sum', 'extensions/pulumi/go.sum', 'extensions/topcoat/go.sum', 'cmd/superschematic/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Setup Bun
        # The superscalar TypeScript binding is built alongside the Go
        # archive; the loader tests resolve fixture imports against it.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # Builds the superscalar ffi archive from source, with this toolchain
        # rather than the one the checkout's rust-toolchain.toml pins, as the
        # version-graph archive is (tools.env says why). The wasm32 target
        # builds the version-graph and rules TypeScript packages and
        # superscalar's browser and workerd builds, and
        # rustsdkgen compile tests run cargo clippy on the generated SDK
        # crates, so this toolchain carries clippy; the Rust server and
        # behaviors tests (rustrestgen, the Rust jobs and workers on SQLite)
        # hold the files they write to rustfmt's layout, so it carries
        # rustfmt too.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Build the version-graph archive
        # A generated ORM whose schema declares a version graph links the
        # core's Go binding, and the ormgen tests build and run such modules
        # against the archive this stages under runtime/versiongraph/go/lib.
        run: scripts/versiongraph-archive.sh

      - name: Build the rules archive
        # A generated ORM whose tables' fields are behaviors runs them
        # through the behaviors' core's Go module (runtime/rules/go, D103),
        # and ormgen's TestWorkflowTablesOnPostgres builds and runs such a
        # module, on the Postgres below, against the archive this stages
        # under runtime/rules/go/lib.
        run: scripts/rules-archive.sh

      - name: Build the version-graph TypeScript package
        # A generated TypeScript types package whose schema declares a
        # version graph depends on it, and tsgen's tests type-check that
        # facade and run it against Postgres over its dist/.
        working-directory: runtime/versiongraph/typescript
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the rules TypeScript package
        # A generated TypeScript types package whose tables' fields are
        # behaviors depends on it (D103): tsgen's tests type-check its
        # orm.ts and run the generated repositories over its dist/, the
        # behaviors' core built for wasm32, on bun:sqlite and Postgres.
        working-directory: runtime/rules/typescript
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install the authoring packages
        # TestEmbeddedDefinitionIsCurrent regenerates the schema-config JSON
        # Schema with packages/schema-config's own tooling. Without this
        # install it cannot run, and under SUPERSCHEMATIC_REQUIRE_TS_CHECKS=1
        # that fails the job.
        working-directory: packages
        run: bun install --frozen-lockfile

      - name: Setup Python
        # The Go tests that import the generated Python packages (pygen's
        # import, enum and arrays-of-arrays checks, the Python SDK probe)
        # need pydantic and skip without it.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pydantic
        # The version runtime/schema/python/uv.lock resolves, so these tests
        # and the Python runtime suite import the same one.
        run: |
          version="$(grep -A1 '^name = "pydantic"$' runtime/schema/python/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          test -n "$version"
          python -m pip install "pydantic==$version"

      - name: Install uv
        # pygen's TestVersionGraphFacadeOnPostgres runs the generated Python
        # facade in runtime/versiongraph/python's uv environment, which uv
        # builds with maturin.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Start Postgres
        # The ORM and SQL tests that read SUPERSCHEMATIC_ORMGEN_TEST_DATABASE_URL
        # and SUPERSCHEMATIC_SQLGEN_TEST_DATABASE_URL skip without a database.
        # A container started here rather than a service container, whose
        # image cannot read the version from tools.env.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          # Over TCP: the image's first-start server listens only on its
          # socket and restarts once initialised.
          ready=""
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker logs superschematic-pg
            exit 1
          fi
          # The tests share this database, each in its own schema, and run
          # in parallel. Two that apply a create.sql at once race on its
          # CREATE EXTENSION IF NOT EXISTS (a unique violation on
          # pg_extension_name_index), and one that drops its schema would
          # drop an extension created there with it. Created once in public,
          # which every test's search_path ends with, the generated
          # statements are no-ops.
          docker exec superschematic-pg psql --host 127.0.0.1 --username postgres --set ON_ERROR_STOP=1 \
            --command "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public" \
            --command "CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA public" \
            --command "CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public"

      - name: Start Postgres with pgvector
        # The tests of vector columns (D84) run on a second Postgres, the
        # pgvector image of the same major version, which they read from
        # SUPERSCHEMATIC_VECTOR_TEST_DATABASE_URL. The other database tests
        # keep the alpine image above: the version-graph vectors hold
        # date-times to its tzdata, which the pgvector image's Debian
        # tzdata reads differently for 1890 Amsterdam.
        run: |
          docker run --detach --name superschematic-pgvector \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5433:5432 \
            "pgvector/pgvector:${PGVECTOR_VERSION}-pg${POSTGRES_VERSION}" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          ready=""
          for _ in $(seq 1 60); do
            if docker exec superschematic-pgvector pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker logs superschematic-pgvector
            exit 1
          fi
          docker exec superschematic-pgvector psql --host 127.0.0.1 --username postgres --set ON_ERROR_STOP=1 \
            --command "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public" \
            --command "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public"

      - name: Install the runtime's pinned workerd
        # The cloudflare extension runs the script of a site's Worker, and
        # servergen a job's bundled scheduled.ts, under the workerd the
        # HTTP runtime's harness pins (D64).
        working-directory: runtime/http/typescript/test/workerd
        run: bun install --frozen-lockfile

      - name: Install the pulumi CLI
        # extensions/pulumi drives it, and its integration test runs it
        # against a file:// backend with the random provider, which needs no
        # cloud credentials. The action only installs the CLI here.
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Build, vet, test (this shard's part of every module)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          # The TypeScript gates skip when bun, or an install they need, is
          # missing so local `go test ./...` runs without them. Here both are
          # set up, so a skip is a broken gate and must fail
          # (testpaths.RequireOrSkipTS).
          SUPERSCHEMATIC_REQUIRE_TS_CHECKS: "1"
          # The pulumi CLI is installed above, so the provisioner's
          # integration test must run, not skip.
          SUPERSCHEMATIC_REQUIRE_PULUMI: "1"
          # The database tests run against the container above; each creates
          # and drops its own schema, database or role.
          SUPERSCHEMATIC_ORMGEN_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          SUPERSCHEMATIC_SQLGEN_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # tsgen's TestVersionGraphFacadeOnPostgres runs the generated
          # TypeScript facade against it, rustgen's version-graph facade test
          # builds the generated crate and runs it on it, and pygen's runs the
          # generated Python package on it.
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The migration runner's tests apply plans to databases they
          # create on it; its SQLite tests need no service.
          SUPERSCHEMATIC_MIGRATE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The identity runtime's store and handler tests run on it in a
          # schema of their own, as well as on SQLite.
          SUPERSCHEMATIC_IDENTITY_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The generated Go, TypeScript and Rust servers' behavior
          # operations (D103) run on it, each in a schema of its own, through
          # their SDKs, and their behavior workers' deadline and change
          # queues in process (the Workflow end-to-end tests, D104's who
          # may move a row among them, the Timers and Reactions ones, raw
          # SQL writes heard among them, the Constants, StateRules and
          # Approvals ones, D104's step 2, the Lease, Retries, Presence and
          # Budget ones, its second batch, a lease's fencing token presented
          # as a precondition among them, the Seats ones, its step 3, a
          # row's seats named in by and a field that follows observations
          # among them, the Schedules ones, its step 3's second part, a
          # wake-up's run event handed to the project's Workers method from
          # the worker's event queue among them, and the Pool ones, the rest
          # of its step 3, a pick of the table as a whole with no row,
          # Budget's Capacity and a recheck the project's handler answers
          # among them, and Lease's expireHolder in the Agents ones): the Go
          # one over the rules archive staged above, the TypeScript one over
          # the rules package built above, and the Rust one over the engine
          # workspace's rules-adapter crate.
          SUPERSCHEMATIC_RULES_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # The tests of vector columns run on the pgvector container
          # (D84); the database is there, so a skip is a broken gate.
          SUPERSCHEMATIC_VECTOR_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5433/postgres?sslmode=disable
          SUPERSCHEMATIC_REQUIRE_VECTOR_TESTS: "1"
          # The rustgen, rustsdkgen, rustrestgen and parity tests run cargo on
          # the crates they generate. Each uses CARGO_TARGET_DIR when set, so
          # one target directory compiles axum, tokio, reqwest and superscalar
          # once for all of them, where a directory per test compiled them
          # again for each and outran go test's ten-minute limit per package.
          CARGO_TARGET_DIR: ${{ runner.temp }}/generated-crates-target
          # The quick tier: -short skips the tests that compile and run
          # generated Go, TypeScript, Rust and Python modules.
          GO_TEST_SHORT: ${{ inputs.tier != 'full' }}
          # A package's limit. Packages that run cargo queue on its lock of
          # the shared target directory, and the wait counts against each
          # package's limit: in the full tier cli and internal/generator
          # each waited out thirty minutes with no test of theirs running
          # for more than half a minute. With the wait, the longest there,
          # internal/generator/servergen, takes about an hour, and cli,
          # internal/generator and internal/sqlmigrate thirty-two to
          # thirty-eight minutes each.
          GO_TEST_TIMEOUT: ${{ inputs.tier != 'full' && '30m' || '90m' }}
          SHARD: ${{ matrix.shard }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print) $(scripts/versiongraph-archive.sh --print) $(scripts/rules-archive.sh --print)"
          scripts/go-test-shard.sh "$SHARD"

      - name: Save the Go build cache
        # After a failed test too: what was built is as good a start.
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.shard == 'rest' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: CLI smoke (the core with no extension builds DB, API and General fixtures)
        if: inputs.tier == 'full' && matrix.shard == 'rest'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          make cli-smoke

      # The docs site's schema migrations page quotes examples/migrations.
      # This plans its DB service from v1 to v2 for Postgres and SQLite with
      # the core alone, gates the plans on their hazards, applies them with
      # superschematic-migrate to a SQLite file and to a database of its own
      # on the Postgres above, and fails when an output the page quotes
      # (examples/migrations/testdata/generated/) is stale.
      - name: examples/migrations (plan, gate and apply a migration on SQLite and Postgres)
        if: inputs.tier == 'full' && matrix.shard == 'rest'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          SUPERSCHEMATIC_MIGRATE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: examples/migrations/scripts/check.sh

  go-lint:
    # The lints and the drift checks, apart from the go job: they need no
    # test to have run, and behind that job's tests a gofmt or lint failure
    # showed after forty minutes. gofmt runs first, before anything is
    # built. The drift checks link superscalar's static archive, so the job
    # stages it as engine-rust does; the checkout is restored and never
    # saved from here, since this job builds the archive alone and finishes
    # before the jobs that build the whole dependency.
    name: go-lint (gofmt / golangci-lint / catalog, schema-file types, provider schemas and behavior declarations drift)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then echo "gofmt: files need formatting:"; echo "$out"; exit 1; fi

      - name: Restore the Go build cache
        # The go job's, which its rest shard saves (that job's Setup Go
        # says why); this job only reads it.
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'ir/go.sum', 'runtime/schema/go/go.sum', 'runtime/http/go/go.sum', 'runtime/migrate/go/go.sum', 'extensions/gcp/go.sum', 'extensions/cloudflare/go.sum', 'extensions/embedded/go.sum', 'extensions/resolvers/go.sum', 'extensions/pulumi/go.sum', 'extensions/topcoat/go.sum', 'cmd/superschematic/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Restore the superscalar checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'scripts/lib/archive.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # Builds superscalar's static archive when the checkout above was
        # not restored with it.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Build the superscalar archive
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: scripts/superscalar-dep.sh --archive >/dev/null

      - name: Scalar catalog drift (TypeScript + Python catalogs and the docs' scalar page match the pinned superscalar)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go run ./internal/tools/scalarcatalog -check

      - name: Schema-file types drift (ir/typescript JSON Schema + TypeScript types match the IR)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go run ./internal/tools/schemafiletypes -check

      - name: Behavior config types drift (packages/schema's config schema types match the behaviors' declarations)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go run ./internal/tools/behaviorconfigtypes -check

      - name: Cache the pulumi-gcp, pulumi-cloudflare and pulumi-tls files the extensions and the core pin
        # pulumi-gcp's schema.json is about 90 MB; the tool reads each file
        # from the user cache and checks its digest against the pin either
        # way.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/superschematic/providerschemas
          key: providerschemas-${{ hashFiles('extensions/gcp/schemas/pulumi-gcp.json', 'extensions/cloudflare/schemas/pulumi-cloudflare.json', 'internal/stack/generic/schemas/pulumi-tls.json') }}

      - name: Pinned gcp provider schemas drift (extensions/gcp/schemas match the pinned pulumi-gcp release)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        working-directory: extensions/gcp
        run: go run ./internal/tools/providerschemas -check

      - name: Pinned cloudflare provider schemas drift (extensions/cloudflare/schemas match the pinned pulumi-cloudflare release)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        working-directory: extensions/cloudflare
        run: go run ./internal/tools/providerschemas -check

      - name: Pinned tls provider schema drift (the generic connector's internal/stack/generic/schemas match the pinned pulumi-tls release)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: go run ./internal/tools/providerschemas -check

      - name: Core behavior declarations drift (the engine's, the work queue's, commerce's and the behaviors' core's Rust crates' copies match the core registry)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          make behaviors-check

      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: .

      - name: golangci-lint (ir)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ir
          install-mode: none

      - name: golangci-lint (runtime/schema/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/schema/go
          install-mode: none

      - name: golangci-lint (runtime/http/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/http/go
          install-mode: none

      - name: golangci-lint (runtime/migrate/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/migrate/go
          install-mode: none

      - name: golangci-lint (extensions/gcp)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/gcp
          install-mode: none

      - name: golangci-lint (extensions/cloudflare)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/cloudflare
          install-mode: none

      - name: golangci-lint (extensions/embedded)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: extensions/embedded
