  rust:
    name: rust (http and schema runtime crates, and the engine's schema reader)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runtime/http/rust
            runtime/schema/rust
            runtime/schema/rust-ir

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Check out the superscalar sources
        # The engine's schema reader (runtime/schema/rust-ir) depends on
        # superscalar's core by path ([paths] scalar_rust). Nothing of
        # superscalar is built here but that crate.
        run: scripts/superscalar-dep.sh --checkout

      # superscalar's default lossless-json feature turns on serde_json's
      # arbitrary_precision and preserve_order, and Cargo unifies them into
      # every crate of a build that uses it, so both runtimes' lints and
      # tests run with and without them. The http runtime's run again with
      # its optional http-client feature, with its identity features, whose
      # store and route tests run on SQLite here, and with a stack server's
      # features (D57): postgres, whose tests need a database and skip
      # here, logging, and the two at once, as a worker runs, whose loop's
      # log lines a test reads (D65); gcs, a bucket on GCS (D54), whose
      # tests run against fakes, the fake-gcs-server run skipping here, and
      # beside a worker's two, as a worker with a bucket builds; and otel, a
      # deployable's trace export, alone and with postgres, as a worker
      # builds it, whose message spans a test reads (D67).
      - name: fmt / clippy / test
        working-directory: runtime/http/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features serde_json/arbitrary_precision,serde_json/preserve_order -- -D warnings
          cargo test
          cargo test --features serde_json/arbitrary_precision,serde_json/preserve_order
          cargo clippy --all-targets --features http-client -- -D warnings
          cargo test --features http-client
          cargo clippy --all-targets --features identity -- -D warnings
          cargo clippy --all-targets --features identity-postgres,identity-sqlite -- -D warnings
          cargo test --features identity-postgres,identity-sqlite
          cargo clippy --all-targets --features postgres -- -D warnings
          cargo clippy --all-targets --features postgres,identity-postgres,identity-sqlite -- -D warnings
          cargo test --features postgres,identity-postgres,identity-sqlite
          cargo clippy --all-targets --features logging -- -D warnings
          cargo test --features logging
          cargo clippy --all-targets --features postgres,logging -- -D warnings
          cargo test --features postgres,logging
          cargo clippy --all-targets --features gcs -- -D warnings
          cargo test --features gcs
          cargo clippy --all-targets --features gcs,postgres,logging -- -D warnings
          cargo clippy --all-targets --features otel -- -D warnings
          cargo test --features otel
          cargo clippy --all-targets --features postgres,otel -- -D warnings
          cargo test --features postgres,otel

      - name: schema runtime fmt / clippy / test
        working-directory: runtime/schema/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo test --features serde_json/arbitrary_precision,serde_json/preserve_order

      # The engine's schema reader links superscalar's core, which keeps
      # preserve_order on; it runs with its schemafile feature and without,
      # and again with arbitrary_precision.
      - name: engine schema reader fmt / clippy / test (every vector of both corpora)
        working-directory: runtime/schema/rust-ir
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --all-targets --all-features --features serde_json/arbitrary_precision -- -D warnings
          cargo test
          cargo test --all-features
          cargo test --all-features --features serde_json/arbitrary_precision

  engine-rust:
    # The workspace has the work queue's crate (runtime/engine-workqueue/rust)
    # as a member, so --workspace builds, lints and tests it too.
    name: engine-rust (the Rust engine's workspace)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime/engine/rust

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Check out the superscalar sources
        # The engine reads schemas through runtime/schema/rust-ir, which
        # depends on superscalar's core by path ([paths] scalar_rust).
        # Nothing of superscalar is built here but that crate.
        run: scripts/superscalar-dep.sh --checkout

      - name: Start Postgres
        # The engine's and the storage's tests run on SQLite, and on this
        # Postgres too through SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL, each
        # test in a schema of its own; without the variable they skip the
        # Postgres pass. The image ships contrib's unaccent, which Search's
        # full-text index uses and the engine creates as the superuser.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      # The same commands as `make engine-rust`, inline: the Makefile runs
      # the superscalar and version-graph scripts when it is parsed. Clippy
      # runs on every feature combination (each database alone, both, and
      # neither, and the axum router over one database, as a Rust server
      # takes it), so a build that takes one database still compiles, with
      # the test addon's bridge (all features) and without it (the
      # defaults, as an addon ships).
      - name: fmt / clippy (every feature combination)
        working-directory: runtime/engine/rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features superschematic-engine/sqlite -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features superschematic-engine/postgres -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features superschematic-engine/postgres,superschematic-engine/axum,superschematic-engine-testkit/axum -- -D warnings

      # The test kit's replay of the scenario corpus
      # (runtime/engine/testdata/scenarios) runs here too, on both
      # databases, and of the HTTP corpus through the engine's routes and
      # its axum router; it fails when the corpus is missing. Each replays
      # its files on threads of their own, one per core. The tests of two
      # engines on one database (testkit/tests/replicas_*.rs) run here too;
      # their soaks, `make engine-rust-soak`, do not.
      - name: test (SQLite and Postgres)
        working-directory: runtime/engine/rust
        env:
          SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: cargo test --workspace --all-features

  engine-go:
    name: engine-go (the engine's C ABI, Go binding, corpus replay and link check)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        # The three archives a Go server links are built with this one
        # toolchain (tools.env says why).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            runtime/engine/go/go.sum
            runtime/engine/testdata/linkcheck/go.sum

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runtime/engine/rust
            runtime/versiongraph/rust

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Start Postgres
        # The corpus replay runs on SQLite, and on this Postgres too through
        # SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL, each engine in a schema
        # of its own.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Link check (one binary over superscalar's, the version graph's and the engine's archives)
        # Builds the three archives, checks each defines its own C
        # functions alone (the version graph's vg_* is off in the engine's
        # build), then builds runtime/engine/testdata/linkcheck, which
        # imports all three bindings, and runs it.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
        run: scripts/engine-link-check.sh

      - name: Go binding (build / vet / test over the core's archive)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
        run: |
          CGO_LDFLAGS="$(scripts/engine-archive.sh --print)"
          export CGO_LDFLAGS
          cd runtime/engine/go
          go build ./... && go vet ./... && go test -count=1 ./...

      - name: Corpus replay through enginehttp and Engine.Do (the test kit's archive, on SQLite and Postgres)
        # The HTTP corpus, and the engine's own scenario files through the
        # binding's calls, need the test kit's behaviors and the recorded
        # policies, which the test kit's archive holds; ENGINE_REPLAY_ARCHIVE
        # makes the replay fail rather than skip without it.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          ENGINE_REPLAY_ARCHIVE: "1"
          SUPERSCHEMATIC_ENGINE_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          replay="$RUNNER_TEMP/engine-replay"
          scripts/engine-archive.sh --crate runtime/engine/rust/testkit-ffi --out "$replay" >/dev/null
          export CGO_LDFLAGS="-L$replay"
          cd runtime/engine/go
          go test -count=1 -run Replay -v ./enginehttp/

      - name: golangci-lint (runtime/engine/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/engine/go

  engine-servers:
    # Generated servers mount the engine (D58), end to end, in the full tier
    # alone: servergen's engine entrypoint tests build desk-db's Go, Rust and
    # TypeScript servers, their jobs and runners, queue-db's server over
    # the project's engine archive and desk-ts-api's over the project's
    # engine addon (internal/generator/servergen/testdata/engine), and run
    # each offline and on the Postgres below; and
    # TestEngineServersAnswerOneScriptAlike builds desk-trio-stack's three
    # servers over one engine database, runs one script against each and
    # requires their transcripts to be identical, each step the HTTP corpus
    # records in the corpus's shape, and the three to read what each other
    # wrote and stream what each other commits. They need the three archives
    # a Go server links, the engine's package and its Node-API addon, which
    # the go job does not build, so they skip there and run here, where
    # SUPERSCHEMATIC_REQUIRE_ENGINE_SERVERS and
    # SUPERSCHEMATIC_REQUIRE_TS_CHECKS make a missing one a failure. The
    # Dockerfile tests of the same fixtures run in the go job's full tier.
    name: engine-servers (generated Go, Rust and TypeScript servers over the engine, on Postgres)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # The three archives, the addon and the Rust servers are built with
        # this one toolchain (tools.env says why); the Rust entrypoint test
        # runs clippy and rustfmt on the servers it builds.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runtime/engine/rust
            runtime/versiongraph/rust

      - name: Build the superscalar dependency and the version graph's and the engine's archives
        run: |
          scripts/superscalar-dep.sh
          scripts/versiongraph-archive.sh
          scripts/engine-archive.sh

      - name: Build the http runtime, and the engine's package and addon
        # The engine's package links the http runtime's dist/ into its
        # node_modules; the addon is the core's as a release ships it
        # (runtime/engine/rust/addon), without the test addon's bridge.
        run: |
          (cd runtime/http/typescript && bun install --frozen-lockfile && bun run build)
          (cd runtime/engine/typescript && bun install --frozen-lockfile && bun run build && ../../../scripts/engine-napi.sh)

      - name: Start Postgres
        # A role with a password: the runner's Postgres refuses a
        # passwordless one off its loopback. Each test makes a database of
        # its own on it and drops it after.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: The engine's servers, offline and on Postgres, and one script against three of them
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          SUPERSCHEMATIC_REQUIRE_ENGINE_SERVERS: "1"
          SUPERSCHEMATIC_REQUIRE_TS_CHECKS: "1"
          SUPERSCHEMATIC_IDENTITY_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
          # One target directory for every Rust server the tests build, so
          # the engine's crate and axum compile once.
          CARGO_TARGET_DIR: ${{ runner.temp }}/generated-crates-target
        run: |
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print) $(scripts/versiongraph-archive.sh --print) $(scripts/engine-archive.sh --print)"
          go test -count=1 -timeout 80m -v \
            -run '^(TestEngineEntrypointServes|TestTheEngineReachesCloudSQLThroughASocket|TestEngineProjectArchiveServes|TestRustEngineEntrypointServes|TestTypeScriptEngineEntrypointServes|TestTypeScriptEngineProjectAddonServes|TestEngineServersAnswerOneScriptAlike)$' \
            ./internal/generator/servergen/

  versiongraph:
    name: versiongraph (core crate / Go binding / Rust engine / TypeScript package / Python engine)
    # The scenarios through each language's engine are the full tier; a pull
    # request runs the lints and each package's own tests.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: runtime/versiongraph/go/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: fmt / clippy (native, without the C ABI, and wasm32) / test, and test with serde_json's preserve_order
        # superscalar turns preserve_order on, and Cargo unifies it into every
        # crate of a build that uses it; the content hash must not change.
        # Without the ffi feature is how the engine's archive links the core
        # (D58): the vg_* symbols stay in the version graph's own archive.
        working-directory: runtime/versiongraph/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
          cargo test
          cargo test --no-default-features
          cargo test --features serde_json/preserve_order

      - name: Start Postgres
        # Package canonical checks its vectors' Postgres renderings against
        # it, and the scenarios and the Postgres adapter's tests run on it;
        # each skips without SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL.
        run: |
          docker run --detach --name superschematic-pg \
            --env POSTGRES_PASSWORD=superschematic \
            --publish 5432:5432 \
            "postgres:${POSTGRES_VERSION}-alpine"
          for _ in $(seq 1 60); do
            if docker exec superschematic-pg pg_isready --host 127.0.0.1 --username postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs superschematic-pg
          exit 1

      - name: Go binding, engine, Postgres adapter and SQLite adapter (build / vet / test over the static archive)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          export CGO_LDFLAGS="$(scripts/versiongraph-archive.sh)"
          cd runtime/versiongraph/go
          go build ./... && go vet ./... && go test -count=1 ./...

      - name: Scenarios (every scenario through the Go engine on SQLite, with the SQLite adapter's tests, then on the Postgres adapter)
        # The SQLite pass needs no database; the Postgres pass fails, rather
        # than skips, without one.
        if: github.event_name != 'pull_request'
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: make versiongraph-scenarios

      - name: Rust engine (fmt / clippy)
        working-directory: runtime/versiongraph/rust-engine
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --no-default-features -- -D warnings
          cargo clippy --no-default-features --features rusqlite -- -D warnings

      - name: Rust engine (its own tests, the SQLite adapter's and the SQLite vectors, and every scenario on SQLite, also inside a host's transaction)
        # The quick tier: no database URL, so the Postgres tests skip; the
        # full tier's step below runs them, and every scenario on Postgres.
        working-directory: runtime/versiongraph/rust-engine
        run: cargo test --features rusqlite

      - name: Rust engine and its Postgres and SQLite adapters (every scenario on SQLite and on Postgres, the fixed layout's on Postgres inside a host's transaction too, and every canonical vector through the Rust engine, also with serde_json's preserve_order)
        # The SQLite pass of make versiongraph-scenarios-rust needs no
        # database; its Postgres pass fails, rather than skips, without one.
        # The second run turns serde_json's preserve_order on, as superscalar
        # does, so the canonical rules' key sort is checked.
        if: github.event_name != 'pull_request'
        env:
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: |
          make versiongraph-scenarios-rust
          (cd runtime/versiongraph/rust-engine && cargo test --tests --features rusqlite,serde_json/preserve_order)

      - name: golangci-lint (runtime/versiongraph/go)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: runtime/versiongraph/go

      - name: Setup Node.js
        # The package's test imports the built package under Node too.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: TypeScript package (wasm32 build, typecheck, every vector through the package, every scenario on SQLite, Node load)
        # The only place CI runs the vectors through the wasm build; the
        # typescript job leaves this package to this job.
        working-directory: runtime/versiongraph/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Scenarios through the TypeScript engine (every scenario on SQLite, then on Postgres with the canonical vectors against Postgres, the adapter, the sweeper and the facade)
        # The SQLite pass needs no database; the Postgres pass fails, rather
        # than skips, without one.
        if: github.event_name != 'pull_request'
        env:
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: make versiongraph-scenarios-ts

      - name: Setup Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Scenarios through the Python engine (every scenario on SQLite, then on Postgres with the canonical vectors against Postgres, the adapter, the sweeper and the facade)
        # uv builds the package's PyO3 extension with maturin. The SQLite
        # pass needs no database; the Postgres pass fails, rather than
        # skips, without one.
        if: github.event_name != 'pull_request'
        env:
          SUPERSCHEMATIC_VERSIONGRAPH_TEST_DATABASE_URL: postgres://postgres:superschematic@localhost:5432/postgres?sslmode=disable
        run: make versiongraph-scenarios-python

  docs:
    # Cheap PR gate: npm ci + astro build. superscalar only builds docs in
    # release.yml; this job is D9. It does not deploy.
    name: docs (Starlight build)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          npm run build

  ci-pass:
    # The only required status check on main (repository ruleset "main").
    # Runs even when a needed job fails so the check is always reported, and
    # fails if any needed job failed or was cancelled. A skipped job (dco
    # outside a pull request, acme and engine-servers on one) does not fail
    # it.
    #
    # On a draft every other job skips, and GitHub reports a skipped required
    # check as passing. So a draft's run reports under another name: the
    # required ci-pass stays "expected" on the draft's head until
    # ready_for_review starts the real run, and a draft's empty run can never
    # stand in for a green one.
    name: ${{ github.event.pull_request.draft == true && 'ci-pass (draft -- CI skipped)' || 'ci-pass' }}
    if: always()
    needs:
      - dco
      - scrub
      - go
      - acme
      - typescript
      - python
      - rust
      - engine-rust
      - engine-go
      - engine-servers
      - versiongraph
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say why a draft ran nothing
        if: github.event.pull_request.draft == true
        run: echo "::notice title=Draft::A draft pull request runs no CI. Mark it ready for review to start the run that reports ci-pass."

      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {name: job["result"] for name, job in needs.items()
                 if job["result"] in ("failure", "cancelled")}
          for name, result in sorted(bad.items()):
              print(f"{name}: {result}")
          if bad:
              sys.exit(1)
          print("all gates passed")
          PY
