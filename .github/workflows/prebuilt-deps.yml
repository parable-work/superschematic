name: prebuilt-deps

# The prebuilt dependencies a checkout without Rust stages (D82): the two
# families of Rust build products scripts/prebuilt_deps.py describes,
# superscalar's Go binding with its static archive and its TypeScript
# binding with the napi addon and the browser and workerd builds over its
# WebAssembly core, keyed by the commit in superscalar.pin and the Rust and
# wasm-pack versions in tools.env; and the version-graph core's static
# archive and wasm32 module, keyed by the core's sources and the Rust
# version. superscalar is a repository of its own whose release process
# this one does not drive, so this repository publishes them.
#
#   plan -> build [linux-x64, linux-arm64, darwin-arm64, darwin-x64] -> publish
#
# plan reads each family's key from the checkout and looks for its
# prerelease, prebuilt-<family>-<key>; a family that has one is done. build
# builds every family from source on each platform's runner, as
# scripts/superscalar-dep.sh and scripts/versiongraph-archive.sh do for a
# checkout, the wasm32 module on linux-x64 alone since it is one file for
# every platform, links the core CLI against the archive and runs it, and
# packs the tarballs. publish writes each missing family's manifest.json over
# its tarballs and attaches them to a new prerelease on the commit, and
# prints the prebuilt.pin lines: a maintainer runs `scripts/prebuilt_deps.py
# pin superscalar versiongraph` and opens a pull request with the file, after
# which `scripts/superscalar-dep.sh --prebuilt`, or any build with no cargo on
# PATH, stages them. Until it merges, a checkout without Rust is refused with
# that instruction.
#
# The prerelease tags are not v*, so release.yml and go-module-tag.yml do not
# start on them. Every action is pinned to a commit SHA; tool versions come
# from tools.env only.

on:
  push:
    branches: [main]
    paths:
      - superscalar.pin
      - tools.env
      - runtime/versiongraph/rust/Cargo.toml
      - runtime/versiongraph/rust/Cargo.lock
      - runtime/versiongraph/rust/src/**
      - scripts/prebuilt_deps.py
      - scripts/superscalar-dep.sh
      - scripts/versiongraph-archive.sh
      - .github/workflows/prebuilt-deps.yml
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a later push waits rather than racing a release.
concurrency:
  group: prebuilt-deps
  cancel-in-progress: false

jobs:
  plan:
    name: plan (which families lack a prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for each family's prerelease
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=""
          for family in superscalar versiongraph; do
            tag="$(python3 scripts/prebuilt_deps.py tag "$family")"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$family: $tag is published"
            else
              echo "$family: $tag is missing"
              missing="$missing $family"
            fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: [plan]
    if: needs.plan.outputs.missing != ''
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each os/arch builds natively, on the runner release.yml builds its
          # CLI on.
          - os: ubuntu-latest
            name: linux-x64
            wasm: true
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: darwin-arm64
          - os: macos-15-intel
            name: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Bun
        # Installs the TypeScript binding's build tools and runs napi's.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        # With the wasm32 target, for superscalar's WebAssembly core and the
        # version-graph module; both scripts build with this toolchain.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build superscalar from the pinned commit
        # A fresh build: the prebuilt tarballs hold only what this run built.
        run: SUPERSCALAR_REBUILD=1 scripts/superscalar-dep.sh

      - name: Build the version-graph archive
        run: scripts/versiongraph-archive.sh

      - name: Build the version-graph wasm32 module
        if: matrix.wasm
        run: cd runtime/versiongraph/rust && cargo build --release --target wasm32-unknown-unknown

      - name: Link check (the core CLI over the archive, on this platform)
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="$(scripts/superscalar-dep.sh --print)"
          go build -o "$RUNNER_TEMP/superschematic-core" ./internal/cmd/superschematic-core
          "$RUNNER_TEMP/superschematic-core" catalog scalars >/dev/null

      - name: Pack the tarballs
        env:
          NAME: ${{ matrix.name }}
          WASM: ${{ matrix.wasm && '--wasm' || '' }}
        run: python3 scripts/prebuilt_deps.py pack "$NAME" prebuilt $WASM

      - name: Upload the tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-${{ matrix.name }}
          path: prebuilt/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the missing families
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilt-*
          path: prebuilt
          merge-multiple: true

      - name: Write each manifest and publish its prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ needs.plan.outputs.missing }}
        run: |
          set -euo pipefail
          {
            echo "## Prebuilt dependencies"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for family in $MISSING; do
            tag="$(python3 scripts/prebuilt_deps.py tag "$family")"
            manifest="$(python3 scripts/prebuilt_deps.py manifest prebuilt "$family")"
            digest="$(sha256sum "$manifest" | cut -d' ' -f1)"
            {
              echo "The prebuilt $family dependencies for key \`${tag##*-}\`, built from \`$GITHUB_SHA\` by the prebuilt-deps workflow (D82)."
              echo "\`manifest.json\` lists each tarball's SHA-256; its own is \`$digest\`, which prebuilt.pin pins."
              echo "\`scripts/superscalar-dep.sh --prebuilt\` and \`scripts/versiongraph-archive.sh --prebuilt\` stage them in a checkout without Rust."
            } > notes.md
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Prebuilt $family ${tag##*-}" \
              --notes-file notes.md \
              "prebuilt/$tag"/*
            {
              echo "- \`$tag\`: manifest SHA-256 \`$digest\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "Pin them: \`scripts/prebuilt_deps.py pin superscalar versiongraph\`, then open a pull request with \`prebuilt.pin\`."
          } >> "$GITHUB_STEP_SUMMARY"
