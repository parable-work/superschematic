name: release

# Cut from one `vX.Y.Z` tag (scripts/tag_release.sh). Job graph:
#
#   preflight -> build-archives [linux-x64, linux-arm64, darwin-arm64,
#     darwin-x64], verify (full ci.yml) -> build [the same four],
#     build-migrate -> assemble -> github-release -> publish-npm,
#     publish-pypi, publish-crates, docs-deploy
#
# preflight reads the version from the tag and refuses a tag whose version the
# tree does not carry (scripts/bump_version.py against versions.env).
# build-archives, beside verify, packs per runner the static archives a
# generated Go server links through cgo, which no module the module proxy
# serves carries: superscalar's, built from the pinned checkout, the
# version graph's, the engine's and the behaviors' core's (each of the last
# two with its C ABI's header; D58, D103), all with tools.env's Rust, so
# they link into one binary, which the runner's link
# check proves on each of the four platforms (scripts/release-archives.sh,
# scripts/engine-link-check.sh; docs/stack-model.md, section 8.2; D47,
# amended; D58), and packs the engine's prebuilt Node-API addon for its
# platform as the npm package @superschematic/engine-<target> (darwin-arm64,
# darwin-x64, linux-x64-gnu, linux-arm64-gnu), the core's addon built with
# the dist profile, LTO and stripped (scripts/release-engine-addon.sh,
# which loads it and opens an engine on it first). build produces, per runner, the superschematic CLI for its
# os/arch: the installed binary, cmd/superschematic, which links the core and
# the official extensions (docs/stack-model.md, section 13), and beside it
# superschematic-topcoat, extensions/topcoat's command, which links the
# Topcoat extension too and builds a stack whose app needs it (D78). Each
# links the superscalar archive its platform's tarball holds, and every
# tarball's digest (internal/release), which the Dockerfiles and workflows
# it generates pin; each runner records the commit it built from.
# Each runner also builds the identity runner, superschematic-identity, from
# runtime/http/go: it reads scalars through superscalar's Go binding, so it
# needs cgo as the CLI does, and links the same archive.
# build-migrate cross-compiles the migration runner, superschematic-migrate,
# for the same four os/arch pairs on one runner, since it needs no cgo, and
# records the commit too. assemble refuses a set whose binaries and archives
# disagree on that commit, writes SHA256SUMS over every tarball, the two
# CLIs' among them, packs the npm tarballs beside
# the four addon packages, eighteen in all, @superschematic/engine naming the
# addon packages as optional dependencies at the release's version, and
# builds the PyPI sdist and wheel.
# github-release attaches everything to a GitHub release with build provenance
# and an SBOM. The three publish jobs use trusted publishing (OIDC; no
# registry tokens in this repository) and are gated on the repository variable
# RELEASE_PUBLISH_ENABLED. The Go modules need no publish step: `go get`
# reads the tags, which go-module-tag.yml cuts on the same push.
#
# `workflow_dispatch` with dry_run runs preflight, verify, both builds and
# assemble on any branch and uploads the assembled assets as a workflow
# artifact (release-assets). It creates no release, publishes nothing and
# deploys nothing. release-candidate.yml dispatches it on main twice a day
# (D40): it is main's full CI run, since merges run none.
#
# Every action is pinned to a commit SHA; tool versions come from tools.env
# only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and assemble only (no release, publish or deploy). The only supported value is true; releases come from a v* tag."
        type: boolean
        default: true

# Least-privilege default; every job that needs more escalates only the scopes
# it needs (id-token for trusted publishing and provenance, contents for the
# release, attestations for provenance, pages for docs).
permissions:
  contents: read

# Serialize releases per ref so two tag pushes cannot publish overlapping
# artifact sets; never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight (tag matches the tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      pep440: ${{ steps.v.outputs.pep440 }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_dist_tag: ${{ steps.v.outputs.npm_dist_tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version and release mode
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN_INPUT" != "true" ]; then
              echo "workflow_dispatch only supports dry_run=true; a release is cut from a v* tag (scripts/tag_release.sh)" >&2
              exit 1
            fi
            dry_run=true
            python3 scripts/bump_version.py check
            version="$(python3 scripts/bump_version.py current)"
            tag="v$version"
          else
            dry_run=false
            tag="$REF_NAME"
            version="${tag#v}"
            # Refuses a tag whose version the tree does not carry.
            python3 scripts/bump_version.py check --expect "$version"
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          npm_dist_tag=latest
          if [ "$prerelease" = true ]; then npm_dist_tag=next; fi
          {
            echo "version=$version"
            echo "pep440=$(python3 scripts/bump_version.py pep440 "$version")"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "npm_dist_tag=$npm_dist_tag"
            echo "dry_run=$dry_run"
          } | tee -a "$GITHUB_OUTPUT"

  verify:
    name: verify (full ci)
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-archives:
    name: build archives ${{ matrix.name }}
    # Beside verify: nothing it builds is released unless verify passes,
    # since build and then assemble need both.
    needs: [preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each os/arch builds natively, on the runner its CLI builds on.
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: darwin-arm64
          - os: macos-15-intel
            name: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        # The scripts read the platform from go env, and the link check
        # builds a Go binary.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Setup Bun
        # The napi CLI the engine's package pins, installed with its
        # dependencies, builds the addon.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        # Loads the addon before it is packed, and packs it.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and pack the static archives
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NAME: ${{ matrix.name }}
        run: scripts/release-archives.sh "$VERSION" "$NAME" dist

      - name: Link check (one binary over the four archives, on this platform)
        # The archives the tarball packed, already built: each defines its
        # own C functions alone, and one Go binary that imports the
        # superscalar, version graph, engine and rules bindings links them
        # and runs.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
        run: scripts/engine-link-check.sh

      - name: Build and pack the engine's addon package
        # @superschematic/engine-<target>, the core's addon for this
        # platform, built with the dist profile (fat LTO, one codegen unit,
        # symbols stripped) and loaded before it is packed: the core's, the
        # facade's contract, no test bridge, an engine on SQLite with the
        # core's behaviors, the work queue's and the commerce ones (D70). On
        # Linux it logs the newest glibc symbol version it needs, the oldest
        # glibc it loads on.
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NAME: ${{ matrix.name }}
        run: scripts/release-engine-addon.sh "$VERSION" "$NAME" dist

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-archives-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload the addon package
        # The same commit as the archives tarball beside it, whose
        # BUILD_COMMIT assemble checks: one job built both.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-addon-${{ matrix.name }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.name }}
    needs: [preflight, verify, build-archives]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # The CLI links the superscalar archive through cgo: the core reads
          # its scalars through superscalar's Go binding (D3), so the
          # compiler needs cgo itself, not only the generated code it
          # writes. Every os/arch builds natively on a runner of that os/arch
          # rather than cross-compiling. ubuntu-24.04-arm is free on public
          # repositories; while the repository is private it needs a
          # larger-runner entitlement on the organization.
          - os: ubuntu-latest
            name: linux-x64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            goos: linux
            goarch: arm64
          - os: macos-latest
            name: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            name: darwin-x64
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        # Emit only real KEY=VALUE pins; $GITHUB_ENV rejects '#' comments/blanks.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # The installed binary's module requires the core's dependencies
          # and the extensions'; superschematic-topcoat's, those and
          # Topcoat's; the identity runner's module, the HTTP runtime's and
          # the drivers.
          cache-dependency-path: |
            cmd/superschematic/go.sum
            extensions/topcoat/go.sum
            runtime/http/go/go.sum

      - name: Download the static archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-archives-*
          path: archives
          merge-multiple: true

      - name: Build the CLIs
        # superschematic, the installed binary, and superschematic-topcoat,
        # the installed binary with the Topcoat extension linked too (D44,
        # amended; D78), which a generated workflow installs for a stack
        # whose app needs it as it installs superschematic (D47, amended).
        # Both are built the same way, against the same archives, with the
        # same digests linked in, and packed the same way.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.preflight.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # Every platform's archives tarball, by digest, which the CLIs
          # pin in the Dockerfiles and workflows they generate.
          digests=""
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            tarball="archives/superschematic-archives_${VERSION}_${platform}.tar.gz"
            digests="${digests:+$digests,}$platform=$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
          done
          # The CLIs link the superscalar archive their own platform's
          # tarball holds, the one a server they generate downloads.
          tar -xzf "archives/superschematic-archives_${VERSION}_${NAME}.tar.gz" -C archives
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/archives/superschematic-archives_${VERSION}_${NAME}/lib"
          digests_flag="-X github.com/parable-work/superschematic/internal/release.archiveDigests=$digests"
          # build_cli <binary> <module> <package> <readme> builds one CLI
          # with the Makefile's GO_BUILD_FLAGS plus stripping: no checkout
          # paths and no VCS stamp in the binary. BUILD_COMMIT names the
          # commit instead. Each CLI's module is a module of its own, so
          # the build runs in it; its replace lines reach the core and the
          # extensions in this checkout. The binary must run, report the
          # release's version and hold the digests.
          build_cli() {
            local bin="$1" module="$2" package="$3" readme="$4"
            local out="dist/${bin}_${VERSION}_${NAME}"
            mkdir -p "$out"
            (cd "$module" && go build -trimpath -buildvcs=false -ldflags "-s -w $digests_flag" \
              -o "$GITHUB_WORKSPACE/$out/$bin" "$package")
            "$out/$bin" --help >/dev/null
            local got
            got="$("$out/$bin" --version)"
            if [ "$got" != "$bin version $VERSION" ]; then
              echo "the $NAME $bin reports \"$got\", not $bin version $VERSION" >&2
              exit 1
            fi
            # -X leaves no trace when it names no variable, and go version
            # -m records no -ldflags under -trimpath, so the check reads
            # the digests from the binary itself.
            if ! grep -qaF -- "$digests" "$out/$bin"; then
              echo "$out/$bin was not linked with the archives' digests" >&2
              exit 1
            fi
            cp LICENSE "$out/"
            cp "$readme" "$out/README.md"
            # The commit every binary must agree on; assemble refuses a
            # set built from more than one.
            printf '%s\n' "$GITHUB_SHA" > "$out/BUILD_COMMIT"
            tar -C dist -czf "dist/${bin}_${VERSION}_${NAME}.tar.gz" "${bin}_${VERSION}_${NAME}"
          }
          build_cli superschematic cmd/superschematic . README.md
          build_cli superschematic-topcoat extensions/topcoat ./cmd/superschematic-topcoat extensions/topcoat/README.md
          ls -l dist

      - name: Build the identity runner
        # superschematic-identity holds the database drivers, so it is a
        # binary of its own beside the CLI (D27, D50), linked against the
        # same superscalar archive. The version it reports is stamped as the
        # migration runner's is (superschematic-identity version).
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.preflight.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # The superscalar archive the CLIs' step unpacked, its platform's.
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/archives/superschematic-archives_${VERSION}_${NAME}/lib"
          out="dist/superschematic-identity_${VERSION}_${NAME}"
          mkdir -p "$out"
          (cd runtime/http/go && go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$VERSION" \
            -o "$GITHUB_WORKSPACE/$out/superschematic-identity" ./cmd/superschematic-identity)
          got="$("$out/superschematic-identity" version)"
          if [ "$got" != "superschematic-identity $VERSION" ]; then
            echo "the $NAME identity runner reports \"$got\", not superschematic-identity $VERSION" >&2
            exit 1
          fi
          cp LICENSE "$out/"
          cp runtime/http/go/README.md "$out/README.md"
          printf '%s\n' "$GITHUB_SHA" > "$out/BUILD_COMMIT"
          tar -C dist -czf "dist/superschematic-identity_${VERSION}_${NAME}.tar.gz" "superschematic-identity_${VERSION}_${NAME}"
          ls -l dist

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-migrate:
    name: build superschematic-migrate (linux, darwin; x64, arm64)
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: runtime/migrate/go/go.sum

      - name: Build the migration runner
        # The runner needs no cgo, so this one runner cross-compiles all four
        # os/arch pairs. The CLI's flags, plus the version the binary reports
        # (superschematic-migrate version).
        working-directory: runtime/migrate/go
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          for target in linux-x64:linux:amd64 linux-arm64:linux:arm64 darwin-arm64:darwin:arm64 darwin-x64:darwin:amd64; do
            IFS=: read -r name goos goarch <<<"$target"
            out="$dist/superschematic-migrate_${VERSION}_${name}"
            mkdir -p "$out"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "$out/superschematic-migrate" ./cmd/superschematic-migrate
            # The binary is for the os/arch its name says, without cgo.
            meta="$(go version -m "$out/superschematic-migrate" | awk '$1 == "build" { print $2 }')"
            for want in "GOOS=$goos" "GOARCH=$goarch" CGO_ENABLED=0; do
              if ! grep -qx "$want" <<<"$meta"; then
                echo "$out/superschematic-migrate was not built with $want" >&2
                exit 1
              fi
            done
            cp "$GITHUB_WORKSPACE/LICENSE" "$out/"
            cp ../README.md "$out/README.md"
            printf '%s\n' "$GITHUB_SHA" > "$out/BUILD_COMMIT"
            tar -C "$dist" -czf "$dist/superschematic-migrate_${VERSION}_${name}.tar.gz" "superschematic-migrate_${VERSION}_${name}"
          done
          # This runner is linux/amd64, so it runs that binary.
          got="$("$dist/superschematic-migrate_${VERSION}_linux-x64/superschematic-migrate" version)"
          if [ "$got" != "superschematic-migrate $VERSION" ]; then
            echo "the linux-x64 binary reports \"$got\", not superschematic-migrate $VERSION" >&2
            exit 1
          fi
          ls -l "$dist"

      - name: Upload the tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-migrate
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble (one commit, checksums, npm tarballs, PyPI dists)
    needs: [preflight, build, build-migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache the superscalar checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/superscalar
            !third_party/superscalar/target
          key: superscalar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('superscalar.pin', 'scripts/superscalar-dep.sh', 'tools.env') }}

      - name: Install Rust toolchain
        # The schema runtime's TypeScript build links the superscalar binding
        # from the pinned checkout (scripts/link-local-deps.mjs), and the
        # version-graph and rules packages ship their cores built for wasm32.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        # scripts/superscalar-dep.sh builds superscalar's browser and workerd
        # builds over its WebAssembly core with it, for the wasm32 target
        # the toolchain above carries (D55, amended; D64).
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Build the superscalar dependency
        run: scripts/superscalar-dep.sh

      - name: Download every build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: builds
          merge-multiple: true

      - name: Refuse a set built from more than one commit; write SHA256SUMS
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mv builds/*.tar.gz release-assets/
          cd release-assets
          # Four tarballs each of the CLI, superschematic-topcoat, the
          # identity runner, the migration runner and the archives.
          for bin in superschematic superschematic-topcoat superschematic-identity superschematic-migrate superschematic-archives; do
            count="$(ls "${bin}_${VERSION}"_*.tar.gz | wc -l)"
            if [ "$count" -ne 4 ]; then
              echo "expected 4 $bin tarballs, found $count" >&2
              exit 1
            fi
          done
          for tgz in *.tar.gz; do
            tar -xzf "$tgz" --wildcards -O '*/BUILD_COMMIT'
          done | sort -u > commits.txt
          if [ "$(wc -l < commits.txt)" -ne 1 ] || [ "$(cat commits.txt)" != "$GITHUB_SHA" ]; then
            echo "the binaries and archives were not all built from $GITHUB_SHA:" >&2
            cat commits.txt >&2
            exit 1
          fi
          rm commits.txt
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Pack the npm tarballs
        # The five authoring packages ship their TypeScript source; the
        # schema runtime, the http runtime, the engine and the engine's
        # work-queue package ship their compiled dist; the version-graph
        # package ships its compiled dist and the core's wasm module, and
        # the rules package its compiled dist and the behaviors' core's
        # wasm module (D103); the schema IR ships its declarations and the
        # schema-file JSON Schema.
        # The four addon packages, @superschematic/engine-<target>, which
        # build-archives packed on each platform's runner, ship the core's
        # Node-API addon for their platform; the engine names each as an
        # optional dependency at the release's version, of which npm
        # installs the one whose os, cpu and libc match the host, and its
        # loader requires it.
        # The engine builds after the http runtime, whose dist/ its link
        # script copies, and the work-queue package after the engine, which
        # its link script links. The engine is the Rust engine's addon (D58)
        # and depends on no other package of the release at install time; no
        # tarball may carry a file:, link: or workspace: spec. npm pack
        # writes superschematic-<name>-<version>.tgz for a scoped
        # @superschematic/<name>.
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/npm
          addons=(darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu)
          for target in "${addons[@]}"; do
            mv "builds/superschematic-engine-${target}-${VERSION}.tgz" release-assets/npm/
          done
          optional=()
          for target in "${addons[@]}"; do
            optional+=("optionalDependencies.@superschematic/engine-${target}=$VERSION")
          done
          for pkg in schema db api schema-config stack memory-store; do
            (cd "packages/$pkg" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          done
          (cd ir/typescript && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/schema/typescript && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/http/typescript && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/versiongraph/typescript && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/rules/typescript && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/engine/typescript && bun install --frozen-lockfile && bun run build \
            && npm pkg set "${optional[@]}" \
            && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/engine-workqueue/typescript && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          (cd runtime/engine-commerce/typescript && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/npm" >/dev/null)
          ls -l release-assets/npm
          test "$(ls release-assets/npm/*.tgz | wc -l)" -eq 18
          python3 scripts/npm_local_specs.py release-assets/npm/*.tgz

      - name: Build the PyPI sdist and wheel
        working-directory: runtime/schema/python
        run: |
          set -euo pipefail
          uv build --out-dir "$GITHUB_WORKSPACE/release-assets/python"
          ls -l "$GITHUB_WORKSPACE/release-assets/python"

      - name: Upload the assembled release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: github release + attestations
    needs: [preflight, assemble]
    if: needs.preflight.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Generate the SBOM (SPDX) for the release commit
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-assets/superschematic-${{ needs.preflight.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        # The org is on GitHub Enterprise Cloud, so attestations work while the
        # repository is private; they are free once it is public.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/npm/*.tgz
            release-assets/python/*

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-assets/superschematic-${{ needs.preflight.outputs.version }}.spdx.json
          sbom-path: release-assets/superschematic-${{ needs.preflight.outputs.version }}.spdx.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "## Artifacts"
            echo
            echo "The CLI is \`superschematic_${VERSION}_<platform>.tar.gz\`, the CLI with the Topcoat extension linked too \`superschematic-topcoat_${VERSION}_<platform>.tar.gz\`, the identity runner \`superschematic-identity_${VERSION}_<platform>.tar.gz\` and the migration runner \`superschematic-migrate_${VERSION}_<platform>.tar.gz\`, for linux-x64, linux-arm64, darwin-x64 and darwin-arm64."
            echo "\`superschematic-archives_${VERSION}_<platform>.tar.gz\` holds the static archives a generated Go server links through cgo, superscalar's, the version graph's, the engine's and the behaviors' core's, under \`lib/\`, and the engine's and the behaviors' core's C ABI headers under \`include/\`: build with \`CGO_LDFLAGS=-L<dir>/lib\`. The CLI pins each one's digest in the Dockerfiles and workflows it generates."
            echo "\`@superschematic/engine\` installs the engine's prebuilt Node-API addon from \`@superschematic/engine-<target>\`, one npm package per platform: darwin-arm64, darwin-x64, linux-x64-gnu and linux-arm64-gnu."
            echo "Every binary was built from commit \`$GITHUB_SHA\` and is listed in \`SHA256SUMS\`."
            echo "Verify provenance with: \`gh attestation verify <asset> --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "Go modules: \`go get github.com/${GITHUB_REPOSITORY}@$TAG\`, \`.../ir@$TAG\`, \`.../runtime/schema/go@$TAG\`, \`.../runtime/http/go@$TAG\`, \`.../runtime/versiongraph/go@$TAG\`, \`.../runtime/engine/go@$TAG\`, \`.../runtime/rules/go@$TAG\`, \`.../runtime/migrate/go@$TAG\`."
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            --verify-tag \
            --title "superschematic $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}" \
            release-assets/*.tar.gz release-assets/SHA256SUMS release-assets/*.spdx.json \
            release-assets/npm/*.tgz release-assets/python/*

  # ---------------------------------------------------------------------------
  # Trusted publishing. All three jobs are gated on the repository variable
  # RELEASE_PUBLISH_ENABLED (Settings -> Secrets and variables -> Actions ->
  # Variables), set to "true" after registering the trusted publisher on each
  # registry. Until then the release stops at the GitHub release. Each job
  # header states the exact registration it expects.
  # ---------------------------------------------------------------------------

  publish-npm:
    name: publish npm
    # Registration (npmjs.com -> package -> Settings -> Trusted Publisher, once
    # per package; the eighteen exact names are
    #   @superschematic/schema
    #   @superschematic/db
    #   @superschematic/api
    #   @superschematic/schema-config
    #   @superschematic/stack
    #   @superschematic/memory-store
    #   @superschematic/schema-ir
    #   @superschematic/schema-runtime
    #   @superschematic/http-runtime
    #   @superschematic/versiongraph
    #   @superschematic/rules
    #   @superschematic/engine-darwin-arm64
    #   @superschematic/engine-darwin-x64
    #   @superschematic/engine-linux-x64-gnu
    #   @superschematic/engine-linux-arm64-gnu
    #   @superschematic/engine
    #   @superschematic/engine-workqueue
    #   @superschematic/engine-commerce
    # with organization or user: parable-work, repository: superschematic,
    #   workflow filename: release.yml, environment name: npm, allowed
    #   actions: npm publish as well as npm stage publish).
    # The @superschematic scope is an organization on npmjs.com that must
    # exist and be owned by the publisher before RELEASE_PUBLISH_ENABLED is
    # set. npm generates provenance on its own for trusted publishing.
    # Pre-releases go to the `next` dist-tag, releases to `latest`.
    needs: [preflight, github-release]
    if: needs.preflight.outputs.dry_run == 'false' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Publish the eighteen packages
        # The tarballs are the attested release assets, byte for byte. Order:
        # @superschematic/schema first, since the other authoring packages
        # name it in their docs, @superschematic/stack after it and
        # @superschematic/schema-config, its peers, @superschematic/schema-ir
        # before the schema runtime, which a consumer installs next to it,
        # the engine after both, which it needs next to it, and after its
        # four addon packages, its optional dependencies at the release's
        # version, which an install that finds none skips, and the engine's
        # work-queue and commerce packages last, after the engine, their
        # peer; no other package of the eighteen depends on another at
        # install time.
        env:
          DIST_TAG: ${{ needs.preflight.outputs.npm_dist_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [maj, min, pat] = process.versions.npm.split(".").map(Number); if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }'
          cd release-assets/npm
          for name in schema db api schema-config stack memory-store schema-ir schema-runtime http-runtime versiongraph rules \
            engine-darwin-arm64 engine-darwin-x64 engine-linux-x64-gnu engine-linux-arm64-gnu engine engine-workqueue engine-commerce; do
            tgz="superschematic-${name}-${VERSION}.tgz"
            echo "==> $tgz"
            npm publish "./$tgz" --access public --tag "$DIST_TAG"
          done

  publish-pypi:
    name: publish PyPI
    # Registration (pypi.org -> Your projects -> Publishing -> "Add a new
    # pending publisher" for the project superschematic-schema-runtime):
    #   owner: parable-work, repository name: superschematic,
    #   workflow name: release.yml, environment name: pypi
    # PyPI accepts a pending publisher for a project that does not exist yet;
    # the first publish creates it. Pre-release versions (0.1.0a1 and the
    # like) are ordinary uploads that pip skips unless asked for --pre.
    needs: [preflight, github-release]
    if: needs.preflight.outputs.dry_run == 'false' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Publish sdist + wheel with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-assets/python

  publish-crates:
    name: publish crates.io
    # Registration, for each crate below (crates.io -> <crate> -> Settings ->
    # Trusted Publishing):
    #   repository owner: parable-work, repository: superschematic,
    #   workflow filename: release.yml, environment: crates-io
    # crates.io only accepts a trusted publisher for a crate that already
    # exists, so the first version is published by hand with a personal
    # token, then the publisher is registered and the variable is flipped.
    needs: [preflight, github-release]
    if: needs.preflight.outputs.dry_run == 'false' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # A generated Rust types crate depends on the schema runtime by version
      # when the naming file sets no [paths] schema_runtime_rust.
      - name: Publish the schema runtime crate at the tag version
        working-directory: runtime/schema/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Publish the http runtime crate at the tag version
        working-directory: runtime/http/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  docs-deploy:
    name: docs (Starlight) to GitHub Pages
    # GitHub Pages is not available on a private repository on this plan
    # without GitHub Enterprise Pages settings, so the deploy waits for the
    # visibility flip; docs still build in ci. Enable Pages (Settings -> Pages,
    # source: GitHub Actions) when the repository goes public.
    needs: [preflight, github-release]
    if: needs.preflight.outputs.dry_run == 'false' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' tools.env >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          npm run build

      # Belt and braces: if the build produced no index.html, do not deploy.
      - name: Upload Pages artifact
        if: hashFiles('docs/dist/index.html') != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        if: hashFiles('docs/dist/index.html') != ''
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
